# セリフくじの台本: ナレーション（男性）
# このフォルダ内の *.yaml はすべて読み込まれ、1つの台本として扱われる。id はフォルダ全体で重複不可
#
# kind: narration / dialogue
# seconds: 10 / 20 / 30
# gender: male / female / any（不問）
# category: ナレーションはジャンル名、セリフは場面の種類。新しい語を書くと画面の選択肢に増える
# tone: 読み方。ストレート / シリアス / ダイナミック / ソフト / クール / ゴージャス /
#       エモーショナル / コミカル / ミステリアス / フレンドリー / ハイテンション / ウィスパー
# situation: どこで、誰が、何のために読むか
# tags: 雰囲気タグ。静 / 動 / 笑 / 涙 / 緊張 / 温 から1〜2個
#
# 構成ルール（tests/test_lines_file.py で検証）
#   ジャンル・タグ・読み方のどれか1つで絞っても、男性/女性/不問それぞれ5本以上残ること
#   男性/女性/不問はそれぞれ30本以上
lines:
  - id: n001
    kind: narration
    text: "ひとつのねじから、六十年。葉山精機の始まりは、この街の小さな町工場でした。片隅の旋盤で生まれた技術は、いま、橋を、鉄道を、そして暮らしを、静かに支えています。変わらないのは、ものづくりへの誠実さ。変えていくのは、その先にある未来です。葉山精機は、次の六十年も、あなたのそばにいます。"
    tags: [静]
    tone: ストレート
    situation: "工場の空撮から社屋、製品の実写へつなぐ企業VPの冒頭"
    seconds: 30
    gender: male
    category: 企業VP
  - id: n005
    kind: narration
    text: "泥道も、雪道も、夜の峠も。新型SUV、ヤマセ。アクセルを踏めば、景色のほうが、追いつけない。"
    tags: [動]
    tone: ダイナミック
    situation: "峠道を駆け抜けるSUVの走行シーンに乗せる自動車CMの全編"
    seconds: 10
    gender: male
    category: テレビCM
  - id: n008
    kind: narration
    text: "やあ、お疲れさま。今日も一日、よく頑張ったね。帰り道、ちょっと寄り道しない？駅前のパン屋、こむぎ堂。夕方五時から、焼きたてのカレーパンが、ずらっと並ぶんだ。外はカリッと、中はとろり。ひと口かじれば、今日の疲れなんて、どこかへ飛んでいくよ。こむぎ堂は、夜八時まで。さあ、待ってるからね。"
    tags: [温]
    tone: フレンドリー
    situation: "夕方の帰宅時間帯に流れる地元パン屋のラジオCM全編"
    seconds: 30
    gender: male
    category: ラジオCM
  - id: n009
    kind: narration
    text: "昭和二十年、夏。この町は、一夜にして、すべてを失った。焼け跡に残されたのは、一本の、焦げた柱だけだった。人々は、その柱のまわりに、再び家を建て、畑を耕し、子どもを育てた。なぜ、人々はここに戻ってきたのか。生き残った者たちの証言から、八十年という沈黙が、いま、静かにほどけていく。"
    tags: [緊張, 静]
    tone: シリアス
    situation: "白黒の空襲写真から現在の町並みへ切り替わる戦後史番組の導入"
    seconds: 30
    gender: male
    category: ドキュメンタリー
  - id: n013
    kind: narration
    text: "さあ、やってまいりました！本日の対決は、激辛ラーメン、十杯早食い！挑むのは、芸人歴二十年、この男だ！"
    tags: [動, 笑]
    tone: ハイテンション
    situation: "挑戦者がラーメン店に入場する大食い企画のオープニング"
    seconds: 10
    gender: male
    category: バラエティ
  - id: n017
    kind: narration
    text: "今夜、決戦の火ぶたが切られる。首位を走る、北浜ブレイカーズ。追うのは、七連勝中の、南条サンダース。マウンドには、剛速球の若きエース、黒崎。打席には、本塁打王、三ツ矢。すべてを懸けた一球が、いま、放たれる。"
    tags: [動, 緊張]
    tone: ダイナミック
    situation: "ナイター中継の開始前に両チームの選手を紹介する煽り映像"
    seconds: 20
    gender: male
    category: スポーツ
  - id: n019
    kind: narration
    text: "その一撃が、世界の均衡を砕いた。海を割り、空を裂き、七つの王国が今、ひとつの戦場に集う。守るべきものを背負った者だけが、最後まで立っていられる。劇場版『蒼穹の灯火』、来春、全国公開。"
    tags: [動, 緊張]
    tone: ダイナミック
    situation: "劇場で本編前に流れる大作ファンタジー映画の予告編"
    seconds: 20
    gender: male
    category: 映画・作品予告
  - id: n023
    kind: narration
    text: "血圧とは、心臓から送り出された血液が、血管の壁を押す力のことです。収縮期と拡張期、二つの数値で表され、単位は水銀柱ミリメートル。正確な値を得るには、測定の前に数分間、安静を保つことが欠かせません。"
    tags: [緊張, 静]
    tone: クール
    situation: "病院の待合室モニターで流れる健康解説映像の一節"
    seconds: 20
    gender: male
    category: 医療・科学技術
  - id: n026
    kind: narration
    text: "夜が、深い。灯りを落とした部屋で、彼はページをめくる。紙の音だけが、そっと、時間を進めていく。"
    tags: [静]
    tone: ウィスパー
    situation: "睡眠導入向けオーディオブックの、物語の静かな導入部"
    seconds: 10
    gender: male
    category: オーディオブック
  - id: n030
    kind: narration
    text: "ご来園の皆様に、迷子のお知らせです。園内で、お父さんが迷子になっております。青いシャツに麦わら帽子、年齢はおよそ四十歳。心当たりのあるお子様は、中央ゲート横のインフォメーションまで、お迎えにお越しください。"
    tags: [笑]
    tone: コミカル
    situation: "遊園地の園内放送、迷子案内を装った来園者向けの小ネタ"
    seconds: 20
    gender: male
    category: アナウンス
  - id: n031
    kind: narration
    text: "第一回の会場は、木造校舎の教室ひとつ。並んだ作品は、十二点でした。それから百年。今夜このホールには、四十の国から届いた三千の作品と、それを生み出した手が、集まっています。筆を、のみを、カメラを握ってきた、すべての手に、敬意を込めて。第百回全国創作芸術祭、ただいま、開幕いたします。どうぞ、惜しみない拍手を。"
    tags: [動]
    tone: ゴージャス
    situation: "芸術祭の開会式でホールに流れるオープニング映像"
    seconds: 30
    gender: male
    category: イベント・式典
  - id: n035
    kind: narration
    text: "かつてこの大陸には、七つの月が昇っていたという。しかし今、空に残るのはただひとつ。消えた六つの月はどこへ行ったのか。記録は焼かれ、語り部は口を閉ざした。残されたのは、塔の地下に眠る石板と、その文字を読める、たったひとりの旅人。……そう、お前だ。失われた月の行方を追え。だが忘れるな。真実を知る者は、二度と元の場所へは戻れない。"
    tags: [静]
    tone: ミステリアス
    situation: "RPGのタイトル画面から始まる、世界観を語るオープニング"
    seconds: 30
    gender: male
    category: ゲーム内ナレーション
  - id: n037
    kind: narration
    text: "家は、建てて終わりではありません。十年後、二十年後、そこで笑う家族の声まで、わたしたちは設計します。ひだまり工務店は、暮らしの続きを一緒に描くパートナーでありたいと願っています。"
    tags: [温]
    tone: ソフト
    situation: "住宅メーカーの企業VPで、家族が新居に引っ越す映像に乗せる本編"
    seconds: 20
    gender: male
    category: 企業VP
  - id: n038
    kind: narration
    text: "午前三時、ビルの非常階段。懐中電灯の光が、今夜も三百六十段を上る。守るとは、見回ることだ。鷹羽警備保障。"
    tags: [緊張]
    tone: シリアス
    situation: "警備会社の企業VPで、夜の巡回映像に重ねる理念パート"
    seconds: 10
    gender: male
    category: 企業VP
  - id: n039
    kind: narration
    text: "誤差は、千分の一ミリ以下。それでも、わたしたちは満足しない。クリーンルームの静寂の中で、今日も検査は続く。一つの部品が、世界の信頼を支えている。見えないところに、確かな技術を。ミナト精機。"
    tags: [緊張, 静]
    tone: クール
    situation: "精密部品メーカーの企業VPで、クリーンルームの検査工程に乗せる本編"
    seconds: 20
    gender: male
    category: 企業VP
  - id: n040
    kind: narration
    text: "創業百年。ひとつの灯りから始まった物語は、いま、世界の十二の都市へと広がりました。磨き上げられた大理石のロビー、一杯の紅茶に込めたもてなし。時代が変わっても、わたしたちが追い求めるものは変わりません。それは、お客様の記憶に残る一夜。グランシエル・ホテルズ。次の百年へ、新しい扉を開きます。"
    tags: [動]
    tone: ゴージャス
    situation: "ホテルグループの創業百年記念VPで、各都市のホテル映像に乗せる全編"
    seconds: 30
    gender: male
    category: 企業VP
  - id: n050
    kind: narration
    text: "押し入れの奥で、二十年眠っていたビデオテープ。再生する機械は、もう家にはない。でも、そこには、若かった父の声と、まだ小さかったあなたの笑い声が残っています。「おもいでダビング」は、劣化したテープを一本ずつ丁寧に修復し、スマートフォンで見られるかたちにしてお届けします。忘れていたはずの一日が、もう一度、動き出します。"
    tags: [涙, 温]
    tone: エモーショナル
    situation: "ビデオテープのデジタル化サービス紹介動画で、古い家族映像に乗せる本編"
    seconds: 30
    gender: male
    category: 商品・サービス紹介
  - id: n051
    kind: narration
    text: "書き味を決めるのは、ペン先の角度です。ツバキ万年筆、十四金のニブを、職人がひとつずつ調整しています。"
    tags: [静]
    tone: ストレート
    situation: "万年筆の商品紹介動画で、ペン先の調整作業を接写した映像に乗せる解説"
    seconds: 10
    gender: male
    category: 商品・サービス紹介
  - id: n052
    kind: narration
    text: "地震の直後、火災の多くは、復旧した電気から始まります。倒れた電気ストーブ、傷ついたコード。「ガードブレーカー」は、震度五強以上の揺れを感知した瞬間、自動で家の電気を遮断します。その備えは、まだ間に合います。"
    tags: [緊張]
    tone: シリアス
    situation: "感震ブレーカーの商品紹介動画で、地震後の火災再現映像に乗せる解説"
    seconds: 20
    gender: male
    category: 商品・サービス紹介
  - id: n053
    kind: narration
    text: "最初の一音で、部屋の空気が変わる。「アルテミス・サウンド」のフラッグシップスピーカー、モデル・ノワール。北欧の工房で三年乾燥させた無垢材のキャビネットが、低音に深みを、高音に輝きを与えます。オーケストラの最後列、ティンパニの皮が震えるその気配まで、あなたのリビングに。音楽を聴くのではなく、音楽の中に、座る。"
    tags: [動]
    tone: ゴージャス
    situation: "高級スピーカーの商品紹介動画で、薄暗いリスニングルームの映像に乗せる全編"
    seconds: 30
    gender: male
    category: 商品・サービス紹介
  - id: n054
    kind: narration
    text: "電車に置き忘れた傘、通算二十七本。「カエルノ傘」は、三メートル離れると、鳴きます。"
    tags: [笑]
    tone: コミカル
    situation: "傘の通販紹介動画で、持ち主が何度も傘を忘れるコント映像のオチ"
    seconds: 10
    gender: male
    category: 商品・サービス紹介
  - id: n063
    kind: narration
    text: "新米が、届きました。春、田んぼに水が張られ、夏、青い稲が風に揺れ、秋、頭を垂れた穂を、一株ずつ刈り取る。そうして一年かけて育った「ほほえみ米」が、今年も食卓に。炊きたての湯気の向こうに、家族の顔がある。おかずがなくても、ごはんだけで、ごちそうです。ほほえみ米。今年の新米、どうぞ召し上がれ。"
    tags: [温]
    tone: ソフト
    situation: "米のテレビCMで、田植えから収穫、食卓までを追う映像に乗せる全編"
    seconds: 30
    gender: male
    category: テレビCM
  - id: n064
    kind: narration
    text: "狂いは、ゼロ。妥協も、ゼロ。時を刻むのではなく、時を支配する。クロノス・エッジ。"
    tags: [緊張]
    tone: クール
    situation: "高級腕時計のテレビCMで、暗闇に浮かぶ文字盤の映像に乗せる全編"
    seconds: 10
    gender: male
    category: テレビCM
  - id: n065
    kind: narration
    text: "六年間、毎朝、背中にあった。雨の日も、けんかした日も、転んで泣いた帰り道も。最後の日、少し小さくなったそれを、あなたはそっと撫でた。「ソラ・ランドセル」。六年分の、ありがとうを込めて。"
    tags: [涙, 温]
    tone: エモーショナル
    situation: "ランドセルのテレビCMで、小学校卒業の日の親子を描く映像に乗せる全編"
    seconds: 20
    gender: male
    category: テレビCM
  - id: n066
    kind: narration
    text: "午後十一時、最終の改札が閉まるころ、その列車は、音もなく動き出す。行き先は、時刻表に載っていない。窓の外を流れていくのは、見たことのない町の灯り。朝、カーテンを開けたとき、あなたはどこにいるのだろう。一夜限りの、行き先を知らない旅。寝台特急「ミッドナイト・ノクターン」。切符は、月に一度だけ、ひそかに発売されます。"
    tags: [静]
    tone: ミステリアス
    situation: "寝台列車ツアーのテレビCMで、夜の駅を出発する列車の映像に乗せる全編"
    seconds: 30
    gender: male
    category: テレビCM
  - id: n076
    kind: narration
    text: "一日の終わりに、ひと息。深煎りの香りが、肩の力を抜いてくれる。珈琲豆の店、トモシビ。"
    tags: [温, 静]
    tone: ソフト
    situation: "夜のラジオ番組の合間に流れる自家焙煎珈琲店のCMで、聴き手を労う"
    seconds: 10
    gender: male
    category: ラジオCM
  - id: n077
    kind: narration
    text: "今週末だけ！四十型テレビ、三万九千八百円！冷蔵庫も洗濯機も、まとめてドーン！ホシヤマ電器、駅前店へ急げ！"
    tags: [動]
    tone: ハイテンション
    situation: "朝の情報番組の合間に流れる家電量販店セール告知CMで、勢いよく煽る"
    seconds: 10
    gender: male
    category: ラジオCM
  - id: n078
    kind: narration
    text: "そのときは、突然やってきます。何をすればいいのか、誰に連絡すればいいのか。わからなくて、当たり前です。深夜でも、早朝でも、まず一本、お電話ください。あとは、私たちがご案内します。家族葬のシズカ、二十四時間受付中。"
    tags: [静]
    tone: ストレート
    situation: "深夜ラジオの合間に流れる家族葬会社のCMで、聴き手に淡々と伝える"
    seconds: 20
    gender: male
    category: ラジオCM
  - id: n079
    kind: narration
    text: "今の仕事に、不満はない。ただ、三年後の自分が、はっきり見えてしまう。それだけのことだ。履歴書は、まだ書かなくていい。ただ、市場があなたをいくらで評価するか、一度、知っておく。それだけで、明日の会議の景色が、少し変わる。年収診断、三分、無料。ハイクラス転職のアセンド。動くかどうかは、知ってから決めればいい。"
    tags: [緊張]
    tone: クール
    situation: "通勤時間帯のラジオで流れる転職サービスCMで、会社員に冷静に問う"
    seconds: 30
    gender: male
    category: ラジオCM
  - id: n089
    kind: narration
    text: "朝四時、商店街にただ一つ、灯りがともる。創業七十年、豆腐屋の一日が、今日も始まります。"
    tags: [温]
    tone: フレンドリー
    situation: "早朝の商店街を映す豆腐屋密着番組の冒頭で、視聴者に親しげに語る"
    seconds: 10
    gender: male
    category: ドキュメンタリー
  - id: n090
    kind: narration
    text: "夜の森。カメラの三十メートル先に、親子のニホンカモシカ。息を殺して、夜明けを待ちます。"
    tags: [静, 緊張]
    tone: ウィスパー
    situation: "夜の森の暗視映像に乗せる野生動物番組の一場面で、囁くように実況する"
    seconds: 10
    gender: male
    category: ドキュメンタリー
  - id: n091
    kind: narration
    text: "全長二百メートル、九両編成。乗客は、わずか二十八名。磨き上げられた真鍮の手すり、職人が一枚ずつ張った木の壁。走る迎賓館と呼ばれる、豪華寝台列車『瑞穂』。その三泊四日の旅に、カメラが初めて乗り込みました。"
    tags: [動]
    tone: ゴージャス
    situation: "豪華寝台列車の車内を映す紀行番組の導入で、視聴者に華やかに紹介する"
    seconds: 20
    gender: male
    category: ドキュメンタリー
  - id: n092
    kind: narration
    text: "児童数、三人。この春、百二十年の歴史を持つ小学校が、その役目を終えます。校庭の桜は、今年も変わらずつぼみをつけました。けれど、この木の下で写真を撮る卒業生は、彼らが最後です。『先生、来年も桜、咲きますか』。少女の問いに、校長は、しばらく答えられませんでした。山あいの小さな学校の、最後の一年を見つめます。"
    tags: [涙, 静]
    tone: エモーショナル
    situation: "廃校前の小学校の桜を映す番組の導入で、視聴者に感情を込めて語る"
    seconds: 30
    gender: male
    category: ドキュメンタリー
  - id: n102
    kind: narration
    text: "さて今週の便利グッズ。洗濯のたびに片方だけ消える靴下、皆さんも心当たりありますよね。僕なんか引き出しが独身靴下の墓場ですよ。そんな悲劇に終止符を打つのが、こちらの「ペアキーパー」。たった百円で、別れさせません。"
    tags: [笑]
    tone: コミカル
    situation: "朝の情報番組の生活グッズコーナーで、靴下用クリップを手に紹介する場面"
    seconds: 20
    gender: male
    category: 情報番組
  - id: n103
    kind: narration
    text: "商店街の奥、三十年間一度も開いたことのない扉。今夜、その鍵を持つ人物に会ってきました。"
    tags: [静]
    tone: ミステリアス
    situation: "深夜の街ネタ番組で、商店街にある謎の扉の取材VTRへ入る前振り"
    seconds: 10
    gender: male
    category: 情報番組
  - id: n104
    kind: narration
    text: "来ました来ました、開店三十分前のデパート前！行列はすでに四百人超え！お目当ては年に一度の福袋、中身は総額十万円相当！今日はこの行列の先頭、昨夜九時から並んだという猛者に直撃します！"
    tags: [動]
    tone: ハイテンション
    situation: "朝の情報番組の中継コーナーで、福袋目当ての行列を前に実況する場面"
    seconds: 20
    gender: male
    category: 情報番組
  - id: n105
    kind: narration
    text: "もうすぐ、日付が変わります。今夜の特集は、よく眠るための三つの習慣。ひとつ、寝る一時間前には部屋の灯りを半分に。ふたつ、枕元のスマートフォンは手の届かない場所へ。みっつ、ゆっくり四つ数えながら息を吐く。それだけで、体はきちんと夜を迎える準備を始めます。このあとは、眠りを誘う波の音とともにお届けします。どうぞ、おやすみなさい。"
    tags: [静]
    tone: ウィスパー
    situation: "深夜の情報番組の快眠特集で、照明を落としたスタジオから語る場面"
    seconds: 30
    gender: male
    category: 情報番組
  - id: n106
    kind: narration
    text: "台風十四号は今夜、関東に最接近します。不要不急の外出は控え、早めの備えを。川や海には近づかないでください。"
    tags: [緊張]
    tone: シリアス
    situation: "夕方の情報番組で、台風の進路図を示しながら視聴者に注意を促す場面"
    seconds: 10
    gender: male
    category: 情報番組
  - id: n115
    kind: narration
    text: "さあ、今回の旅もそろそろ終わりです。山あいの村で出会ったのは、九十二歳のタケさん。初対面の僕らに、いきなり「風呂入ってけ」と言ってくれた、あの笑顔が忘れられません。囲炉裏で焼いた川魚、手作りの漬物、そして夜更けまで続いた昔話。何もないと言われた村に、全部ありました。タケさん、また来ます。今度はお土産、ちゃんと持って行きますからね。"
    tags: [温]
    tone: フレンドリー
    situation: "旅バラエティのエンディングで、民宿の縁側に座って視聴者へ語りかける場面"
    seconds: 30
    gender: male
    category: バラエティ
  - id: n116
    kind: narration
    text: "ルールは簡単。五杯のコーヒーの中から、一杯三千円の高級豆を当てるだけ。外せば、罰ゲームです。"
    tags: [静]
    tone: ストレート
    situation: "バラエティの利き酒風企画で、テーブルに並んだ五杯を映しながらルール説明"
    seconds: 10
    gender: male
    category: バラエティ
  - id: n117
    kind: narration
    text: "ついに実現、夢の対決！小学生百人対、現役力士一人の綱引き勝負！体重の合計、三千二百キロ対百八十キロ。数の力か、鍛え抜かれた一人の力か。審判の旗が上がる。勝負は、一本勝負！"
    tags: [動, 緊張]
    tone: ダイナミック
    situation: "バラエティの対決企画で、綱引き開始直前の両者を交互に映しながら煽る"
    seconds: 20
    gender: male
    category: バラエティ
  - id: n118
    kind: narration
    text: "五歳のユウトくんが、今日どうしても買いたいものがあるそうです。目的地は、家から八百メートル先の花屋さん。握りしめているのは、おこづかいの五百円玉です。横断歩道の前で立ち止まり、右を見て、左を見て、もう一度右。小さな背中が、少しだけ大きく見えます。お花屋さんのおばさんに向かって、一生懸命に伝えた言葉は「お母さんの誕生日なんです」。"
    tags: [温]
    tone: ソフト
    situation: "子どものおつかい企画で、花屋へ向かう男の子の後ろ姿にそっと重ねる語り"
    seconds: 30
    gender: male
    category: バラエティ
  - id: n128
    kind: narration
    text: "さて、やってきたのは離島の港にある、おにぎり屋。注文したら出てきたのがこちら、顔より大きい。店主いわく、漁師さんの朝ごはんサイズだそうで。いやいや、僕の顔のサイズを超えてますって。口、どこから入れたらいいんですか。"
    tags: [笑]
    tone: コミカル
    situation: "離島の港のおにぎり屋で巨大おにぎりを前にした旅番組の実食シーン"
    seconds: 20
    gender: male
    category: 旅・グルメ番組
  - id: n129
    kind: narration
    text: "路地の奥、看板のない一軒。扉を開けると、七十年変わらぬ秘伝のタレの香りが、静かに漂っていた。"
    tags: [静]
    tone: ミステリアス
    situation: "路地裏の看板のない老舗のタレを紹介する深夜グルメ番組の冒頭ナレーション"
    seconds: 10
    gender: male
    category: 旅・グルメ番組
  - id: n130
    kind: narration
    text: "高原の牧場に着いたら、まずはこれ。搾りたての牛乳で作るソフトクリーム。ひと口食べたら、もう笑顔になっちゃいます。牧場のお母さんが、ついでにって、焼きたてのパンまで持ってきてくれました。いいところだなあ、ここ。"
    tags: [温]
    tone: フレンドリー
    situation: "高原の牧場でソフトクリームを食べる旅番組の男性リポーターの語り"
    seconds: 20
    gender: male
    category: 旅・グルメ番組
  - id: n131
    kind: narration
    text: "着きました、夜の屋台街！　名物は、激辛麻婆豆腐！　山椒の香りがもうここまで届いてます！　ひと口いきます……か、辛い！　でも、うまい！　舌がしびれて、汗が止まらない、でも箸が止まらない！　店主、おかわりください！　ええ、まだいけます！　この街の夜は、辛さで始まるんです！"
    tags: [動, 笑]
    tone: ハイテンション
    situation: "夜の屋台街で激辛麻婆豆腐に挑む旅グルメ番組の男性リポーターの実食"
    seconds: 30
    gender: male
    category: 旅・グルメ番組
  - id: n132
    kind: narration
    text: "温泉街の朝。湯気の向こうで、湯豆腐がゆっくりと揺れている。名水の町の、静かな一日が始まる。"
    tags: [静]
    tone: ストレート
    situation: "温泉街の朝の湯豆腐を映す旅番組の静かな導入ナレーション"
    seconds: 10
    gender: male
    category: 旅・グルメ番組
  - id: n141
    kind: narration
    text: "十八番ホール、最終パット。距離は三メートル。息を止めるギャラリーの前で、彼は静かに構えた。"
    tags: [静, 緊張]
    tone: ウィスパー
    situation: "ゴルフ中継の最終パット直前に流れる男性ナレーターの囁き"
    seconds: 10
    gender: male
    category: スポーツ
  - id: n142
    kind: narration
    text: "柔道決勝、残り三十秒。指導二つを背負った男が、最後の組み手を取りにいく。"
    tags: [緊張]
    tone: シリアス
    situation: "柔道決勝の残り三十秒を伝えるダイジェスト映像のナレーション"
    seconds: 10
    gender: male
    category: スポーツ
  - id: n143
    kind: narration
    text: "市民マラソン、制限時間まであと五分。最後のランナーが、ゆっくりと角を曲がってきました。沿道で待っていたのは、家族と、先にゴールした仲間たち。順位じゃない。走り切ることの意味を、彼が教えてくれました。"
    tags: [温]
    tone: ソフト
    situation: "市民マラソンの最終ランナーのゴールを伝えるスポーツ番組の特集"
    seconds: 20
    gender: male
    category: スポーツ
  - id: n144
    kind: narration
    text: "競泳男子二百メートル個人メドレー、決勝。八人がスタート台に立つ。世界記録保持者は第四レーン。彼の隣には、予選でコンマ一秒差に迫った十九歳。会場が静まり、水面だけが揺れる。号砲までの数秒間、選手たちは何を思うのか。四つの泳法、二百メートル、そのすべてが数センチの差で決まる。用意。"
    tags: [緊張, 静]
    tone: クール
    situation: "競泳決勝のスタート直前に流れる中継番組の煽りナレーション"
    seconds: 30
    gender: male
    category: スポーツ
  - id: n154
    kind: narration
    text: "天下を望んだ、ひとりの男がいた。黄金の天守、十万の軍勢、そして、たったひとつの裏切り。日本映画史上最大規模の合戦シーンで描く、権力と野望の物語。豪華キャストが集結、撮影期間三年、総製作費は百億円。歴史が動いた夜を、あなたはその目で見届ける。映画「黄金の夜明け」、来春、全国の劇場で公開。"
    tags: [動]
    tone: ゴージャス
    situation: "劇場で流れる戦国歴史スペクタクル映画の予告編ナレーション"
    seconds: 30
    gender: male
    category: 映画・作品予告
  - id: n155
    kind: narration
    text: "父が遺したのは、一通の手紙と、古い船だった。映画「海へ帰る日」、この冬、公開。"
    tags: [涙]
    tone: エモーショナル
    situation: "テレビCMで流れる父と息子を描いた感動映画の短い予告"
    seconds: 10
    gender: male
    category: 映画・作品予告
  - id: n156
    kind: narration
    text: "主人公は、ちょっとおっちょこちょいな一匹の柴犬。迷子になった子猫を連れて、街じゅうを大冒険。笑って、泣いて、最後はみんなで帰ろう。この夏、家族いっしょに観てほしい一本です。アニメ映画「まめたろうの大冒険」、七月公開。"
    tags: [温, 笑]
    tone: フレンドリー
    situation: "劇場で流れる家族向けアニメ映画の予告編ナレーション"
    seconds: 20
    gender: male
    category: 映画・作品予告
  - id: n157
    kind: narration
    text: "止まらない、曲がらない、諦めない！下町の配達員・早瀬タケルが、たった一台の原付で巨大犯罪組織に挑む！預かった荷物は爆弾、締め切りは今日の夕方五時。渋滞も、追っ手も、恋のライバルも、まとめて追い越せ！笑って叫んで泣ける、ノンストップ配達アクション『特急便タケル』、この夏、全国の劇場へ一気にお届け！"
    tags: [動]
    tone: ハイテンション
    situation: "テレビの深夜枠で流れるアクションコメディ映画の予告編、男性ナレーター"
    seconds: 30
    gender: male
    category: 映画・作品予告
  - id: n167
    kind: narration
    text: "さあ、ここからが本番だ！この講座では、十週間でゼロからウェブアプリを完成させる。コードを書き、壊し、直す。その繰り返しが君を変える。準備はいいか？第一回、環境構築、スタート！"
    tags: [動]
    tone: ダイナミック
    situation: "プログラミング講座の第一回動画、冒頭で男性講師が受講生に向けて"
    seconds: 20
    gender: male
    category: 教育・eラーニング
  - id: n168
    kind: narration
    text: "そっと目を閉じて、ゆっくり息を吐いて。今日の学びは、呼吸を整えることから始めましょう。"
    tags: [静]
    tone: ウィスパー
    situation: "マインドフルネス講座の冒頭、受講者が自宅でイヤホンで聴く"
    seconds: 10
    gender: male
    category: 教育・eラーニング
  - id: n169
    kind: narration
    text: "この映像は、実際に起きた事故をもとに作られています。足場からの転落、高さはわずか二メートル。それでも、命は失われました。安全帯の着用は、面倒な決まりではなく、家に帰るための約束です。"
    tags: [緊張]
    tone: シリアス
    situation: "建設業の安全教育eラーニング、転落事故防止の章の導入"
    seconds: 20
    gender: male
    category: 教育・eラーニング
  - id: n170
    kind: narration
    text: "介護の現場で、いちばん大切なのは、技術よりも先に、相手の気持ちに寄り添うことです。この章では、食事の介助を学びます。スプーンを口元へ運ぶ速さ、声をかけるタイミング、目線の高さ。どれも小さなことですが、その一つひとつが、利用者さんの『おいしい』につながります。それでは、映像を見ながら、ゆっくり確認していきましょう。"
    tags: [温]
    tone: ソフト
    situation: "介護職員初任者研修のeラーニング、食事介助の章の導入部分"
    seconds: 30
    gender: male
    category: 教育・eラーニング
  - id: n171
    kind: narration
    text: "パスワードの使い回しは、すべての部屋の鍵を一本にすることと同じです。第三章、認証の基本。"
    tags: [緊張]
    tone: クール
    situation: "情報セキュリティ研修動画、章の切り替わりで流れる"
    seconds: 10
    gender: male
    category: 教育・eラーニング
  - id: n180
    kind: narration
    text: "遠心分離機を使う前に、チューブの重さを向かい合う位置で揃えてください。バランス不良は故障の原因になります。"
    tags: [静]
    tone: ストレート
    situation: "大学研究室向け実験機器の使い方動画、注意事項の読み上げ"
    seconds: 10
    gender: male
    category: 医療・科学技術
  - id: n181
    kind: narration
    text: "全長五十メートル、推力は従来の二倍。次世代ロケット『ハヤテ』、ついに発射台へ。"
    tags: [動]
    tone: ダイナミック
    situation: "宇宙開発企業の新型ロケット紹介映像、展示会のブースで流れる"
    seconds: 10
    gender: male
    category: 医療・科学技術
  - id: n182
    kind: narration
    text: "朝九時、専用フロアの扉が開きます。検査着はシルク、十二の検査は午前中に。結果は、午後の個室で、医師がじかにご説明します。紫苑メディカル、プレミアム人間ドック。最上階で、ご自身をもてなす一日を。"
    tags: [動]
    tone: ゴージャス
    situation: "高級人間ドックの紹介映像、ホテルの客室案内チャンネルで流れる"
    seconds: 20
    gender: male
    category: 医療・科学技術
  - id: n183
    kind: narration
    text: "生まれてから一度も、母の声を聞いたことのなかった少年がいました。手術から三週間、人工内耳のスイッチが入る日。医師がゆっくりとつまみを回すと、少年の目が、大きく見開かれました。『……おかあさん？』。その言葉を、母は何年、待ったのでしょう。音を取り戻す医療の最前線を、私たちは追いました。"
    tags: [涙]
    tone: エモーショナル
    situation: "医療ドキュメンタリー番組の一場面、人工内耳の章のナレーション"
    seconds: 30
    gender: male
    category: 医療・科学技術
  - id: n193
    kind: narration
    text: "さて、勇者ゴンザレスは魔王の城の前に立った。扉は巨大。鍵穴も巨大。ところが彼の手にあるのは、村の長老からもらった、ごく普通の自転車の鍵である。「……嘘だろ」。長老は、確かに言った。何でも開くと。"
    tags: [笑]
    tone: コミカル
    situation: "コメディファンタジー小説のオーディオブック、地の文を男性朗読者が読む"
    seconds: 20
    gender: male
    category: オーディオブック
  - id: n194
    kind: narration
    text: "その屋敷の時計は、すべて同じ時刻で止まっていた。午前二時十四分。彼が最後に見た時刻と、寸分違わず。"
    tags: [静, 緊張]
    tone: ミステリアス
    situation: "推理小説のオーディオブック、探偵が屋敷に入る章の書き出し"
    seconds: 10
    gender: male
    category: オーディオブック
  - id: n195
    kind: narration
    text: "第三章、川沿いの町。春になると、この町の川は雪解け水で膨らみ、橋の下の石段を三段まで沈める。祖父はその高さで、その年の米の出来を占った。あながち外れないのだと、母は笑っていた。"
    tags: [静, 温]
    tone: ストレート
    situation: "随筆集のオーディオブック、故郷の川を描く章の冒頭を淡々と読む"
    seconds: 20
    gender: male
    category: オーディオブック
  - id: n196
    kind: narration
    text: "艦長は双眼鏡を下ろし、短く息を吐いた。水平線の向こうに、三本の煙。敵か、味方か。無線は沈黙したままだ。あと七分で、こちらの位置は完全に露呈する。彼は乗組員の顔を一人ずつ見渡した。十九歳の通信士が、震える指で帽子を直している。「針路、そのまま」。艦長は言った。「全員、持ち場につけ」。"
    tags: [緊張]
    tone: シリアス
    situation: "戦記小説のオーディオブック、海戦直前の緊迫した場面を読む"
    seconds: 30
    gender: male
    category: オーディオブック
  - id: n206
    kind: narration
    text: "落差百二十メートル！　轟音とともに流れ落ちる、白嶽大滝。その水しぶきを、肌で感じてください！"
    tags: [動]
    tone: ダイナミック
    situation: "滝の展望台に設置された音声ガイドの、景色を紹介する冒頭"
    seconds: 10
    gender: male
    category: 観光・施設ガイド
  - id: n207
    kind: narration
    text: "間もなく、ロープウェイが山頂駅に到着します。強風のため、ゴンドラが揺れます。手すりにおつかまりください。"
    tags: [緊張]
    tone: クール
    situation: "山岳ロープウェイのゴンドラ内放送、山頂駅到着前の注意喚起"
    seconds: 10
    gender: male
    category: 観光・施設ガイド
  - id: n208
    kind: narration
    text: "この壁に刻まれた名前は、三百二十七。炭鉱の町が栄え、そして閉じるまでに、地底で命を落とした人々です。彼らの子や孫が、今もこの記念館を守っています。どうか、名前のひとつひとつに、目を留めてください。"
    tags: [涙, 静]
    tone: エモーショナル
    situation: "旧炭鉱の記念館の音声ガイド、慰霊碑の前で立ち止まる場面"
    seconds: 20
    gender: male
    category: 観光・施設ガイド
  - id: n209
    kind: narration
    text: "はい、ご乗車ありがとうございます！　当アヒルボートは時速、えー、人の早歩きくらいで進みます。追い越し禁止、というより、追い越せません。右手に見えますのが、創業百年の団子屋。左手に見えますのが、さっきの団子屋の裏側。はい、池が小さいんです。でもご安心を、ちゃんと三周しますので、団子屋は合計六回ご覧いただけます！"
