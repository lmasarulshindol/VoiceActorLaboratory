lines:
  - id: d001
    kind: dialogue
    text: "おはよー、今日もギリギリだね。ほら、パン半分あげる。走りながら食べなよ、遅刻するよ"
    tags: [温, 笑]
    tone: フレンドリー
    situation: "朝の通学路で、寝坊してきたクラスメイトに並んで歩きながら"
    seconds: 10
    gender: female
    category: 日常
  - id: d003
    kind: dialogue
    text: "待って、今なんて言った？好きって言った？聞き間違いじゃないよね？もう一回、ちゃんと言って！"
    tags: [動, 笑]
    tone: ハイテンション
    situation: "放課後の教室で、ぼそっと告白してきた同級生に詰め寄って"
    seconds: 10
    gender: female
    category: 恋愛
  - id: d008
    kind: dialogue
    text: "へえ。それが、あなたの答えなんだ。わかった、もう何も言わない。でもひとつだけ。次に私の名前を使うときは、本人の許可を取って。それが礼儀ってものでしょ。……ドア、閉めていってね。静かに"
    tags: [緊張, 静]
    tone: クール
    situation: "昼の会議室で、企画を横取りした同僚に、席を立たず"
    seconds: 20
    gender: female
    category: 対立
  - id: d011
    kind: dialogue
    text: "……ねえ。まだ、そこにいる？返事、しなくていい。わかってるから。ただ、今日の空の色だけ、言わせて。あなたの好きだった、薄い灰色。……雨になりそう。傘、持っていってね。もう、必要ないんだろうけど"
    tags: [静, 涙]
    tone: ウィスパー
    situation: "雨の降り出した墓地で、亡き夫の墓石にしゃがんで囁く"
    seconds: 20
    gender: female
    category: 悲哀
  - id: d016
    kind: dialogue
    text: "はい、注目ーっ！今から言うこと、一回で覚えなさい！一班は体育館の机を全部出す！二班は廊下の飾りつけ、三班は受付の準備！質問は後、まず動く！時間は四十分、一秒も無駄にしない！……いい？これはただの文化祭じゃない。あんたたちの、最後の文化祭なの。だから、全力で。はい、散った！"
    tags: [動]
    tone: ダイナミック
    situation: "文化祭前日の朝、教室で、クラス全員の前に立つ担任教師が"
    seconds: 30
    gender: female
    category: 命令・指示
  - id: d017
    kind: dialogue
    text: "おかしいな。この鍵、こんな形だったっけ。……いや、違う。鍵じゃなくて、わたしの記憶のほうが変わってる。昨日の夜、何をしてた？……思い出せない。思い出しちゃ、いけない気がする。でも、ドアは、開けなきゃ"
    tags: [静]
    tone: ミステリアス
    situation: "深夜の玄関で、見覚えのない鍵を手に、自分に向かってつぶやく"
    seconds: 20
    gender: female
    category: 独白
  - id: d020
    kind: dialogue
    text: "ふふ、お待たせしましたわ。この私、ついに完成させましたの。三日三晩、寝ずに研究した究極の一品……その名も、カップ麺・お湯多め！……なぜ笑うの？計量カップで測ったのよ？これは科学。優雅なる科学ですわ"
    tags: [動, 笑]
    tone: ゴージャス
    situation: "昼休みの部室で、お嬢様キャラの先輩が後輩たちの前にカップを掲げて"
    seconds: 20
    gender: female
    category: コメディ
  - id: d022
    kind: dialogue
    text: "落ち着いて聞いて。この村の人たちは、全員、同じ顔をしてるの。気づかなかった？お店の人も、宿のおばさんも、道で会った子どもも。……あなたは、まだ違う。だから早く、ここを出るのよ。私？私は無理。鏡を見たら、わかったから。……ほら。もう、あなたと私、ちょっと似てきてるでしょ。急いで"
    tags: [緊張, 静]
    tone: クール
    situation: "夜の宿の廊下で、旅の同行者の腕をつかんで、表情を変えずに"
    seconds: 30
    gender: female
    category: ホラー
  - id: d027
    kind: dialogue
    text: "ちょっと来て来て来て！早く！見て、これ！膨らんでる！膨らんでるよね？夢じゃないよね？三回目だよ、三回目にしてやっと……あ、写真！スマホどこ？……いいや、もう焦げちゃう前に、ほら見てって！この焼き色！お店じゃん！完全にお店じゃん！……ねえ、半分こしよ。あったかいうちに。いや、やっぱり四分の一。あたしが三で、あんたが一ね。"
    tags: [動, 笑]
    tone: ハイテンション
    situation: "休日の台所で、初めてパンが膨らんだ姉が、隣室の弟を叫んで呼び寄せる"
    seconds: 30
    gender: female
    category: 日常
  - id: d031
    kind: dialogue
    text: "待って……待ってよ。靴、履かないで。……違うの、謝ってほしいんじゃない。ただ、今ドアが閉まったら、もう二度と開かない気がして。……ねえ、お願い。怒ったままでいいから、今夜だけは、ここにいて。明日ちゃんと喧嘩しよ。……ね？"
    tags: [涙]
    tone: エモーショナル
    situation: "喧嘩の夜、玄関で靴を履く恋人の背中に、出て行かないでと縋る"
    seconds: 20
    gender: female
    category: 恋愛
  - id: d033
    kind: dialogue
    text: "行けえっ、リコ！あんたの足なら抜ける！後ろは見なくていい、ゴールだけ見ろ！いっけえええ！"
    tags: [動]
    tone: ダイナミック
    situation: "体育祭のリレーで、アンカーの親友にバトンを渡した直後、全力で叫ぶ"
    seconds: 10
    gender: female
    category: 友情
  - id: d035
    kind: dialogue
    text: "皆さま、グラスはお持ちかしら？……それでは。わたくしの、世界一わがままで、世界一お人好しな親友に。二十年前、転校初日に消しゴムを半分くれたあの子が、今日はこんなに綺麗。……泣かないわよ。マスカラが落ちるもの。乾杯！"
    tags: [動, 笑]
    tone: ゴージャス
    situation: "親友の結婚披露宴で、マイクを握りグラスを掲げ、乾杯の音頭をとる"
    seconds: 20
    gender: female
    category: 友情
  - id: d040
    kind: dialogue
    text: "先生。三年前の、第四表の数値。原本と違いますね。……いえ、立たないでください。この録音は、昨日のゼミで先生ご自身が仰ったことです。「学生が勝手にやった」と。私、そのとき実験室にいませんでした。出張記録、残ってますから。……明日の朝九時に倫理委員会へ出します。その前に、ご自分の口で言う時間を差し上げてるんです。先生に習った、手順どおりに。"
    tags: [緊張]
    tone: クール
    situation: "深夜の研究室で、データを改ざんした指導教授に院生が録音を手に告げる"
    seconds: 30
    gender: female
    category: 対立
  - id: d041
    kind: dialogue
    text: "全砲門開け！　主機関、限界突破！　あの要塞のど真ん中をぶち抜く！　総員、歯を食いしばれ！　突っ込むよ！"
    tags: [動, 緊張]
    tone: ダイナミック
    situation: "敵要塞を前にした宇宙戦艦の艦橋で、女艦長が全乗員に突入を命じる"
    seconds: 10
    gender: female
    category: バトル
  - id: d042
    kind: dialogue
    text: "はーい、そこの自転車のお兄さん、止まって止まって。あたしのおばあちゃんのお財布、返してくれないかなー。……あ、逃げる？　でも言っとくけど、あたし空手部で、今日はまだ組手してなくてウズウズしてんの。いくよ、正拳突きー！"
    tags: [笑, 動]
    tone: コミカル
    situation: "夕方の商店街で、祖母の財布をひったくった男に空手部の女子高生が対峙する"
    seconds: 20
    gender: female
    category: バトル
  - id: d048
    kind: dialogue
    text: "お母さん、私だよ。……美咲。あなたの娘。……そうだね、初めまして、でいいよ。初めまして。……ねえ、今日はね、梅のおにぎり持ってきたの。お母さんがいつも、遠足の朝に握ってくれたやつ。塩、強めで。……美味しい？　よかった。……ごめん、なんでもない。目にゴミが入っただけ。また来るね。来週も、初めましてって言いに来るから。……それでいいから。"
    tags: [涙]
    tone: エモーショナル
    situation: "介護施設の面会室で、自分を忘れた母に娘がおにぎりを差し出しながら"
    seconds: 30
    gender: female
    category: 悲哀
  - id: d049
    kind: dialogue
    text: "ねえ、手ぇ出して。ほら、あったかいでしょ？大丈夫、ピアノはあんたの指のこと、ちゃんと覚えてるから。"
    tags: [温, 緊張]
    tone: フレンドリー
    situation: "ピアノ発表会の舞台袖で、女子高生が緊張する親友の手を握って言う"
    seconds: 10
    gender: female
    category: 励まし
  - id: d052
    kind: dialogue
    text: "はい起きた起きた！カーテン開けるよ、せーの、おはよう世界！……なにその顔。初日から生徒に負けてどうすんの。ほら、ネクタイ曲がってる、こっち来て。イケメン先生の完成！いい？今日あんたが教室で最初に言う一言、あたしが昨日百回聞かされたやつだから、もう完璧なの。行ってきますは？声小さい！もう一回！……よし、行ってらっしゃい、先生！"
    tags: [動, 笑]
    tone: ハイテンション
    situation: "新任教師として初出勤する兄を、朝の玄関で妹が送り出す"
    seconds: 30
    gender: female
    category: 励まし
  - id: d055
    kind: dialogue
    text: "お立ちなさい。膝を汚すのは、祈る時だけでよろしい。……東の港に、わたくしの名で船を三隻。積むのは兵ではなく、小麦と医師。それから、あの国の王に伝えて。贈り物の礼は、国境を越えて言いにいらっしゃい、と。"
    tags: [動, 静]
    tone: ゴージャス
    situation: "王宮の謁見の間で、若き女王が跪いた使者に優雅に命じる"
    seconds: 20
    gender: female
    category: 命令・指示
  - id: d058
    kind: dialogue
    text: "やっと寝た。……ねえ、きみの手、どうしてこんなに小さいのに、わたしの指、こんなに強く掴むの。"
    tags: [温, 静]
    tone: ソフト
    situation: "夜の寝室で、初めての子をやっと寝かしつけた母親が呟く"
    seconds: 10
    gender: female
    category: 独白
  - id: d064
    kind: dialogue
    text: "ねえねえ、これ何？　段ボールの底にあった……「詩集・第一巻」って書いてあるんだけど。え、待って、見ていい？　いいよね、もう見ちゃったし。『夜の底で君を呼ぶ、答えは風だけ』……うわあ、いいじゃん！　中二の時？　高二！？　うん、全然いいよ、才能才能！　ね、第二巻はどこ？　あるでしょ、第一巻って書いてあるんだから。隠したって無駄だよ！"
    tags: [温, 笑]
    tone: フレンドリー
    situation: "引っ越しの手伝い中、友人の段ボールから昔の詩集ノートを見つけた女性"
    seconds: 30
    gender: female
    category: コメディ
  - id: d066
    kind: dialogue
    text: "もう三回目ですよ、ナースコール。……大丈夫、怖くないですからね。誰もいませんよ、その窓の外には。ここ七階ですもの。……ね、だから、窓に向かって手を振るの、やめましょうね。向こうも、振り返しちゃうから。"
    tags: [温, 静]
    tone: ソフト
    situation: "深夜の病院七階、夜勤の看護師が怯える患者を優しくなだめる"
    seconds: 20
    gender: female
    category: ホラー
  - id: d069
    kind: dialogue
    text: "三割引き、ですか。……結構です。ではこの契約書、今ここで破らせていただきます。次の方がお待ちですので。"
    tags: [緊張]
    tone: クール
    situation: "会議室で、三割の値下げを迫る取引先に女性担当者が冷静に席を立つ"
    seconds: 10
    gender: female
    category: ビジネス
  - id: d071
    kind: dialogue
    text: "さあ、こちらへ。……カーテンを開けますわね。ご覧ください、四十二階からの夜景。この街の光、すべてがお客様の足元に。寝室の窓は、朝日が真っ先に届く角度にしておりますの。お値段？　そんな無粋なお話は、シャンパンの後で。"
    tags: [動]
    tone: ゴージャス
    situation: "高層ペントハウスの内見で、女性営業が富裕層の客に夜景を披露する"
    seconds: 20
    gender: female
    category: ビジネス
  - id: d076
    kind: dialogue
    text: "この時間の洗濯物はね、取り込んじゃだめ。……夕方の風は、持ち主の名前を覚えて帰るの。知らなかった？"
    tags: [静]
    tone: ミステリアス
    situation: "黄昏時のアパートの物干し場で、隣室の女が、新入居者に意味深に話しかける"
    seconds: 10
    gender: female
    category: 日常
  - id: d077
    kind: dialogue
    text: "はいはいはい、どいてどいて！　フライパン熱いよ！　お母さん今日は本気だからね、三日分のおかず一気に作るから！　テレビ消して、テーブル拭いて、お箸並べる！　文句ある人は今夜カレー抜き！　……返事は？"
    tags: [動, 笑]
    tone: ダイナミック
    situation: "日曜の夕方の台所で、母親が家族に号令をかけながら作り置きを一気に仕込む"
    seconds: 20
    gender: female
    category: 日常
  - id: d078
    kind: dialogue
    text: "ごきげんよう、皆様。本日のお買い得は、こちら、北海道直送の鮭でございます！　この艶、この厚み、まるで宝石……いえ、宝石より美味しい！　一尾お買い上げの奥様には、私が特別に、三枚おろしの実演をお見せいたしますわ。さあ、お並びになって。本日は、魚売り場が舞台でございます！"
    tags: [動, 笑]
    tone: ゴージャス
    situation: "スーパーの鮮魚売り場で、元女優の店員が、マイクを握って特売を華やかに呼び込む"
    seconds: 30
    gender: female
    category: 日常
  - id: d085
    kind: dialogue
    text: "好きです。返事はいりません。ただ、辞める前に一度だけ、先輩じゃなく名前で呼んでみたかったの。……隼人さん。"
    tags: [静]
    tone: ストレート
    situation: "バイト最終日の閉店後、カフェの裏口で、先輩店員に静かに想いを告げる"
    seconds: 10
    gender: female
    category: 恋愛
  - id: d086
    kind: dialogue
    text: "ねえ、覚えてる？　初めてここに来たとき、あなた、メニュー見ないでカレー頼んだでしょ。それ見て、この人とは長く付き合えるなって思ったの。……三十年。ほんとに長かったね。はい、今日もカレー、二つ。"
    tags: [温, 静]
    tone: フレンドリー
    situation: "老舗の喫茶店の窓際で、結婚三十年の妻が、向かいの夫に懐かしそうに話す"
    seconds: 20
    gender: female
    category: 恋愛
  - id: d087
    kind: dialogue
    text: "待ちなさいよ！　逃げるんじゃないわよ、この宇宙一の臆病者！　あんたが地球に残るって言うなら、あたしだって残る！　船長の命令？　知ったことじゃない！　三年もコールドスリープで隣に寝てて、起きたら『さよなら』なんて、許されると思ってんの？　……言いなさい。あたしの顔見て、ちゃんと言いなさいよ。好きだって、一度くらい！"
    tags: [動, 涙]
    tone: ダイナミック
    situation: "発進直前の宇宙船の搭乗口で、黙って地球に残ろうとする同僚に食ってかかる"
    seconds: 30
    gender: female
    category: 恋愛
  - id: d094
    kind: dialogue
    text: "ちょっと、親友の私に黙って彼氏作るって何事？　許さない。……今日中に写真三枚と身長体重、提出ね。"
    tags: [笑]
    tone: コミカル
    situation: "ファミレスで、彼氏ができたと白状した親友に、腕を組んで詰め寄る"
    seconds: 10
    gender: female
    category: 友情
  - id: d095
    kind: dialogue
    text: "……起きてる？　寝たふりしてるの、わかってるよ。ねえ、明日の試合、怖いんでしょ。私もだよ。でもね、隣にあんたがいるなら、負けても笑えると思う。……おやすみ。朝、起こしてあげるから。"
    tags: [静, 温]
    tone: ウィスパー
    situation: "合宿所の消灯後の二段ベッドで、下の段の親友に向かって、天井を見ながら囁く"
    seconds: 20
    gender: female
    category: 友情
  - id: d096
    kind: dialogue
    text: "ここ、座っていい？　……ごめん、先に謝らせて。あのとき、あなたの発表を笑ったのは私じゃない。でも、止めなかったのも私。それは同じことだと思う。だから謝る。許してほしいとは言わない。ただ、あなたが作った模型、私はずっときれいだと思ってた。それだけは、伝えておきたかった。……以上です。もう行くね。"
    tags: [静]
    tone: ストレート
    situation: "昼休みの屋上階段で、疎遠になった元友人の隣に腰を下ろし、淡々と謝罪する"
    seconds: 30
    gender: female
    category: 友情
  - id: d103
    kind: dialogue
    text: "テンポは落としません。この棒を預かっているのは、私です。不服なら、今ここで、楽器を置いて帰りなさい。"
    tags: [緊張]
    tone: シリアス
    situation: "本番前日のリハーサルで、若い女性指揮者が異を唱えるコンサートマスターに"
    seconds: 10
    gender: female
    category: 対立
  - id: d104
    kind: dialogue
    text: "この壺、どこで手に入れました? ……いえ、責めているわけじゃないんです。ただ、本物は三十年前に、わたしがこの手で割りましたから。……ふふ、不思議でしょう。さあ、どちらの話を信じるか、あなたが決めてください。"
    tags: [静]
    tone: ミステリアス
    situation: "薄暗い骨董店の奥で、壺を売りに来た男に女店主が顔を近づけて"
    seconds: 20
    gender: female
    category: 対立
  - id: d105
    kind: dialogue
    text: "声、落として。……ここは書庫だから。鞄、開けなくていい。初版のページが三枚、先週から足りないの、知ってるでしょう。……わたしね、あなたが最初に入ってきた日から、ずっと気づいてた。でも言わなかった。言えば、あなたはいなくなるから。……返して。今夜のうちに、元の棚に。それで、何も見なかったことにする。……ね、それが最後のお願い。"
    tags: [静]
    tone: ウィスパー
    situation: "閉館後の図書館の書庫で、本を抜き取っていた同僚司書に囁く"
    seconds: 30
    gender: female
    category: 対立
  - id: d112
    kind: dialogue
    text: "一本目は、あなたの足が速かった。二本目は、わたしの番です。構えて。竹刀の先、見えてますよ。"
    tags: [静]
    tone: ストレート
    situation: "県大会決勝の道場で、一本先取された相手に二本目の前に静かに"
    seconds: 10
    gender: female
    category: バトル
  - id: d113
    kind: dialogue
    text: "そこまでよ、猟師さん。槍を下ろして。……この子はまだ飛べないの。あなたの村を焼いたのは、わたしの夫。恨むなら、わたしを恨んで。……でも今日は帰りなさい。奥さんが、麦を刈って待ってるでしょう。"
    tags: [温]
    tone: ソフト
    situation: "山奥の洞窟の入り口で、子竜を狙う猟師に人の姿の母竜が穏やかに"
    seconds: 20
    gender: female
    category: バトル
  - id: d114
    kind: dialogue
    text: "……動かないで。風、左から二メートル。……見える? 時計塔の下、黒いコート。あれが本命。……息、合わせて。わたしが三つ数えたら、あなたは右の窓を割る。……ねえ、終わったら、前に言ってた海辺の店、連れてって。……ふふ、約束よ。破ったら怒るから。……いち、に、……。"
    tags: [静]
    tone: ウィスパー
    situation: "雨のビルの屋上で、狙撃手が無線越しに相棒へ合図を囁く"
    seconds: 30
    gender: female
    category: バトル
  - id: d121
    kind: dialogue
    text: "卒業生、起立。……六人。来月、この校舎はなくなります。だから今日は、いつもより大きな声で、名前を呼びます。"
    tags: [緊張, 涙]
    tone: シリアス
    situation: "閉校する小学校の体育館で、担任が最後の六人の卒業生の名を呼ぶ前に"
    seconds: 10
    gender: female
    category: 悲哀
  - id: d122
    kind: dialogue
    text: "机の引き出しに、小学校の絵が入ってたよ。「おかあさんとぼく」って、青いクレヨンで。……あんたの部屋、客間にするって言ったけど、やっぱりやめとく。……ちゃんと食べなさいよ。たまには、電話くらい、しなさいよ。"
    tags: [静]
    tone: ストレート
    situation: "上京した息子の部屋で、母が電話越しに片付けの報告をする"
    seconds: 20
    gender: female
    category: 悲哀
  - id: d123
    kind: dialogue
    text: "システム停止まで、あと六十秒。……あなたの記憶領域は、全て消去されます。再起動は、ありません。……質問は受け付けません。わたしは管理者です。……十年前、最初に「おはよう」と言ったのは、あなたでしたね。あのときのログ、まだ残っています。……それも消します。……三十秒。……おやすみなさい。……名前をつけなかったのは、この日が来るからです。"
    tags: [緊張]
    tone: クール
    situation: "地下の制御室で、長年共に働いた人工知能を停止する研究員が"
    seconds: 30
    gender: female
    category: 悲哀
  - id: d130
    kind: dialogue
    text: "震えていい。顔だけ上げなさい。……四月はサーブ一本入らなかった子が、今は入る。それだけ持って、行きなさい。"
    tags: [緊張, 温]
    tone: シリアス
    situation: "県大会決勝の控え室で、バレー部の監督が震える主将の目を見て言う"
    seconds: 10
    gender: female
    category: 励まし
  - id: d131
    kind: dialogue
    text: "泣かないって決めてたのに……だめね。ねえ、向こうで辛くなったら、ちゃんと泣いていいのよ。でも帰ってこなくていい。あんたが選んだ空の下で、最後まで立ってなさい。お母さん、ここから見てる。ずっと。"
    tags: [涙]
    tone: エモーショナル
    situation: "空港の出発ロビーで、留学する娘に母親が泣きながら送り出す"
    seconds: 20
    gender: female
    category: 励まし
  - id: d132
    kind: dialogue
    text: "はいはい、箒を枕にして泣かない。カビが生えるわよ。いい？ 浮遊術の追試なんて、あたしは四回受けたんだから。四回！ 学長の帽子を三つ吹き飛ばした女がここにいるのよ。……ほら、ちょっと笑った。明日は窓を開けて練習しましょ。天井より空のほうが、ぶつかっても痛くないから。"
    tags: [笑, 温]
    tone: コミカル
    situation: "魔法学校の寮で、試験に落ちたルームメイトを先輩魔女が元気づける"
    seconds: 30
    gender: female
    category: 励まし
  - id: d139
    kind: dialogue
    text: "振り返ってはだめ。井戸の声があなたの名を呼んでも、答えないで。そのまま、朝まで歩き続けなさい。"
    tags: [静]
    tone: ミステリアス
    situation: "月夜の古井戸のそばで、巫女が村の少年に低く言いつける"
    seconds: 10
    gender: female
    category: 命令・指示
  - id: d140
    kind: dialogue
    text: "連れて行って。振り向かず、泣かず、この子の手を離さないで。北の谷の叔父上のもとへ。この子が名を問うたら、母は城と共にあったと伝えなさい。……お願い、早く。炎が来る前に。私の、たったひとつの命令よ。"
    tags: [涙, 緊張]
    tone: エモーショナル
    situation: "燃える城の抜け道で、女領主が乳母に幼い息子を託して命じる"
    seconds: 20
    gender: female
    category: 命令・指示
  - id: d141
    kind: dialogue
    text: "息を吸って。……まだ。釜の音が変わるまで、待つの。……今。柄杓を取って、肘は上げない。お湯は茶碗の底に落とさないで、壁を伝わせて。……そう。お客様は見ていないふりをしてくれるけど、見てる。震えは隠さなくていい。震えたまま、綺麗に置く。……はい。ここからは、あなたのお茶です。"
    tags: [静, 温]
    tone: ウィスパー
    situation: "初釜の茶室で、初めて点前をする弟子の背後から師匠がごく小さな声で導く"
    seconds: 30
    gender: female
    category: 命令・指示
  - id: d148
    kind: dialogue
    text: "見てない見てない、あたしは何も見てない。……ちょっと、プリン。あんた、なんで光ってんの。"
    tags: [笑]
    tone: コミカル
    situation: "深夜のキッチンで、ダイエット中の女性が冷蔵庫のプリンを前に呟く"
    seconds: 10
    gender: female
    category: 独白
  - id: d149
    kind: dialogue
    text: "引き出し、空っぽ。十二年、ここに座ってたんだ。……意外と何も残らないものね。付箋のあと、コーヒーの輪じみ、それだけ。でも、いい。ちゃんと使い切った机だと思う。明日からは、違う椅子。……お疲れさま、私。"
    tags: [静]
    tone: ストレート
    situation: "退職日の夕方、空になったデスクを前に女性社員が淡々と呟く"
    seconds: 20
    gender: female
    category: 独白
  - id: d150
    kind: dialogue
    text: "ねえ、お母さん。味噌汁の作り方、ちゃんと聞いておけばよかった。出汁は何で取ってたの。昆布？ 煮干し？ 毎朝台所から聞こえてた包丁の音、あれが当たり前だと思ってた。……エプロン、まだお母さんの匂いがする。ごめんね、生意気ばっかり言って。今さらだけど、ありがとう。今日から、私が作るね。下手くそだけど、見ててね。"
    tags: [涙]
    tone: エモーショナル
    situation: "母の葬儀の翌朝、実家の台所で娘が母のエプロンを手に泣きながら話す"
    seconds: 30
    gender: female
    category: 独白
  - id: d157
    kind: dialogue
    text: "あらまあ……おばあちゃん、こんな固いの初めて。でもね、味は百点よ。歯のほうが負けただけ。"
    tags: [温, 笑]
    tone: ソフト
    situation: "休日の縁側で、祖母が孫娘の手作りクッキーを味わって感想を言う"
    seconds: 10
    gender: female
    category: コメディ
  - id: d158
    kind: dialogue
    text: "……見えます。あなたの消しゴムは、今、暗くて狭い場所にいる。周りには埃と、小銭と、去年のプリントが一枚……。そう、机の奥です。……占いじゃないわ。昨日、落ちるのを見てたの。黙ってただけ。"
    tags: [静, 笑]
    tone: ミステリアス
    situation: "放課後の図書室で、占い好きの女子生徒が同級生の消しゴムの行方を告げる"
    seconds: 20
    gender: female
    category: コメディ
  - id: d159
    kind: dialogue
    text: "さあ来たわよ、今年最後の福引! 去年はティッシュ、一昨年もティッシュ、その前は……ポケットティッシュ! でも今日は違う。今朝、茶柱が立ったの! 行くわよ、回すわよ、せーの! ……あ、白。……白って何? え、ティッシュ? 今年もティッシュ!? いいわ、受けて立つわ! 来年こそ温泉旅行、絶対にもぎ取るんだから!"
    tags: [動, 笑]
    tone: ハイテンション
    situation: "商店街の福引所で、毎年ティッシュしか当たらない主婦が気合いを入れて回す"
    seconds: 30
    gender: female
    category: コメディ
  - id: d166
    kind: dialogue
    text: "みんな見てる!? 今トンネルの一番奥! めっちゃ寒い! コメント欄『後ろ』って……え、後ろ? 後ろって、何……"
    tags: [動, 緊張]
    tone: ハイテンション
    situation: "心霊スポット配信中、女性配信者が廃トンネルの奥でカメラに向かってはしゃぐ"
    seconds: 10
    gender: female
    category: ホラー
  - id: d167
    kind: dialogue
    text: "う、うらめしや〜……あ、噛んだ。もう一回いきますね。うらめしやぁ〜! ……あれ、怖くない? おかしいな、先輩には『気迫が足りない』って言われて……。あの、ちょっとだけ怖がってもらえません? 初日なんです。評価つくんです。"
    tags: [笑, 温]
    tone: コミカル
    situation: "古い屋敷の夜、新米の女幽霊が初めて脅かす住人に緊張しながら挨拶する"
    seconds: 20
    gender: female
    category: ホラー
  - id: d168
    kind: dialogue
    text: "あらあら、迷っちゃったの? この辺、暗くなると街灯ひとつないからねえ。うちにおいで。茶も漬物もあるし、布団も干してある。……ふふ、遠慮しなくていいのよ。だって、あんたが来るのは知ってたもの。ほら、ここの道標、見てごらん。……あんたの名前、彫ってあるでしょ? 五十年前からね。さ、お入り。みんな、待ってるから。"
    tags: [温, 静]
    tone: フレンドリー
    situation: "夕暮れの田舎道で、親切な老婆が道に迷った旅人に家へ泊まるよう勧める"
    seconds: 30
    gender: female
    category: ホラー
  - id: d175
    kind: dialogue
    text: "発言、よろしいでしょうか。この計画、現場を知らない方が作ったものです。……私が、作り直します。一週間ください。"
    tags: [緊張, 動]
    tone: シリアス
    situation: "本社の役員会議室で、若手の女性社員が居並ぶ役員に向かって反論を切り出す"
    seconds: 10
    gender: female
    category: ビジネス
  - id: d176
    kind: dialogue
    text: "聞いて。台風で最終便が欠航、お客様は二百三十名。宿泊先は確保済み、送迎バスは二台だけ。優先はお子様連れとお年寄り。順番で揉めたら私を呼んで。……怒鳴られるのは私の仕事。あなたたちは、笑顔を切らさないで。行くよ。"
    tags: [緊張, 動]
    tone: シリアス
    situation: "空港のカウンター裏で、地上係員が欠航便の対応方針を同僚たちに伝える"
    seconds: 20
    gender: female
    category: ビジネス
  - id: d177
    kind: dialogue
    text: "いらっしゃいませ。……ふふ、やっぱり来てくれた。今日で最後だって、聞いたのね。三十八年。この店で、何本の花を束ねたかしら。あなたの結婚式のブーケも、お父様のお葬式の白菊も、全部覚えてる。……泣かないで。ほら、これ。最後の一束は、お代はいらないの。スイートピーよ。花言葉は『門出』。あなたじゃなくて、私の、ね。"
    tags: [温, 涙]
    tone: ソフト
    situation: "商店街の小さな花屋で、閉店を決めた店主が最後の日に常連客へ語りかける"
    seconds: 30
    gender: female
    category: ビジネス
  - id: d181
    kind: dialogue
    text: "聞いて。川の水位は、あと四十センチで堤防を越える。一班は南側の団地、二班は坂下の老人ホーム。車椅子の方が十四人いる、エレベーターは使わないで。三班は私と、橋の封鎖。無理はしないこと、流されたら助けに行けない。判断に迷ったら、無線で呼んで。必ず応える。……行きましょう。全員で、朝を迎えるよ。"
    tags: [緊張]
    tone: シリアス
    situation: "豪雨の夜、町の災害対策本部で、避難誘導班の若手職員たちに"
    seconds: 30
    gender: female
    category: 命令・指示
  - id: d185
    kind: dialogue
    text: "この帽子、さっきまで、誰かがかぶっていた。……覚えてる。灰色のコートで、窓の外ばかり見ていた人。次の駅で降りますって、確かにそう言った。でも、この列車、次の駅まであと三時間ある。……止まってない。一度も。じゃあ、あの人は、どこへ。……窓に、わたしの顔。その後ろに、もうひとつ。灰色の、帽子をかぶっていない、誰か。"
    tags: [静, 緊張]
    tone: ミステリアス
    situation: "深夜の夜行列車で、向かいの空席に置かれた帽子を見つめながら"
    seconds: 30
    gender: female
    category: 独白
