# situation: どこで、誰が、何のために読むか
# tags: 雰囲気タグ。静 / 動 / 笑 / 涙 / 緊張 / 温 から1〜2個
#
# 構成ルール（tests/test_lines_file.py で検証）
#   ジャンル・タグ・読み方のどれか1つで絞っても、男性/女性/不問それぞれ5本以上残ること
#   男性/女性/不問はそれぞれ30本以上
lines:
  - id: d004
    kind: dialogue
    text: "……起きてる？いや、いいんだ、寝てて。ただ、言っておきたくて。今日、君が笑ったとき、思ったんだ。この人の隣で、朝を迎えたいって。……ばかみたいだろ。でも、本気だ。返事は、いらない。ただ、明日の朝、一番に、おはようって言わせてくれ。おやすみ。……ちゃんと、あったかくして"
    tags: [静]
    tone: ウィスパー
    situation: "深夜、同じ毛布の端で眠りかけている恋人の耳元に"
    seconds: 30
    gender: male
    category: 恋愛
  - id: d005
    kind: dialogue
    text: "よう、久しぶり！……って、おまえ、髪切った？いや、いいじゃん、似合ってる似合ってる。で、元気だったか？連絡よこさないから、死んだかと思ったぞ。ほら、座れよ。今日はおれのおごり。何飲む？"
    tags: [温, 笑]
    tone: フレンドリー
    situation: "夜の居酒屋で、三年ぶりに会った高校の同級生を手招きして"
    seconds: 20
    gender: male
    category: 友情
  - id: d007
    kind: dialogue
    text: "もういい、聞きたくない。言い訳なら他でやれ。おれは、おまえが何をしたかを聞いてるんだ"
    tags: [静]
    tone: ストレート
    situation: "夜の事務所で、金を持ち出した後輩に机越しに"
    seconds: 10
    gender: male
    category: 対立
  - id: d009
    kind: dialogue
    text: "下がれ、全員！ここはおれが受け持つ！……来いよ、でかぶつ。その一撃、真正面から叩き返してやる！"
    tags: [動, 緊張]
    tone: ダイナミック
    situation: "崩れかけた橋の上で、巨大な敵を前に、仲間を背にかばって"
    seconds: 10
    gender: male
    category: バトル
  - id: d014
    kind: dialogue
    text: "座り込むな、油で汚れるぞ。……納期は落ちた。もう動かん。けどな、検品で弾いた三百個、見つけたのはおまえだ。あのまま出してたら、謝って済む話じゃなかった。……立て。六時にラインが戻る。それまでに段取り、二人で組み直すぞ。"
    tags: [静, 動]
    tone: ストレート
    situation: "深夜の工場で、納期を落として座り込む同僚の肩を叩いて"
    seconds: 20
    gender: male
    category: 励まし
  - id: d015
    kind: dialogue
    text: "全隊、聞け。これより北門へ移動する。私語は禁止、灯りも消せ。合図は私が出す。……行くぞ"
    tags: [緊張, 静]
    tone: シリアス
    situation: "夜明け前の砦の広場で、整列した部下たちに低く"
    seconds: 10
    gender: male
    category: 命令・指示
  - id: d018
    kind: dialogue
    text: "……結局、おれは何を守りたかったんだろうな。会社か。家族か。それとも、ただの自分の面子か。四十で、まだこんなことを考えてる。情けないよ。でも、ここで考えるのをやめたら、本当に終わる気がする。明日、辞表を出す。笑われるだろう。それでいい。やっと、自分の足で立つんだ。……帰るか。あいつら、起きて待ってるかもしれない"
    tags: [緊張, 静]
    tone: シリアス
    situation: "終電後の駅のベンチで、缶コーヒーを手に、ひとりで"
    seconds: 30
    gender: male
    category: 独白
  - id: d023
    kind: dialogue
    text: "皆様、本日はお集まりいただき、誠にありがとうございます。ご覧ください、この輝き。百年の伝統と、最新の技術が、ここに結ばれました。価格は、あえて申し上げません。本物を知る方だけに、お届けしたいのです"
    tags: [動]
    tone: ゴージャス
    situation: "ホテルの宴会場で、新作時計の発表会に集まった招待客へ壇上から"
    seconds: 20
    gender: male
    category: ビジネス
  - id: d025
    kind: dialogue
    text: "レジ締め、終わったから。先に上がっていいよ。……あ、傘持ってきたか？外、まだ降ってるぞ。"
    tags: [静]
    tone: ストレート
    situation: "深夜のコンビニのバックヤードで、先輩店員が後輩に先に帰れと声をかける"
    seconds: 10
    gender: male
    category: 日常
  - id: d026
    kind: dialogue
    text: "いや、違う違う、これは余ったんじゃない。予備だ、予備。……え、六本も？だってほら、説明書が全部絵じゃん。……座ってみ？ほら、揺れない。ぜんっぜん揺れな……揺れた。今ちょっと揺れたな。うん、電話するわ。"
    tags: [笑]
    tone: コミカル
    situation: "休日の自宅リビングで、組み立てた棚のネジが余り、男が同居人に言い訳する"
    seconds: 20
    gender: male
    category: 日常
  - id: d030
    kind: dialogue
    text: "鍵、ここ置くぞ。……ベランダのバジル、水は三日に一回でいい。やりすぎると根が腐る。おれがそうだった。……泣くな。いや、泣いてもいいけど、おれの前ではやめてくれ。決めたことが、揺らぐ。……元気で。麦茶、今日中に飲めよ。"
    tags: [緊張, 涙]
    tone: クール
    situation: "深夜、同棲していた部屋の玄関で、別れを切り出した男が恋人に鍵を返して"
    seconds: 20
    gender: male
    category: 恋愛
  - id: d036
    kind: dialogue
    text: "なあ、引いてるぞ。……あ、逃げた。お前、ぼーっとしすぎ。……まあいいや。で、辞めんの？……いや、止めねえよ。お前が決めたなら。ただな、辞めたあとに暇になったら、毎週ここ来いよ。俺、平日の朝はだいたいここにいるから。……おっ、今度は俺に来た！見ろ、これ！……ちっさ。笑うなよ。ほら、お前も笑ってんじゃん。それでいいんだよ。"
    tags: [温, 笑]
    tone: フレンドリー
    situation: "早朝の堤防で釣り糸を垂らしながら、退職に悩む親友に隣から声をかける"
    seconds: 30
    gender: male
    category: 友情
  - id: d039
    kind: dialogue
    text: "ほう……君がその、港で財を成したという御仁か。いや失敬、足元ばかり見ていたものでね。靴が泥で汚れていないか気になって。……ああ、冗談だよ、笑いたまえ。さて本題だ。この屋敷も、ぶどう畑も、娘も、君の帳簿には載らない。金で買えるものは、とうに全部持っているのでね。帰りの馬車は用意させた。……シャンパンは、持って帰っていい。"
    tags: [動]
    tone: ゴージャス
    situation: "夜会の大広間で、娘に求婚しに来た成り上がりの実業家を当主が見下す"
    seconds: 30
    gender: male
    category: 対立
  - id: d044
    kind: dialogue
    text: "ようこそ、終電のあとの駅へ。……足音が三つ。いや、四つか。隠れている一人は、息を止めるのが上手だね。さて、君たちが探している「呪具」なら、ここにある。この懐中時計だ。……おや、取りに来ないのかい。そう、正解だ。針が十二を指すまで、あと四十秒。その間、僕は一歩も動かない。動くのは、君たちの影のほうだよ。……ほら。足元、見てごらん。"
    tags: [静, 緊張]
    tone: ミステリアス
    situation: "終電後の無人駅のホームで、呪具を狙う退魔師たちを呪術師が迎え撃つ"
    seconds: 30
    gender: male
    category: バトル
  - id: d045
    kind: dialogue
    text: "三十年、ありがとうな。……最後の一杯、味噌汁の塩、ちょっと濃かっただろ。手が震えてさ。笑ってくれよ。"
    tags: [温]
    tone: ソフト
    situation: "閉店の日の夕暮れ、暖簾を下ろす食堂の店主が最後の常連客に言う"
    seconds: 10
    gender: male
    category: 悲哀
  - id: d047
    kind: dialogue
    text: "おー、荷物それだけ？　身軽だなあ。……いいよいいよ、泣くなって。おまえが泣くと俺までもらうだろ。向こう着いたら、まずうまいパン屋探せよ。写真送れ。……じゃあな。元気で。……行けって、ほら。搭乗、呼ばれてるぞ。"
    tags: [温, 涙]
    tone: フレンドリー
    situation: "空港の出発ロビーで、海外へ移住する親友を明るく見送ろうとする"
    seconds: 20
    gender: male
    category: 悲哀
  - id: d051
    kind: dialogue
    text: "網を離すな！おまえが今握ってるのは、ただのロープじゃねえ、じいさんから三代分の海だ！……怖いか？ああ、俺も怖い。毎朝な。だがな、波に背中を向けた奴から順番に、海は忘れていくんだよ。見ろ、空が白んできた。あと一回だ。一回だけ、俺と一緒に引け！それで終わったら、陸で好きなだけ泣かせてやる！"
    tags: [動]
    tone: ダイナミック
    situation: "時化の漁船の甲板で、網を放しかけた息子に父親が叫ぶ"
    seconds: 30
    gender: male
    category: 励まし
  - id: d054
    kind: dialogue
    text: "三番テーブル、魚が先だ。ソースは温め直せ、分離してる。田村、皿を拭け、縁に指紋。……慌てるな、客は逃げない。逃げるのはおまえの集中だけだ。はい、二番上がり。次、八番の肉、焼き始め。"
    tags: [静, 動]
    tone: ストレート
    situation: "満席のレストランの厨房で、料理長が若手たちに次々と指示を飛ばす"
    seconds: 20
    gender: male
    category: 命令・指示
  - id: d057
    kind: dialogue
    text: "……まだ、寝てていいよ。窓、開けただけだ。ほら、金木犀。おまえが毎年、先に気づくやつ。今年は、俺が勝ったな。"
    tags: [静]
    tone: ウィスパー
    situation: "明け方の病室で、老いた夫が眠る妻の枕元でひとり呟く"
    seconds: 10
    gender: male
    category: 独白
  - id: d061
    kind: dialogue
    text: "校長先生ー！　借り物競走のお題、あなたです！　走れますよね！？　走れますよね校長！？"
    tags: [動, 笑]
    tone: ハイテンション
    situation: "運動会の借り物競走で、お題「校長先生」を引いた男子生徒が観客席へ叫ぶ"
    seconds: 10
    gender: male
    category: コメディ
  - id: d063
    kind: dialogue
    text: "取れた……取れたぞ……！　三千二百円……三千二百円だ……！　おまえ、定価千円だろ？　知ってる、知ってるよ！　でもな、値段じゃないんだ……！　アームが滑るたびに、おまえが俺を見てた……「まだ行ける」って目をしてた……！　もう離さない。もう二度と、あの穴の上には戻さない……！　帰ろう、一緒に……うちへ……！"
    tags: [涙, 笑]
    tone: エモーショナル
    situation: "ゲームセンターで、三千円つぎ込んでやっと取れたぬいぐるみに男が号泣する"
    seconds: 30
    gender: male
    category: コメディ
  - id: d065
    kind: dialogue
    text: "……四階、押しましたよね。でも、このビル……三階までしかないんです。ほら、ランプが……"
    tags: [静, 緊張]
    tone: ウィスパー
    situation: "深夜の雑居ビルのエレベーターで、隣に立つ見知らぬ男が耳元で囁く"
    seconds: 10
    gender: male
    category: ホラー
  - id: d068
    kind: dialogue
    text: "走れ！　振り向くな、走れ！　……おい、手ぇ離すな！　足？　足なんか知るか、引きずってでも連れてく！　出口はこっちだ、赤いドア！　いいか、ドアを抜けたら俺が閉める。おまえは止まるな、車まで一直線だ！　三、二……行けええ！　……閉まれ……閉まれよ！　……閉まった……。……なあ、おまえ、車にいたよな……じゃあ今、俺の隣で……誰が押さえてた？"
    tags: [動, 緊張]
    tone: ダイナミック
    situation: "廃工場の肝試しで何かに追われ、足を痛めた仲間を引っ張って走る男"
    seconds: 30
    gender: male
    category: ホラー
  - id: d072
    kind: dialogue
    text: "……座ったままで結構。君の会社の話なら、もう聞いている。三か月後に資金が尽きることも、昨夜、奥さんに言えなかったことも。明日の朝九時、この封筒を開けなさい。小切手が入っている。金額は書いていない。……君が書くんだ、好きな数字を。ただし条件がある。十年後の今日、同じ席で、私が頼むことをひとつだけ聞いてもらう。……何を頼むかは、その時に。"
    tags: [静]
    tone: ミステリアス
    situation: "深夜のバーで、資金繰りに窮した起業家へ正体不明の男が出資を持ちかける"
    seconds: 30
    gender: male
    category: ビジネス
  - id: d073
    kind: dialogue
    text: "動くな。……そのまま、ゆっくり左手を上げろ。蜂だ。襟のところに止まってる。大丈夫、おれが払う。"
    tags: [緊張]
    tone: クール
    situation: "夏の庭先で、固まった弟の襟元に止まった蜂を、兄が声を抑えて払おうとする"
    seconds: 10
    gender: male
    category: 日常
  - id: d074
    kind: dialogue
    text: "親父……これ、俺の運動会の写真じゃん。財布の中に、ずっと入れてたのかよ。……なんで言わねえんだよ、そういうこと。ずっと、嫌われてると思ってた。……ばか。遺品整理なんて、できるわけないだろ。"
    tags: [涙, 温]
    tone: エモーショナル
    situation: "亡き父の部屋で、遺品の財布から出てきた古い写真を手に、息子が一人呟く"
    seconds: 20
    gender: male
    category: 日常
  - id: d075
    kind: dialogue
    text: "聞いてくれ。今日のレジ、三千円足りなかった。いや、誰を疑ってるわけじゃない。……ただ、店長に報告する前に、お前たちに先に話しておきたかったんだ。心当たりがある奴は、今夜中に俺に言ってくれ。そうすれば、俺の責任で処理する。誰にも言わない。……約束する。だから、黙ったまま明日を迎えるのだけは、やめてくれ。"
    tags: [緊張, 静]
    tone: シリアス
    situation: "閉店後の店の控室で、バイトリーダーが後輩たちにレジの不足金について切り出す"
    seconds: 30
    gender: male
    category: 日常
  - id: d082
    kind: dialogue
    text: "違う違う、これは告白じゃなくて……確認！　君が俺のこと好きかどうかの、ただの事務的な確認です！"
    tags: [笑, 緊張]
    tone: コミカル
    situation: "昼休みの社員食堂で、勢いで告白しかけた新人社員が、慌てて取り繕う"
    seconds: 10
    gender: male
    category: 恋愛
  - id: d083
    kind: dialogue
    text: "姫。この庭の薔薇は、すべてあなたのために今朝咲かせました。千本です。数えさせました。……足りませんか？　ならば明日は、この国中の花を摘ませましょう。あなたの一度の微笑みに比べれば、安いものだ。"
    tags: [動]
    tone: ゴージャス
    situation: "異国の王宮の薔薇園で、若き王が、婚約者の姫の前に片膝をついて大仰に愛を語る"
    seconds: 20
    gender: male
    category: 恋愛
  - id: d084
    kind: dialogue
    text: "座ってくれ。……手術の説明は、さっき先生から聞いたよな。成功率の話も。俺はな、その数字を聞いたとき、正直、足が震えた。でも君は笑ってた。だから俺も、笑うべきだと思った。……でも、やめる。笑わない。怖いって、ちゃんと言う。君がいなくなるのが怖い。だから、必ず戻ってきてくれ。手術室の前で、ずっと立ってるから。"
    tags: [緊張, 涙]
    tone: シリアス
    situation: "手術前夜の病室で、夫が、気丈に振る舞う妻の手を取り、本音を打ち明ける"
    seconds: 30
    gender: male
    category: 恋愛
  - id: d091
    kind: dialogue
    text: "いいよ、泣けよ。誰も見てねえし。……ほら、俺の袖使え。洗濯すりゃ済む。その代わり、明日の朝練、一番乗りな。"
    tags: [温, 静]
    tone: ソフト
    situation: "試合に負けた夜の部室で、唇を噛んでいる同期の肩を、男がそっと抱き寄せる"
    seconds: 10
    gender: male
    category: 友情
  - id: d092
    kind: dialogue
    text: "おいおいおい、見ろよこれ！　受かってる！　お前の番号あるぞ、三〇二番！　俺？　俺のことはいいんだよ、今はお前だ！　ほら肩車！　上がれ上がれ！　この掲示板の前で一番目立ってやろうぜ！"
    tags: [動, 笑]
    tone: ハイテンション
    situation: "大学の合格発表の掲示板前で、自分は落ちた男が、受かった親友の番号を見つけて叫ぶ"
    seconds: 20
    gender: male
    category: 友情
  - id: d093
    kind: dialogue
    text: "……銃を下ろせ。お前が誰の命令で来たのかは、聞かない。ただ、十年前の夏、川で溺れた俺を引き上げたのは誰だったか、それだけ思い出せ。あのとき俺は、お前に命を預けた。今日もそうだ。撃つなら撃て。でも、その前に名前を呼んでくれ。昔みたいに、呼び捨てで。……それができないなら、お前はもう俺の知ってるお前じゃない。"
    tags: [緊張, 静]
    tone: クール
    situation: "廃倉庫の暗がりで、銃を向けてきた幼なじみに、男が動じずに語りかける"
    seconds: 30
    gender: male
    category: 友情
  - id: d100
    kind: dialogue
    text: "座れよ。茶、淹れたから。……父さんの言い方が悪かった。おまえが決めた道なら、反対はしない。ただ、話は聞かせろ。"
    tags: [温]
    tone: ソフト
    situation: "夜の台所で、進路で言い合った高校生の息子に父がお茶を出しながら"
    seconds: 10
    gender: male
    category: 対立
  - id: d101
    kind: dialogue
    text: "なんで今なんだよ。来月、やっと渋谷のステージが決まったんだぞ。……就職? そんなの知ってるよ。おれだって親に頭下げて続けてきた。けど、おまえがいないなら、このバンドは終わりだ。……頼む、もう一回だけ、ギター持ってくれ。"
    tags: [涙]
    tone: エモーショナル
    situation: "ライブハウスの楽屋で、脱退を告げた幼なじみのギタリストにボーカルが"
    seconds: 20
    gender: male
    category: 対立
  - id: d102
    kind: dialogue
    text: "だから言ってんだろ、煮干しは三十匹だって! 五十匹入れたら誰が食うんだよ、猫か? ……あ、お客さん、どうぞどうぞ、ただの兄弟会議ですんで。……おい、聞けって。親父のノート見ろ、ほら、ここ、三十って書いてある。……え、これ三十じゃなくて二十? ……あー、じゃあおれも間違ってんじゃねえか。……いいか、今日のところは引き分けな。"
    tags: [笑]
    tone: コミカル
    situation: "昼のラーメン屋の厨房で、スープの配合で揉める兄に弟が客の前で"
    seconds: 30
    gender: male
    category: 対立
  - id: d109
    kind: dialogue
    text: "そこまでだ。弾は残り一発、おれは数えてた。……その一発、おれか、自分か。どっちも外れだ。まだ間に合う。"
    tags: [緊張]
    tone: クール
    situation: "地下駐車場で、拳銃を構える逃亡犯に刑事が銃口を向けたまま"
    seconds: 10
    gender: male
    category: バトル
  - id: d110
    kind: dialogue
    text: "よく来たな、勇者よ。長旅ご苦労だった。……ほう、その剣、よく磨いてある。だが足りんな。玉座に届くまでに、あと七人の騎士と、この余を越えねばならん。さあ、踊ろうか。この夜を、史上もっとも美しい戦にしよう。"
    tags: [動]
    tone: ゴージャス
    situation: "魔王城の玉座の間で、踏み込んできた勇者一行を魔王が立ち上がって迎える"
    seconds: 20
    gender: male
    category: バトル
  - id: d111
    kind: dialogue
    text: "……立てよ。まだ鐘は鳴ってない。三年前、この膝を壊したのはおまえだ。恨んだよ、毎晩な。でもな、礼を言う。あの日から、一日も走るのをやめなかった。雨の日も、膝が泣いた日も、全部今日のためだ。だから最後の一分、手は抜くな。おれも抜かない。……おまえを倒して、泣くのはそのあとだ！"
    tags: [涙]
    tone: エモーショナル
    situation: "決勝の最終ラウンド、三年前に自分の膝を壊した宿敵がダウンし、立てと叫ぶ"
    seconds: 30
    gender: male
    category: バトル
  - id: d118
    kind: dialogue
    text: "この時計、止まったのは午前三時十二分。……妻が息を引き取った時刻と、同じでね。直す気になれないんだ。"
    tags: [静]
    tone: ミステリアス
    situation: "埃の積もった時計店で、客に止まった柱時計の由来を語る老店主"
    seconds: 10
    gender: male
    category: 悲哀
  - id: d119
    kind: dialogue
    text: "はーい、乾杯の音頭はおれが預かりました! 本当は、ケンジがやるはずだったんだけどさ。あいつ、原稿まで書いてたんだよ。……だから、読むぞ! 「二人とも、幸せになれ。じゃないと化けて出る」。……以上! 乾杯!"
    tags: [動]
    tone: ハイテンション
    situation: "結婚披露宴の会場で、亡くなった親友の代わりに乾杯の挨拶を明るく"
    seconds: 20
    gender: male
    category: 悲哀
  - id: d120
    kind: dialogue
    text: "ほら見ろ、この壁の穴、おれが二十歳のとき開けたやつ。家賃、三ヶ月滞納したときも、大家さん、笑って待っててくれたよな。……え、敷金? 全部パーに決まってんだろ、この穴で。あはは。……あーあ、十五年か。畳も冷蔵庫も、全部ここに置いてく。……おれだけ、持ってけないもん、持ってっちゃうけど。……じゃあな、二〇三号室。おれの青春。"
    tags: [笑]
    tone: コミカル
    situation: "引っ越しの日の空になったアパートで、見送りに来た大家に"
    seconds: 30
    gender: male
    category: 悲哀
  - id: d127
    kind: dialogue
    text: "カードは、こう言っている。……お前が選ばなかった道は、まだ閉じていない。急ぐな。その道は、お前より足が遅い。"
    tags: [静]
    tone: ミステリアス
    situation: "占い館の奥で、進路に迷う青年に老占い師が静かに告げる"
    seconds: 10
    gender: male
    category: 励まし
  - id: d128
    kind: dialogue
    text: "……鼻すすってんの、聞こえてるぞ。いいよ、返事しなくて。明日の試験、落ちたっていい。ただな、おまえが毎晩電気を消したあとも鉛筆を動かしてた音、俺はずっと聞いてた。それだけは、誰にも消せないから。"
    tags: [静, 温]
    tone: ウィスパー
    situation: "深夜の寮の二段ベッドで、下の段で泣く弟分に兄貴分が囁く"
    seconds: 20
    gender: male
    category: 励まし
  - id: d129
    kind: dialogue
    text: "おい、顔が白いぞ。鏡見ろ、鏡！ 豆腐か、おまえは。いいか、相手は三年も一緒に住んでる彼女だ。今さら何を怖がる。昨日もパンツ裏返しで干してたの、彼女が直してくれてたじゃねえか。……ほら、やっと笑った。その顔で行け。指輪は俺が持ってる。落とさねえよ。……たぶん。"
    tags: [笑]
    tone: コミカル
    situation: "結婚式の控え室で、緊張で固まる新郎に親友が明るく喝を入れる"
    seconds: 30
    gender: male
    category: 励まし
  - id: d136
    kind: dialogue
    text: "おう、タオルは絞ってから上がれよ。それと、じいちゃんの背中、今日はおまえが流してやれ。"
    tags: [温]
    tone: フレンドリー
    situation: "下町の銭湯の脱衣所で、番台の主人が常連の小学生に声をかける"
    seconds: 10
    gender: male
    category: 命令・指示
  - id: d137
    kind: dialogue
    text: "よし野郎ども、肩入れろ！ 一番町の角、曲がるぞ！ 右、半歩下がれ！ 左、声出せ、聞こえねえ！ いいか、今年は雨だ、足元見ろ、でも顔は上げろ！ 空に見せつけるんだよ、俺たちの神輿を！ せーの、わっしょい！"
    tags: [動]
    tone: ハイテンション
    situation: "夏祭りの神輿の前で、若頭が担ぎ手たちに勢いよく号令をかける"
    seconds: 20
    gender: male
    category: 命令・指示
  - id: d138
    kind: dialogue
    text: "おはようございます。よく眠れました？ では、ゆっくり支度しましょう。靴紐は二重に、ザックの腰ベルトは骨盤の上で締めてください。娘さんは私のすぐ後ろ、お父さんは最後尾をお願いします。歩く速さは、話しながら登れるくらいで。きつくなったら、遠慮なく声をかけてください。頂上は逃げませんから。……さあ、空が白んできた。行きましょうか。"
    tags: [温, 静]
    tone: ソフト
    situation: "山小屋の夜明け、ガイドが初登山の父娘に静かに出発の手順を伝える"
    seconds: 30
    gender: male
    category: 命令・指示
  - id: d145
    kind: dialogue
    text: "来いよ、海！ 今夜も俺は灯を消さねえ！ この光のある限り、一隻だって沈めさせるもんか！"
    tags: [動]
    tone: ダイナミック
    situation: "嵐の夜の岬の灯台で、守り手の男が荒れる海に向かって吠える"
    seconds: 10
    gender: male
    category: 独白
  - id: d146
    kind: dialogue
    text: "おう、よく走ったな。十二年、二十万キロ。初デートも、おふくろの退院の日も、おまえの助手席だ。エアコンが死んでからの夏はきつかったけどな。……次のやつ、燃費はいいんだ。でも、静かすぎてさ。……ありがとな。ゆっくり休め。"
    tags: [温]
    tone: フレンドリー
    situation: "廃車の日、解体場の前で男が十二年乗った軽自動車のボンネットを撫でて"
    seconds: 20
    gender: male
    category: 独白
  - id: d147
    kind: dialogue
    text: "え、待って待って待って。もう一回。三、七、七、一……合ってる。合ってる！ うそだろ、うそだろ！ やばいやばい、手が、手が震えて……。落ち着け、落ち着け俺。深呼吸、深呼吸……無理！ 誰か、誰かに言いたい！ でも言ったらだめなやつだこれ！ ああもう、とりあえずコロッケ買おう。十個買おう。今日は全部、俺のおごりだ！ 誰もいねえけど！"
    tags: [動, 笑]
    tone: ハイテンション
    situation: "深夜のコンビニ前で、宝くじの当選番号を確認した青年が叫ぶ"
    seconds: 30
    gender: male
    category: 独白
  - id: d154
    kind: dialogue
    text: "……寝息、確認。よし。冷蔵庫のプリン、名前書いてあったけど……あれは、おれへの挑戦状だと解釈する。"
    tags: [静, 笑]
    tone: ウィスパー
    situation: "深夜の寝室で、夫が眠る妻を起こさぬよう冷蔵庫のプリンを狙って呟く"
    seconds: 10
    gender: male
    category: コメディ
  - id: d155
    kind: dialogue
    text: "いいか、よく聞け。明日、おれたちの運命を決めるのは……たこ焼きの返しだ。一発で返せ。迷えば生地が崩れる。崩れれば客は離れる。客が離れれば、隣のクラスのクレープに負ける。……絶対に、負けられない。"
    tags: [緊張, 笑]
    tone: シリアス
    situation: "文化祭前夜の教室で、男子生徒がたこ焼きの返し方を仲間へ真剣に説く"
    seconds: 20
    gender: male
    category: コメディ
  - id: d156
    kind: dialogue
    text: "見てろよ、タケル! パパの二重跳び、いくぞ! ふっ……はっ! ……今のはウォーミングアップだ。本番はここからだ! せーの……おりゃあ! ……おい、今、足に引っかかったの見たか? 見てないよな? よし、見てないならノーカウントだ! もう一回! パパは諦めない! 諦めたらそこで……あっ、腰が。"
    tags: [動, 笑]
    tone: ダイナミック
    situation: "休日の公園で、父親が幼い息子に二重跳びを実演すると大げさに宣言する"
    seconds: 30
    gender: male
    category: コメディ
  - id: d163
    kind: dialogue
    text: "落とし物です。公園のベンチに、この手帳が。……中、見ました。全ページに、ぼくの今日の行動が書いてあります。"
    tags: [静, 緊張]
    tone: ストレート
    situation: "深夜の交番で、拾った手帳を届けに来た青年が警官に淡々と事実を述べる"
    seconds: 10
    gender: male
    category: ホラー
  - id: d164
    kind: dialogue
    text: "ようこそ、我が城へ! 今宵は百年に一度の晩餐、心ゆくまでお楽しみを! 料理は十二皿、ワインは地下の秘蔵。ああ、ひとつだけ。夜明けの鐘まで、決して席をお立ちになりませんよう。前回立った方は……まだ、壁の中においでです。"
    tags: [動, 緊張]
    tone: ゴージャス
    situation: "霧の古城の大広間で、城主が晩餐会に招いた客たちを両手を広げて歓迎する"
    seconds: 20
    gender: male
    category: ホラー
  - id: d165
    kind: dialogue
    text: "もしもし……おれだ。今、帰り道で、少し事故に遭って。大丈夫、怪我はない。ただ……お前の声が聞きたくなった。それだけだ。なあ、覚えてるか。去年の夏、二人で見た花火。もう一度、行こうな。約束だ。……え? 何言ってるんだ。おれは……。ちょっと待ってくれ。今、お前、なんて言った。おれが帰ってきたのは……三日前の、夜って。"
    tags: [涙, 緊張]
    tone: エモーショナル
    situation: "雨の夜の事故現場の路肩で、男が電話口の妻へ震える声で語りかける"
    seconds: 30
    gender: male
    category: ホラー
  - id: d172
    kind: dialogue
    text: "お疲れさん。……手、まだ震えてるな。いいんだ、それで。緊張したぶんだけ、ちゃんと届いてたよ。"
    tags: [温, 静]
    tone: ソフト
    situation: "終業後のオフィスで、部長が初プレゼンを終えた部下にそっと声をかける"
    seconds: 10
    gender: male
    category: ビジネス
  - id: d173
    kind: dialogue
    text: "慌てるな。画面から目を離せ。……全銘柄、売り注文は保留。これは暴落じゃない、ただの振り落としだ。十分後に反発する。根拠? 二十年、この席に座ってる。……三崎、手が止まってるぞ。買いの準備。残り、六分。"
    tags: [緊張, 静]
    tone: クール
    situation: "証券会社のディーリングルームで、トレーダーが暴落の最中に部下へ指示する"
    seconds: 20
    gender: male
    category: ビジネス
  - id: d174
    kind: dialogue
    text: "この店が潰れない理由、ですか。……ええ、売上は月に十万もない。家賃も払えんでしょうな、普通なら。ですが、この店には一人だけ、特別なお客様がおりましてね。月に一度、閉店後にいらっしゃる。何を買うのかって? ……本ではありません。棚と棚の間の、あの隙間に置いてあるものを。……あなた、見えますか。見えないなら……今日はお帰りになったほうがいい。"
    tags: [静, 緊張]
    tone: ミステリアス
    situation: "雨の夜の古書店で、店主が訪ねてきたコンサルタントに商売の秘密を語る"
    seconds: 30
    gender: male
    category: ビジネス
  - id: d183
    kind: dialogue
    text: "ミラー、見た？うん、それでいい。ブレーキは、踏むんじゃなくて、乗せる感じ。……そう、上手い。焦らなくていい、後ろは誰もいない。ハンドル、もう少し右。いや、戻しすぎ。うん、そこ。……母さんにも、こうやって教えたんだよ。三十年前、同じ場所で。あのときは、ポールを一本折ったけどな。……はい、停止線。ゆっくり。……よし、合格。"
    tags: [静, 温]
    tone: ストレート
    situation: "日曜の早朝、人気のない埠頭の駐車場で、免許を取りたての娘の助手席から"
    seconds: 30
    gender: male
    category: 日常
