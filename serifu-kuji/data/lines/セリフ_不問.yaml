# セリフくじの台本: セリフ（不問）
# このフォルダ内の *.yaml はすべて読み込まれ、1つの台本として扱われる。id はフォルダ全体で重複不可
#
# kind: narration / dialogue
# seconds: 10 / 20 / 30
# gender: male / female / any（不問）
# category: ナレーションはジャンル名、セリフは場面の種類。新しい語を書くと画面の選択肢に増える
# tone: 読み方。ストレート / シリアス / ダイナミック / ソフト / クール / ゴージャス /
#       エモーショナル / コミカル / ミステリアス / フレンドリー / ハイテンション / ウィスパー
# situation: どこで、誰が、何のために読むか
# tags: 雰囲気タグ。静 / 動 / 笑 / 涙 / 緊張 / 温 から1〜2個
#
# 構成ルール（tests/test_lines_file.py で検証）
#   ジャンル・タグ・読み方のどれか1つで絞っても、男性/女性/不問それぞれ5本以上残ること
#   男性/女性/不問はそれぞれ30本以上
lines:
  - id: d002
    kind: dialogue
    text: "ただいま。……あ、電気つけっぱなしだった。まあいいか。冷蔵庫、何が残ってたっけ。卵と、ねぎと、昨日のごはん。よし、チャーハンにしよう。今日はそれで、十分。お疲れさま、自分。"
    tags: [温, 静]
    tone: ソフト
    situation: "夜、一人暮らしの部屋に帰ってきて、誰にともなく"
    seconds: 20
    gender: any
    category: 日常
  - id: d006
    kind: dialogue
    text: "なんで、黙ってたの。引っ越すなんて、一言も聞いてない。……怒ってるんじゃない。悔しいんだよ。十年も一緒にいたのに、最後の最後まで、頼ってもらえなかったのが。……はあ、息、切れた。鞄、教室に置いてきちゃった。トラック、もう出るんでしょ。いいから、こっち向いて。言わせて。ありがとう。また会おう。絶対に、また会おう。"
    tags: [涙, 動]
    tone: エモーショナル
    situation: "夕方、荷物を積み終えた引っ越しトラックの前で、黙って去る親友に追いついて"
    seconds: 30
    gender: any
    category: 友情
  - id: d010
    kind: dialogue
    text: "はは、まだ立てるじゃん！いいね、最高！ボロボロの顔で笑うなんて、どういう神経してるの！こっちだって、膝が笑ってるけどさ、まだ終わりじゃない！聞こえる？観客席、めちゃくちゃ沸いてる！さあ、ラスト一分！全部出し切るよ！行くよ、カウント三つ！三、二、一……フィニッシュだーっ！"
    tags: [動, 笑]
    tone: ハイテンション
    situation: "闘技場の決勝で、傷だらけの対戦相手と最後の打ち合いに入りながら"
    seconds: 30
    gender: any
    category: バトル
  - id: d012
    kind: dialogue
    text: "ごめん、間に合わなかった。走ったんだ、本当に。信号も無視して、何度も転んで。でも、着いたときには、もう……。ねえ、最後に、何て言おうとしてた？聞きたかった。聞かなきゃいけなかった。……ばあちゃん。ずっと、ありがとうって言えなかった。今、言うよ。遅いよね。ごめん。ありがとう。"
    tags: [涙, 静]
    tone: エモーショナル
    situation: "夜の病室で、間に合わなかった祖母の手を握って"
    seconds: 30
    gender: any
    category: 悲哀
  - id: d013
    kind: dialogue
    text: "大丈夫、ちゃんと見てたよ。あんなに練習したんだから。今日は、休んでいい。明日また、一緒に行こう"
    tags: [温, 涙]
    tone: ソフト
    situation: "夕暮れの体育館の裏で、試合に負けて座り込む後輩の隣に"
    seconds: 10
    gender: any
    category: 励まし
  - id: d019
    kind: dialogue
    text: "え、待って、それ醤油じゃないよ、めんつゆ！……あ、もう入れた？まあ、茶色いことには変わりないよね"
    tags: [笑]
    tone: コミカル
    situation: "昼の台所で、刺身に調味料をかけようとしている友人に慌てて"
    seconds: 10
    gender: any
    category: コメディ
  - id: d021
    kind: dialogue
    text: "ねえ、今の、聞こえた？……二階だよ。誰もいないはずの、二階。足音、ひとつ、ふたつ……止まった"
    tags: [静, 緊張]
    tone: ミステリアス
    situation: "夜、停電した古い家の一階で、隣にいる友人に声を潜めて"
    seconds: 10
    gender: any
    category: ホラー
  - id: d024
    kind: dialogue
    text: "お電話ありがとうございます、株式会社ソラマメ商事……あ、はい、はい、承知しております、本当に申し訳ございません。え、届いた商品が、靴下百足？いえ、ご注文は、十足で……あ、私の入力ミスですね。はい。はい。すぐに回収に伺います。……あの、九十足、お安くしますので、いかがでしょう。……冗談です。すみません"
    tags: [笑]
    tone: コミカル
    situation: "昼の事務所で、誤発注した取引先からのクレーム電話に、冷や汗をかきながら"
    seconds: 30
    gender: any
    category: ビジネス
  - id: d028
    kind: dialogue
    text: "……あの、すみません。起きてください。もう閉まります。……あ、びっくりさせてごめんなさい。いえ、私は司書じゃなくて。隣で勉強してただけで。……ほら、もう電気、半分消えてますよ。……その本、借りていきます？だったら急いだほうが。カウンター、あと五分で閉まるって。……ふふ、よだれ。ついてます。右。……いえ、左。……はい、取れました。"
    tags: [静]
    tone: ウィスパー
    situation: "閉館間際の図書館で、隣席で眠り込んだ見知らぬ利用者を小声で起こす"
    seconds: 30
    gender: any
    category: 日常
  - id: d029
    kind: dialogue
    text: "傘、一本しかないけど……いい？濡れるの、半分こしよ。ゆっくり歩こ。遠回りでも、怒らないで。"
    tags: [温]
    tone: ソフト
    situation: "夕立の校門前で、傘を忘れた片想いの相手に一本の傘を差し出す"
    seconds: 10
    gender: any
    category: 恋愛
  - id: d032
    kind: dialogue
    text: "ねえ、知ってた？この橋の上で花火を見ると、ひとつだけ願いが叶うんだって。……嘘だと思うでしょ。でも去年、わたしは叶えたよ。……なにを、って？それは言えない。言ったら、消えちゃうから。……ふふ。手、冷たい？昔からそう。あ、最後の一発、来るよ。目、閉じないで。来年も……ここで会えるように。さよなら、じゃないよ。また、だよ。"
    tags: [静]
    tone: ミステリアス
    situation: "夏祭りの夜、橋の上で花火を見ながら、この世の者ではないらしい相手が恋人へ"
    seconds: 30
    gender: any
    category: 恋愛
  - id: d034
    kind: dialogue
    text: "……嘘、ついてたでしょ。ずっと。怒ってない。ただ、最後まで聞くから。今度こそ、本当のこと話して。"
    tags: [緊張]
    tone: シリアス
    situation: "夜の公園のベンチで、借金を隠していた親友の隣に座り、静かに問い詰める"
    seconds: 10
    gender: any
    category: 友情
  - id: d037
    kind: dialogue
    text: "鍵、返して。……合鍵のこと。もう使う理由、ないでしょ。郵便受けじゃなくて、ここで。顔を見て受け取りたいから。"
    tags: [静]
    tone: ストレート
    situation: "別れた恋人が荷物を取りに来た玄関先で、合鍵の返却を求める"
    seconds: 10
    gender: any
    category: 対立
  - id: d038
    kind: dialogue
    text: "待った待った！　お化け屋敷に賛成した覚えはないからね！？　焼きそば！　うちのクラスは三年連続焼きそばで優勝してるんだから！　伝統！　先輩の鉄板！　それを今年だけ段ボールの迷路にする？　ありえない！　多数決、もう一回！"
    tags: [動, 笑]
    tone: ハイテンション
    situation: "文化祭の出し物を決める教室で、対立する案の推進者に食ってかかる"
    seconds: 20
    gender: any
    category: 対立
  - id: d043
    kind: dialogue
    text: "師匠。……そこを、どいてください。峠の向こうに村があります。あなたが教えてくれた剣は、守るための剣だったはず。……抜きますよ。三年、一日も欠かさず振りました。あなたの型を、あなたに向けて使う日が来るなんて。……行きます。"
    tags: [緊張]
    tone: シリアス
    situation: "吹雪の峠で、村を襲おうとする堕ちた師匠に弟子が剣を抜く"
    seconds: 20
    gender: any
    category: バトル
  - id: d046
    kind: dialogue
    text: "……ごめんね。起きてないよね。今日、あんな言い方するつもりじゃなかった。……おやすみ。明日、ちゃんと言うから。"
    tags: [静]
    tone: ウィスパー
    situation: "喧嘩した夜、寝室で眠った恋人の背中に向かって謝罪を囁く"
    seconds: 10
    gender: any
    category: 悲哀
  - id: d050
    kind: dialogue
    text: "そのスーツ、今日で何回目？……いいよ、言わなくて。濡れたまま座ってる顔見れば分かる。でもね、落とされたのは履歴書の方で、あなたじゃない。はい、ハンカチ。返すのは、受かった日でいいから。"
    tags: [涙]
    tone: エモーショナル
    situation: "雨のバス停で、面接に落ちた就活生の隣に座った見知らぬ人が言う"
    seconds: 20
    gender: any
    category: 励まし
  - id: d053
    kind: dialogue
    text: "メス。……吸引、もう少し奥。心拍は読み上げ続けて。震えるなら代わる。震えないなら、黙って出血を止めて。"
    tags: [緊張]
    tone: クール
    situation: "深夜の手術室で、執刀医が手の震える研修医に淡々と指示する"
    seconds: 10
    gender: any
    category: 命令・指示
  - id: d056
    kind: dialogue
    text: "ちょっと待って、王子どこ！？王子がいないのに姫が目覚めてる！……誰か、とりあえず木の役で出て！照明さん、青！青って言ったのに桃色！まあいい、ロマンチックってことで！音響、鳥の声！……え、犬しかない？じゃあ犬！この森には犬がいる設定！王子見つかった！？トイレ！？……姫、もう一回寝て！お願い、あと三十秒だけ寝てて！"
    tags: [笑, 動]
    tone: コミカル
    situation: "市民劇団の本番中、舞台袖で舞台監督が大混乱の中で指示を出す"
    seconds: 30
    gender: any
    category: 命令・指示
  - id: d059
    kind: dialogue
    text: "……数字が、合わない。三年前の、あの論文から。先生が、ずっと。……知らなかったことにするのは、簡単だ。この画面を閉じて、明日も「おはようございます」って言えばいい。でも、閉じたら。閉じたら、次に嘘を書くのは、自分だ。"
    tags: [緊張]
    tone: シリアス
    situation: "深夜の研究室で、指導教授の不正データに気づいた院生が呟く"
    seconds: 20
    gender: any
    category: 独白
  - id: d060
    kind: dialogue
    text: "今夜も、十一時五十九分で止まった。この店の時計は全部、同じ時刻で。……ああ、来るね。足音が、道の方じゃなくて、壁の中から聞こえる。扉の鈴は鳴らない。……どの子を渡そうか。どれを選んでも、針はもう動かないけれど。一つだけ、選べる。そのお客さんが止まった時刻を、代わりに刻んでくれる子を。……さあ、おいで。鍵は、開いてるよ。"
    tags: [静]
    tone: ミステリアス
    situation: "真夜中の古時計店で、店主が止まった時計たちに向かって語る"
    seconds: 30
    gender: any
    category: 独白
  - id: d062
    kind: dialogue
    text: "すみません、遅刻しました。理由は、家を出る直前に、玄関の鍵をかけたかどうか不安になりまして。いえ、戻ったのではなく、不安とはそもそも何かを四十分ほど考えておりました。結論は出ておりません。以上です。"
    tags: [静, 笑]
    tone: ストレート
    situation: "朝の職場で、遅刻した新人が上司に向かって真顔で理由を報告する"
    seconds: 20
    gender: any
    category: コメディ
  - id: d067
    kind: dialogue
    text: "止まって。この看板……さっきも見た。「山頂まで二キロ」。一時間歩いて、まだ二キロ。……いい、よく聞いて。次にこの看板を見たら、文字が変わってるかもしれない。その時は、絶対に読まないで。読んだ方が、置いていかれる。"
    tags: [緊張]
    tone: シリアス
    situation: "夕暮れの山道で、同じ看板を何度も通過していると気づいた登山者が同行者へ"
    seconds: 20
    gender: any
    category: ホラー
  - id: d070
    kind: dialogue
    text: "自分を動物に例えると……ナマケモノです！　あ、待ってください、週に一度しか動かないところが、計画的で……！"
    tags: [笑, 緊張]
    tone: コミカル
    situation: "採用面接で「自分を動物に例えると」と聞かれた就活生が慌てて取り繕う"
    seconds: 10
    gender: any
    category: ビジネス
  - id: d079
    kind: dialogue
    text: "次、来ます！　風上に回って、ゴミ袋の口を全開に！　せーの、で一気に葉っぱ入れますよ！　せーの！"
    tags: [動]
    tone: ダイナミック
    situation: "秋の町内清掃で、強風の中、落ち葉を集める近所の人たちに掛け声をかける"
    seconds: 10
    gender: any
    category: 日常
  - id: d080
    kind: dialogue
    text: "お待たせいたしました！　本日のメインディッシュ、『三丁目の夕焼けオムライス』でございます。卵は三個、ケチャップは二度がけ、仕上げの旗は手描きです。……お誕生日おめでとう。さあ、スプーンをお取りください。"
    tags: [動, 温]
    tone: ゴージャス
    situation: "自宅のダイニングで、祖母の誕生日に、孫が給仕を気取って手作りの一皿を運ぶ"
    seconds: 20
    gender: any
    category: 日常
  - id: d081
    kind: dialogue
    text: "やあ、今日もいい顔してるね。……ほら、いつものやつ。鯖缶、開けてあげるから、ちょっと待ってて。昨日来なかったから心配したよ。雨だったもんね。……こら、まだ開いてないってば。焦らない焦らない。ねえ、君の名前、本当はなんていうんだろうね。私はずっと、サバオって呼んでるけどさ。……気に入らない？　まあ、ゆっくり食べなよ。"
    tags: [温, 静]
    tone: フレンドリー
    situation: "公園の隅のベンチで、毎朝通る人が、顔なじみの野良猫に話しかけながら餌をやる"
    seconds: 30
    gender: any
    category: 日常
  - id: d088
    kind: dialogue
    text: "聞こえてる？　この電車止めてでも言う！　好き！　行かないで！　次の駅で待ってるから、降りて！"
    tags: [動]
    tone: ダイナミック
    situation: "発車ベルの鳴るホームで、閉まりかけた扉越しに、乗り込んだ相手へ思いを叫ぶ"
    seconds: 10
    gender: any
    category: 恋愛
  - id: d089
    kind: dialogue
    text: "指輪、返す。……いや、受け取って。あなたが選んだものだから。泣かないで。私はもう決めた。あなたの隣にいると、私は自分を嫌いになる。それだけ。……元気で。ベランダの鉢、水は週に一度でいいから。"
    tags: [緊張, 静]
    tone: クール
    situation: "深夜のマンションの駐車場で、荷物を車に積み終えた側が、感情を抑えて別れを告げる"
    seconds: 20
    gender: any
    category: 恋愛
  - id: d090
    kind: dialogue
    text: "さあ、お手をどうぞ。今宵の舞踏会で、あなたと踊らずに帰るなんて、神様が許しても私が許しません。音楽？　止まったなら、私が口ずさみましょう。シャンデリアが落ちても、私が受け止めましょう。……冗談ですよ。でもね、本気なのはひとつだけ。この一曲が終わる前に、あなたの答えを聞かせてほしい。私と、生涯のパートナーになってくれますか。"
    tags: [動]
    tone: ゴージャス
    situation: "仮面舞踏会の大広間で、曲の終わりが迫る中、ダンスの相手に華やかに求婚する"
    seconds: 30
    gender: any
    category: 恋愛
  - id: d097
    kind: dialogue
    text: "君の影、今日は少し長いね。……ああ、気にしないで。友達だから見えるだけ。あと三日は、大丈夫。"
    tags: [静]
    tone: ミステリアス
    situation: "夕暮れの神社の石段で、不思議な力を持つ友人が、隣に座る相手の影を見て呟く"
    seconds: 10
    gender: any
    category: 友情
  - id: d098
    kind: dialogue
    text: "立て！　日が暮れる前に小屋に着く！　足が動かないなら、私が引きずってでも連れてく！　約束したよね、二人で頂上に立つって！　ほら、肩貸せ！　いち、に、いち、に！　小屋の屋根、見えてる！　あと百メートル！"
    tags: [動, 緊張]
    tone: ダイナミック
    situation: "夕暮れ迫る雪山の稜線で、足を痛めた相棒を支えながら、山小屋へ向けて叫ぶ"
    seconds: 20
    gender: any
    category: 友情
  - id: d099
    kind: dialogue
    text: "答えは変わらない。あなたの計画には乗らない。……理由？　単純だ。成功したら、あなたは英雄になって、私は共犯者になる。失敗したら、二人とも牢の中。どっちに転んでも、私たちは友達じゃなくなる。それが嫌なんだ。……顔に出てるよ。もう準備は済んでるね。なら、止めない。ただ、帰ってきたら、何も聞かずに茶を淹れる。それだけは約束する。"
    tags: [緊張, 静]
    tone: クール
    situation: "城下町の茶屋の奥座敷で、謀反を持ちかけてきた旧友に、感情を殺して断りを告げる"
    seconds: 30
    gender: any
    category: 友情
  - id: d106
    kind: dialogue
    text: "はいはい、じゃんけんね。窓側取られたくらいで拗ねないの。負けたら朝ごはんの卵、あげるから。それで手打ち、ね?"
    tags: [温]
    tone: フレンドリー
    situation: "旅館の部屋で、布団の場所で揉めた友人に笑いながら"
    seconds: 10
    gender: any
    category: 対立
  - id: d107
    kind: dialogue
    text: "待ってください! 第三エンジン、冷却が終わってません。今飛ばせば三分で焼けます。整備班長として、発進は認められません。……処分なら後で好きなだけどうぞ。でも今は、この手を離すわけにはいかない。"
    tags: [動]
    tone: ダイナミック
    situation: "宇宙船の格納庫で、強行発進を命じる艦長に整備班長が立ちはだかる"
    seconds: 20
    gender: any
    category: 対立
  - id: d108
    kind: dialogue
    text: "三千万。……おや、まだ上げますか。結構。四千万。この絵は、わたくしの祖母が戦火の中で手放したものです。あなたにとっては壁の飾り、わたくしにとっては家族の肖像。……五千万。さあ、ついていらっしゃい、どこまでも。会場の皆さま、拍手の準備を。今夜、この絵は、帰るべき家へ帰ります。"
    tags: [動]
    tone: ゴージャス
    situation: "夜のオークション会場で、競り合うライバル収集家に札を上げながら"
    seconds: 30
    gender: any
    category: 対立
  - id: d115
    kind: dialogue
    text: "よーし、本気出すよ! 次の一発で決着ね。……ほら、手袋ちゃんとして。鼻、真っ赤だよ。笑わないで、構えて!"
    tags: [温]
    tone: フレンドリー
    situation: "雪の積もった公園で、雪合戦の最終ラウンド前に友人へ声をかける"
    seconds: 10
    gender: any
    category: バトル
  - id: d116
    kind: dialogue
    text: "残り三十秒! フライパン返して、ソース、いけえ! ……待って待って、塩入れた? 入れた? よし、信じる! あと十秒、盛り付け、皿を回して、……いま! ……やった、間に合った! さあ審査員、食らえ、こっちの一皿!"
    tags: [動]
    tone: ハイテンション
    situation: "料理バトル番組の収録スタジオで、ラスト三十秒に相棒へ叫ぶ"
    seconds: 20
    gender: any
    category: バトル
  - id: d117
    kind: dialogue
    text: "……静かに。梁が鳴る。下に見張りが二人、火鉢のそば。……いい、合図を待って。……敵が灯りを消したら、西の障子から入る。狙うのは巻物だけ。人は斬らない。……わかってる、父上の仇だって。でも今夜じゃない。……生きて帰れば、また来られる。……約束して。……そう、いい子。……行くよ。"
    tags: [静]
    tone: ウィスパー
    situation: "深夜の屋敷の天井裏で、忍びが若い弟子に潜入の手順を囁く"
    seconds: 30
    gender: any
    category: バトル
  - id: d124
    kind: dialogue
    text: "皆さま、四十年、ありがとうございました。この幕が下りたら、わたくしは客席の人間に戻ります。……さあ、拍手を。"
    tags: [動]
    tone: ゴージャス
    situation: "引退公演のカーテンコールで、舞台俳優が満員の客席に向かって"
    seconds: 10
    gender: any
    category: 悲哀
  - id: d125
    kind: dialogue
    text: "総員、甲板に集合! ……この船は今夜、最後の港に着く。明日には解体場だ。三十年、嵐も凪も、こいつと一緒に越えてきた。……だから泣くな、まだだ! 最後の汽笛は、全員で鳴らす! 行くぞ、手を掛けろ! ……今だ!"
    tags: [動]
    tone: ダイナミック
    situation: "夕暮れの甲板で、解体される貨物船の船長が乗組員に最後の号令を"
    seconds: 20
    gender: any
    category: 悲哀
  - id: d126
    kind: dialogue
    text: "おはよう、ハナコ。今日の朝ごはんは、りんごとさつまいも。……昨日より、食べるのが遅いね。いいよ、ゆっくりで。……あのね、お医者さんが言ってた。あと少しだって。……わたし、ここに来て二十年。あなたがいたから、続けられた。……ほら、りんご。好きでしょう。……今日は、ずっとそばにいるから。"
    tags: [静]
    tone: ストレート
    situation: "朝の動物園のゾウ舎で、老いたゾウに飼育員がりんごを差し出しながら"
    seconds: 30
    gender: any
    category: 悲哀
  - id: d133
    kind: dialogue
    text: "マシンは完璧だ。あとは君の腕だけ。……信じろ、とは言わない。見てる。戻ったら、整備日誌にサインをもらう。"
    tags: [緊張]
    tone: クール
    situation: "レース場のピットで、初出走を控えた新人ドライバーにメカニックが短く言う"
    seconds: 10
    gender: any
    category: 励まし
  - id: d134
    kind: dialogue
    text: "さあ、顔を上げて。鏡のなかのその人が、今夜このオペラ座を手に入れる歌姫。客席の二千人？ あなたの声を待ち焦がれた、二千人の恋人だと思いなさい。幕が上がったら、恋をするだけ。行ってらっしゃい、私の宝石。"
    tags: [動]
    tone: ゴージャス
    situation: "オペラ座の楽屋で、デビューを控えた若い歌手に大御所が華やかに激励する"
    seconds: 20
    gender: any
    category: 励まし
  - id: d135
    kind: dialogue
    text: "ねえ、覚えてる？ 小学生のとき、ここのプリンが食べたくて、二人で空き缶拾ってお金作ったの。あの日、店長だったおじさんが、ただでプリンくれたんだよね。……あのプリン、今も同じ味だよ。この町でそれができるの、あなただけなんだ。畳むのはいつでもできる。でも、もう一年だけ、一緒にプリン食べようよ。手伝うからさ。"
    tags: [温]
    tone: フレンドリー
    situation: "商店街の喫茶店で、店を畳むか悩む幼なじみに常連客が明るく話す"
    seconds: 30
    gender: any
    category: 励まし
  - id: d142
    kind: dialogue
    text: "いくよ、バトンは右手、受け取ったら前だけ見て！ 転んでもいい、止まるな！ 最後は全員でゴールだ！"
    tags: [動]
    tone: ハイテンション
    situation: "体育祭のリレー直前、控え場所でキャプテンが仲間に発破をかける"
    seconds: 10
    gender: any
    category: 命令・指示
  - id: d143
    kind: dialogue
    text: "動かないで……そのまま。カメラが左に向いたら、三つ数えて。一、二、三。今。壁沿いに、絵の額には触れずに、出口の緑のランプまで。靴音を立てないで。……大丈夫、私がついてる。閉館に取り残されたこと、誰にも言わないから。"
    tags: [静, 緊張]
    tone: ウィスパー
    situation: "夜の美術館で、警備員が隠れていた子どもに囁いて外へ導く"
    seconds: 20
    gender: any
    category: 命令・指示
  - id: d144
    kind: dialogue
    text: "まず、この鉋を持って。刃は触らない。木目を見る。逆目に引くと面が荒れるから、必ず順目を確かめる。引くときは腕じゃなく、腰で。一回で削ろうとしない。薄く、何度でも。削り屑の向こうが透けるくらい薄くなったら、合格。今日はそれだけでいい。終わったら刃を抜いて、油を一滴、布で拭いて箱に戻す。道具を大事にできない者に、木は応えてくれない。始めて。"
    tags: [静]
    tone: ストレート
    situation: "研修初日の朝、木工の工房で職人が新入りに道具の扱いを淡々と教える"
    seconds: 30
    gender: any
    category: 命令・指示
  - id: d151
    kind: dialogue
    text: "秒読み、あと十。読み切れていない。だが、ここで引けば負ける。……行く。指は、迷わない。"
    tags: [緊張]
    tone: クール
    situation: "対局室で、最終盤の一手を前に棋士が心の中で静かに呟く"
    seconds: 10
    gender: any
    category: 独白
  - id: d152
    kind: dialogue
    text: "あったかいね。今日はよく晴れてる。……あなた、ずいぶん軽くなったね。昔は膝が痺れるくらい重かったのに。いいよ、好きなだけ寝てて。洗濯物はあとで畳む。この日なたが動くまで、ここにいよう。ふたりで。"
    tags: [温, 静]
    tone: ソフト
    situation: "冬の縁側で、年老いた猫を膝に乗せた人が日向でゆっくり呟く"
    seconds: 20
    gender: any
    category: 独白
  - id: d153
    kind: dialogue
    text: "来たよ。遅くなって、ごめん。……ここ、桜が咲くって言ってたよね。本当だった。あのとき、君が最後に渡してくれた缶詰、まだ食べてないんだ。食べたら終わる気がして。……ばかだよね。生き残ったのに、ずっと君の後ろを歩いてる気がしてる。でも今日は、見てほしくて来た。前を向いて歩く練習、始めるから。散る前に、あの缶詰、開けるよ。約束する。"
    tags: [涙]
    tone: エモーショナル
    situation: "戦場跡の丘で、生還した兵士が戦友の名を刻んだ石を前に語る"
    seconds: 30
    gender: any
    category: 独白
  - id: d160
    kind: dialogue
    text: "ねえねえ、靴紐ほどけてるよ。……あ、両方だ。器用だね、どうやったらそうなるの? ほら、結んであげる。"
    tags: [温, 笑]
    tone: フレンドリー
    situation: "雨上がりの通学路で、同級生の靴紐がほどけているのを見つけて声をかける"
    seconds: 10
    gender: any
    category: コメディ
  - id: d161
    kind: dialogue
    text: "ちょっと……音。ポップコーンの音、めちゃくちゃ響いてる。今、静かなシーンだから。主人公が泣いてるのに、こっちはバリボリって……。え、噛まずに食べろって? できるわけないでしょ。……せめて、爆発シーンに合わせて。"
    tags: [静, 笑]
    tone: ウィスパー
    situation: "映画館の暗闇で、隣の友人のポップコーンの音が大きすぎて小声で注意する"
    seconds: 20
    gender: any
    category: コメディ
  - id: d162
    kind: dialogue
    text: "乗組員へ報告します。現在、本船は深刻な危機に直面しています。原因は、第三食料庫の冷蔵ユニット故障。影響範囲は、副艦長が三か月育てたヨーグルトの種菌、全滅。副艦長は現在、格納庫で膝を抱えています。航行に支障はありません。繰り返します、航行に支障はありません。……ただし、朝食には支障があります。以上。"
    tags: [静, 笑]
    tone: ストレート
    situation: "宇宙船の操縦席で、船のAIが乗組員に非常事態の内容を淡々と報告する"
    seconds: 30
    gender: any
    category: コメディ
  - id: d169
    kind: dialogue
    text: "お疲れさまでした〜! 出口はこちらです! ……あれ、お客様。入られたの、お二人でしたよね? 今、三人目が……"
    tags: [動, 緊張]
    tone: ハイテンション
    situation: "遊園地のお化け屋敷の出口で、スタッフが出てきた客を元気に見送る"
    seconds: 10
    gender: any
    category: ホラー
  - id: d170
    kind: dialogue
    text: "……時刻表、見て。終電、二十三時五十分って書いてある。でも今、零時十二分。もう三本目の電車が通過してる。この駅、一時間に一本だよ。……動かないで。アナウンス、聞こえるよね。『次は終点』って……この路線に、終点はない。"
    tags: [緊張, 静]
    tone: シリアス
    situation: "深夜の無人駅のホームで、終電を待つ人が隣の同僚に時刻表の異変を告げる"
    seconds: 20
    gender: any
    category: ホラー
  - id: d171
    kind: dialogue
    text: "眠れないの? いいよ、おはなししてあげる。むかしむかし、この部屋に、きみとそっくりな子が住んでいたんだ。その子もね、夜になると怖がって、ぼくを抱きしめてくれた。……うれしかったなあ。だからぼくは、その子を離さなかった。ずっと、ずっとね。……さあ、目を閉じて。大丈夫。朝が来ても、きみはここにいるよ。ぼくと一緒に。永遠に。"
    tags: [温, 静]
    tone: ソフト
    situation: "月夜の屋根裏部屋で、古いぬいぐるみが眠れない子どもにやさしく語りかける"
    seconds: 30
    gender: any
    category: ホラー
  - id: d178
    kind: dialogue
    text: "……できた。これで最後だ。三十八年、この旋盤と一緒だった。あとは頼むよ。……うん、泣いてない。油が目に入った。"
    tags: [涙, 温]
    tone: エモーショナル
    situation: "町工場の作業場で、定年を迎える職人が最後の製品を仕上げ後輩へ声をかける"
    seconds: 10
    gender: any
    category: ビジネス
  - id: d179
    kind: dialogue
    text: "さあ、一発芸をやっていただくのは……この方! ……えー、幹事。はい、私です。おかしいな、箱に自分の名前、入れた覚えが……部長、なんで目を逸らすんですか。……やります。やりますけど、査定に響かないって約束してください。"
    tags: [笑, 動]
    tone: コミカル
    situation: "社内の忘年会で、幹事が一発芸の抽選結果を発表すると自分の名前が出てしまう"
    seconds: 20
    gender: any
    category: ビジネス
  - id: d180
    kind: dialogue
    text: "おや、まだ残っていたんですか。……退職届、出したんでしょう。知ってますよ、掃除をしていると、何でも聞こえてくる。……実はね、お誘いしたい職場があるんです。給料は今の三倍。残業なし。……ただし、面接は一度きり。場所は、この屋上。時間は、今夜零時。……どうしてわかるのかって? ふふ、ずっとね、あなたを見ていましたから。この街の全部のビルから。"
    tags: [静, 緊張]
    tone: ミステリアス
    situation: "夜のオフィス屋上で、退職届を出した社員に現れた清掃員が奇妙な転職先を勧める"
    seconds: 30
    gender: any
    category: ビジネス
  - id: d182
    kind: dialogue
    text: "どいて、じゃない。どかない。鍵、渡して。……飲んでないって、息でわかるよ。何本目だった？数えてないでしょ。家まで二十分、その二十分で誰かを轢いたら、もう親友でいられなくなる。そんなの嫌だから、ここに立ってる。殴ってもいい。でも鍵は渡して。代行、もう呼んだ。……ほら、座ろう。缶コーヒー、おごるから。"
    tags: [緊張]
    tone: シリアス
    situation: "深夜の駐車場で、酔ったまま車に乗ろうとする親友の前に立ちふさがって"
    seconds: 30
    gender: any
    category: 友情
  - id: d184
    kind: dialogue
    text: "帆を畳め、全部だ！マストが折れる前に！……波が来るぞ、右舷！つかまれ！よし、全員いるな！ランプは消すな、灯りが消えたら終わりだ！面舵いっぱい！波に腹を見せるな、頭から突っ込め！……見えたか、あの灯台！あと二百！この船は、一人も海に渡さない！漕げ、叫べ、生きて港で笑うんだ！行くぞ、最後の一波！"
    tags: [動, 緊張]
    tone: ダイナミック
    situation: "嵐の夜の帆船の甲板で、舵輪を握る船長が乗組員たちに叫ぶ"
    seconds: 30
    gender: any
    category: バトル
