# セリフくじの台本: ナレーション（不問）
# このフォルダ内の *.yaml はすべて読み込まれ、1つの台本として扱われる。id はフォルダ全体で重複不可
#
# kind: narration / dialogue
# seconds: 10 / 20 / 30
# gender: male / female / any（不問）
# category: ナレーションはジャンル名、セリフは場面の種類。新しい語を書くと画面の選択肢に増える
# tone: 読み方。ストレート / シリアス / ダイナミック / ソフト / クール / ゴージャス /
#       エモーショナル / コミカル / ミステリアス / フレンドリー / ハイテンション / ウィスパー
# situation: どこで、誰が、何のために読むか
# tags: 雰囲気タグ。静 / 動 / 笑 / 涙 / 緊張 / 温 から1〜2個
#
# 構成ルール（tests/test_lines_file.py で検証）
#   ジャンル・タグ・読み方のどれか1つで絞っても、男性/女性/不問それぞれ5本以上残ること
#   男性/女性/不問はそれぞれ30本以上
lines:
  - id: n004
    kind: narration
    text: "厚さ、七ミリ。重さ、九百グラム。ノートPC「アルテ・ワン」。持ち運ぶたび、仕事の速度が、変わる。"
    tags: [緊張]
    tone: クール
    situation: "黒背景で薄型ノートPCが回転する製品発表動画のスペック紹介"
    seconds: 10
    gender: any
    category: 商品・サービス紹介
  - id: n006
    kind: narration
    text: "夜景を見下ろす、最上階。グラスに注がれる、琥珀の時間。ウイスキー「黄金の蔵」、十八年。熟成という名の贅沢を、今宵、あなたに。選ばれた人だけが知る、深く、長い余韻。黄金の蔵、十八年。"
    tags: [動]
    tone: ゴージャス
    situation: "高層バーのカウンターでグラスを傾ける洋酒CMの全編"
    seconds: 20
    gender: any
    category: テレビCM
  - id: n010
    kind: narration
    text: "標高三千メートル。氷に閉ざされた湖の底に、それはあった。千年前の、木の舟。誰が、何のために、ここまで運んだのか。記録はない。ただ、舟底に刻まれた、奇妙な印だけが、私たちに問いかけている。"
    tags: [静]
    tone: ミステリアス
    situation: "氷結した高地の湖と水中映像を映す考古学番組の冒頭"
    seconds: 20
    gender: any
    category: ドキュメンタリー
  - id: n012
    kind: narration
    text: "来月から、家庭ごみの分別ルールが変わります。大きなポイントは、三つ。まず、プラスチック製の容器は、汚れを落としてから、新しい青い袋へ。次に、小型の家電は、月に一度の回収日に、専用ボックスへ。そして、紙類は、ひもで十字に縛ってください。詳しいスケジュールは、お住まいの地域の広報紙、または、市のホームページでご確認ください。"
    tags: [静]
    tone: ストレート
    situation: "昼の生活情報コーナーでごみ分別の図解パネルを示しながら"
    seconds: 30
    gender: any
    category: 情報番組
  - id: n016
    kind: narration
    text: "夜明け前の、港。……静かです。湯気の向こうで、今日最初の、あら汁が、そっと、できあがります。"
    tags: [静]
    tone: ウィスパー
    situation: "暗い港の食堂で鍋から湯気が立つ早朝グルメ紀行の冒頭"
    seconds: 10
    gender: any
    category: 旅・グルメ番組
  - id: n018
    kind: narration
    text: "残り、十秒！二点ビハインドの東雲ウィングス、ボールは、キャプテンの如月！ドリブルで切り込む、一人かわした、二人目もかわした！さあ、スリーポイントライン、打つのか、打つのか、打ったー！！入れば逆転、ボールは高く、高く……入ったあああ！ブザービーター！東雲、劇的勝利！会場、総立ちです！"
    tags: [動, 緊張]
    tone: ハイテンション
    situation: "バスケ決勝の残り十秒からブザービーターまでの実況風ナレーション"
    seconds: 30
    gender: any
    category: スポーツ
  - id: n022
    kind: narration
    text: "さあ、今日の学習を始めましょう。前回のおさらいはたった三分。肩の力を抜いて、ついてきてくださいね。"
    tags: [温, 笑]
    tone: フレンドリー
    situation: "語学学習アプリで毎回のレッスン開始時に流れる音声"
    seconds: 10
    gender: any
    category: 教育・eラーニング
  - id: n024
    kind: narration
    text: "抗生物質は、細菌による感染症の治療に用いられる薬です。しかし、ウイルスが原因となる風邪やインフルエンザには、効果がありません。必要のない場面で使い続けると、薬が効かない耐性菌が生まれ、本当に必要なときに治療の選択肢を失うおそれがあります。処方された薬は、自己判断で中断せず、医師の指示どおりに最後まで服用してください。"
    tags: [緊張]
    tone: シリアス
    situation: "薬局で配布する啓発動画、抗生物質の正しい使い方の章"
    seconds: 30
    gender: any
    category: 医療・科学技術
  - id: n028
    kind: narration
    text: "皆様をお迎えするのは、創業百二十年の歴史を誇る、迎賓館ホテル月桂。正面の大階段を上がれば、天井一面に広がるシャンデリアの光が、皆様の足元を照らします。大理石のロビー、職人の手による飾り格子、そして窓の向こうに広がる湾の眺め。かつて国賓をもてなしたこの館で、今宵、特別なひとときをお過ごしください。"
    tags: [動]
    tone: ゴージャス
    situation: "老舗ホテルの館内紹介映像、ロビーに到着した場面"
    seconds: 30
    gender: any
    category: 観光・施設ガイド
  - id: n029
    kind: narration
    text: "まもなく、三番線に、各駅停車、北浜行きが参ります。黄色い線の内側まで、お下がりください。"
    tags: [静, 動]
    tone: ストレート
    situation: "私鉄の駅ホームで列車接近時に流れる自動放送"
    seconds: 10
    gender: any
    category: アナウンス
  - id: n033
    kind: narration
    text: "こんにちは、「ゆるっと台所」へようこそ。このチャンネルでは、冷蔵庫の残り物で作れる、十分以内のごはんを紹介しています。難しい道具は使いません。今日は、余った豆腐が主役ですよ。それでは、始めていきましょう。"
    tags: [温, 笑]
    tone: フレンドリー
    situation: "料理系YouTubeチャンネルの動画冒頭に流れるお決まりの挨拶"
    seconds: 20
    gender: any
    category: Web・YouTube動画
  - id: n036
    kind: narration
    text: "ここから先は、補給のない区域だ。回復薬は三つまで。仲間の体力が尽きれば、作戦は失敗となる。地図の赤い印が敵の見張り塔。見つかる前に、灯りを落とせ。準備ができたら、合図を送れ。前進を開始する。"
    tags: [緊張]
    tone: シリアス
    situation: "ステルスアクションゲームの作戦開始前ブリーフィング"
    seconds: 20
    gender: any
    category: ゲーム内ナレーション
  - id: n045
    kind: narration
    text: "ホコリさん、ごきげんよう。お会いするのは今日が最後です。創業四十年、わたしたちはひたすら、あなたを追いかけてきました。隅っこ、すきま、冷蔵庫の裏。逃げても無駄ですよ。ピカット清掃用品、本日も絶好調で営業中です。"
    tags: [笑, 動]
    tone: コミカル
    situation: "清掃用品メーカーの企業VPで、ホコリを擬人化したアニメ映像に乗せる冒頭"
    seconds: 20
    gender: any
    category: 企業VP
  - id: n046
    kind: narration
    text: "しずかに、目を閉じてください。聞こえますか。羽毛が空気を含む、かすかな音。わたしたちは、この音を六十年、聴き続けてきました。眠りは、誰にも見られない時間。だからこそ、一番やさしいものを、そっと差し出したい。糸の一本、縫い目のひとつにまで、おやすみの気持ちを込めて。ユメノ寝具は、今夜もあなたの隣で、静かに息をしています。"
    tags: [静, 温]
    tone: ウィスパー
    situation: "寝具メーカーの企業VPで、夜の工房と寝室を静かに映す本編"
    seconds: 30
    gender: any
    category: 企業VP
  - id: n047
    kind: narration
    text: "海を越え、谷をつなぐ。鉄と汗で、百年先まで残る仕事を、今日ここから。オオゾラ建設。"
    tags: [動]
    tone: ダイナミック
    situation: "建設会社の企業VPで、巨大な橋の架設工事の映像に乗せる冒頭"
    seconds: 10
    gender: any
    category: 企業VP
  - id: n048
    kind: narration
    text: "小さな手が、はじめて土に触れた日。泣きながら、お友だちに「ごめんね」と言えた日。わたしたちは、そのひとつひとつに立ち会ってきました。コトリ保育グループは、子どもたちの「はじめて」を、これからも大切に見守ります。"
    tags: [温, 静]
    tone: ソフト
    situation: "保育事業会社の企業VPで、園庭で遊ぶ子どもたちの映像に乗せる本編"
    seconds: 20
    gender: any
    category: 企業VP
  - id: n049
    kind: narration
    text: "午前三時。誰もが眠る時間に、わたしたちのモニターは、海上の低気圧をとらえていた。上陸まで、あと十八時間。船を、空港を、街を、どう守るか。答えを出すのに許された時間は、長くはない。アマツ気象情報は、二十四時間、空を読み続ける。予報は、約束ではない。だが、備えるための、最初の一手にはなる。"
    tags: [緊張, 静]
    tone: クール
    situation: "気象情報会社の企業VPで、深夜の監視センターの映像に乗せる本編"
    seconds: 30
    gender: any
    category: 企業VP
  - id: n059
    kind: narration
    text: "お待たせしました！この夏、「ワンダーパーク・ソラノシマ」に、パーク史上最速のコースターが誕生！その名も「スカイブレイカー」！スタートからわずか二秒で時速百二十キロ、高さ六十メートルの頂点から、一気に海へダイブ！乗り終わったあと、きっと誰かにこう言いたくなります。「もう一回、行こう！」チケットは、公式サイトで好評発売中！"
    tags: [動, 笑]
    tone: ハイテンション
    situation: "テーマパークの新アトラクション紹介動画で、コースターの疾走映像に乗せる全編"
    seconds: 30
    gender: any
    category: 商品・サービス紹介
  - id: n060
    kind: narration
    text: "硬いコンクリートも、一発貫通。「ガンコ・インパクト」、プロの現場が選ぶ、最強の一本。"
    tags: [動]
    tone: ダイナミック
    situation: "電動工具の商品紹介動画で、コンクリートに穴をあける実演映像に乗せる冒頭"
    seconds: 10
    gender: any
    category: 商品・サービス紹介
  - id: n061
    kind: narration
    text: "十年後のあなたへ、手紙を書いてみませんか。「とどけ便」は、お預かりした手紙を、指定した年の誕生日に、そっとお届けするサービスです。今日の気持ちは、今日しか書けません。便箋と封筒は、こちらでご用意しています。"
    tags: [温, 静]
    tone: ソフト
    situation: "未来に手紙を届けるサービスの紹介動画で、机で手紙を書く映像に乗せる本編"
    seconds: 20
    gender: any
    category: 商品・サービス紹介
  - id: n062
    kind: narration
    text: "「おじいちゃん」。孫が呼ぶ声に、父は、ただ笑って頷くだけだった。聞こえていなかったのだと、あとで知った。「ミミトモ」は、会話の声だけを際立たせる、小さな補聴器です。耳の奥にすっぽり収まり、つけていることを、誰にも気づかれません。はじめてつけた日、父は孫の名前を呼び返して、少しだけ、泣いた。聞こえる毎日を、もう一度。"
    tags: [涙, 温]
    tone: エモーショナル
    situation: "補聴器の商品紹介動画で、祖父と孫が庭で過ごす映像に乗せる全編"
    seconds: 30
    gender: any
    category: 商品・サービス紹介
  - id: n072
    kind: narration
    text: "新しい町に、知っている顔はまだいない。でも、荷物をほどいた最初の夜、窓からの灯りが、ちょっとだけ優しく見えたら。それが、新しい暮らしの始まりです。段ボール一箱から、家まるごとまで。荷物と一緒に、小さな安心も、お届けします。引っ越しのハコブネ。新生活、おめでとうございます。"
    tags: [温]
    tone: フレンドリー
    situation: "新居で荷ほどきする家族の映像に乗せる引っ越し会社CMの全編"
    seconds: 30
    gender: any
    category: テレビCM
  - id: n073
    kind: narration
    text: "こびりついた十年を、一撃で。水圧、従来比二倍。高圧洗浄機、ゲキリュウ、新登場。"
    tags: [動]
    tone: ダイナミック
    situation: "外壁の汚れが吹き飛ぶ映像に乗せる高圧洗浄機CMで、力強く訴える"
    seconds: 10
    gender: any
    category: テレビCM
  - id: n074
    kind: narration
    text: "月に一度、ポストに届く、小さな本。今夜は、どんなお話にしようか。ページをめくる指と、まぶたが重くなる速さは、いつも、いい勝負。おやすみの前の十分間を、お届けします。絵本の定期便、ツキノヒカリ。"
    tags: [温, 静]
    tone: ソフト
    situation: "寝かしつけの読み聞かせ映像に乗せる絵本定期便CMで、親に語りかける"
    seconds: 20
    gender: any
    category: テレビCM
  - id: n075
    kind: narration
    text: "攻撃は、予告なく始まる。一秒間に、数万回。あなたが眠っている間も、世界のどこかで、鍵は試され続けている。守るとは、気づかれないこと。侵入のない夜を、当たり前にすること。二十四時間、三百六十五日、沈黙の監視を。法人向けセキュリティ、ガーディアン・ゼロ。何も起きない。それが、私たちの成果です。"
    tags: [緊張, 静]
    tone: クール
    situation: "暗いサーバー室の映像に乗せる企業向けセキュリティCMの全編"
    seconds: 30
    gender: any
    category: テレビCM
  - id: n084
    kind: narration
    text: "夜中の台所。電気をつけた、その瞬間。黒い影が、ササッ。見なかったことに、しますか。虫さんとの同居生活、今日で解消。駆除から予防まで、まるっとお任せ。ムシトリ本舗、見積もり無料。あの、電話の前に、まず叫んでいいです。"
    tags: [笑, 動]
    tone: コミカル
    situation: "夏の深夜ラジオで流れる害虫駆除業者のCMで、聴き手をおどけて笑わせる"
    seconds: 20
    gender: any
    category: ラジオCM
  - id: n085
    kind: narration
    text: "ある雨の夜、町から一人の時計職人が消えた。残されたのは、三時十七分で止まった、二百の時計。なぜ、すべて同じ時刻なのか。なぜ、彼の店だけ、雨に濡れていなかったのか。あなたは、最後の一ページで、きっと最初の一行に戻りたくなる。書き下ろし長編ミステリー、『止まった街の時計師』。各書店にて、静かに発売中。"
    tags: [静, 緊張]
    tone: ミステリアス
    situation: "深夜ラジオで流れる新刊ミステリー小説の告知CMで、謎めいて語る"
    seconds: 30
    gender: any
    category: ラジオCM
  - id: n086
    kind: narration
    text: "聖夜、最上階にて。シェフ渾身の全七品と、夜景を一皿に。ホテル・グランセーヌ、ご予約受付中。"
    tags: [動]
    tone: ゴージャス
    situation: "十二月のラジオで流れるホテルのクリスマスディナー告知CMで、優雅に誘う"
    seconds: 10
    gender: any
    category: ラジオCM
  - id: n087
    kind: narration
    text: "照れくさくて、言えなかった言葉がある。ありがとうも、ごめんねも、元気でいてねも。言葉にできないなら、花に、託してください。カーネーションが、代わりに伝えてくれます。フラワーショップ・ハナコトバ、母の日の予約、受付中。"
    tags: [涙, 温]
    tone: エモーショナル
    situation: "五月のラジオで流れる花屋の母の日予約CMで、聴き手の胸に訴えかける"
    seconds: 20
    gender: any
    category: ラジオCM
  - id: n088
    kind: narration
    text: "輸血を必要とする人は、一日におよそ三千人。その血液は、人工的に作ることができず、長く保存することもできません。だから、今日も、誰かの献血が必要です。所要時間は、受付から休憩まで、およそ四十分。予約があれば、待ち時間はほとんどありません。駅前献血ルーム、年中無休で開いています。あなたの四十分を、誰かの明日に。"
    tags: [静]
    tone: ストレート
    situation: "平日昼のラジオで流れる献血協力を呼びかける公共CMで、淡々と事実を伝える"
    seconds: 30
    gender: any
    category: ラジオCM
  - id: n098
    kind: narration
    text: "午後七時、河川敷を埋めた観客は十万人。花火師たちの一年が、今夜の九十分に懸かる！合図とともに、最初の一発が夜空へ！筒から筒へ、火が走る、走る！汗を拭う暇もない！そしてフィナーレ、直径三百メートルに開く一尺玉、百連発！夜空が、昼になる！親方の声が飛ぶ。「行くぞ、全部上げろ！」"
    tags: [動, 緊張]
    tone: ハイテンション
    situation: "花火大会の密着番組で、打ち上げからフィナーレまで花火師の奮闘を伝える"
    seconds: 30
    gender: any
    category: ドキュメンタリー
  - id: n099
    kind: narration
    text: "午前三時十二分、火山観測所の地震計の針が小刻みに震え始めた。山は、まだ眠っていなかった。"
    tags: [緊張]
    tone: シリアス
    situation: "火山の噴火を追う番組で、観測所の記録映像とともに前兆を語る場面"
    seconds: 10
    gender: any
    category: ドキュメンタリー
  - id: n100
    kind: narration
    text: "終電が去った午前一時。線路に降りるのは、保線作業員十二名。与えられた時間は、始発までの二百十分。レールの歪みはわずか三ミリ。だが放置すれば、脱線につながる。沈黙の中、作業が始まった。"
    tags: [緊張, 静]
    tone: クール
    situation: "鉄道の深夜保線に密着する番組で、作業員が線路へ降りる場面"
    seconds: 20
    gender: any
    category: ドキュメンタリー
  - id: n101
    kind: narration
    text: "全長三百四十メートル、客室二千室。七年の歳月をかけて造られた豪華客船「オーロラ・セレナ」が、今、初めて港を離れます。十八階建ての船体に灯る一万の光。甲板ではオーケストラが奏で、シャンパンの泡が夜風に舞う。船上は、海に浮かぶひとつの街。世界一周百二十日の航海が、華やかに幕を開けました。"
    tags: [動]
    tone: ゴージャス
    situation: "豪華客船の処女航海を追う番組で、出港の夜景を映しながら読む場面"
    seconds: 30
    gender: any
    category: ドキュメンタリー
  - id: n111
    kind: narration
    text: "今日は冬至。一年でいちばん夜が長い日です。昔から、この日にはかぼちゃを食べ、ゆず湯に浸かる習わしがあります。かぼちゃには冬を乗り切るための栄養が、ゆずの香りには体をあたためる力があるのだとか。湯船にゆずを浮かべて、ゆっくり肩まで浸かってみてください。明日から、少しずつ日が長くなっていきます。寒さの底で、春はもう動き始めているのです。"
    tags: [温, 静]
    tone: ソフト
    situation: "昼の情報番組の暮らしコーナーで、ゆず湯の映像とともに語りかける場面"
    seconds: 30
    gender: any
    category: 情報番組
  - id: n112
    kind: narration
    text: "創業七十年の銭湯、今夜が最後の営業です。常連さんたちは、いつもより長く湯に浸かっていました。"
    tags: [涙]
    tone: エモーショナル
    situation: "夕方の情報番組の街角特集で、閉店する銭湯の最終営業日の映像に添える"
    seconds: 10
    gender: any
    category: 情報番組
  - id: n113
    kind: narration
    text: "本日のお題は、街で見つけた「なぜそれを売った」自販機。今回、取材班が発見したのは、なんと「謝罪文」の自販機。三百円で、いい感じの謝り方を印刷してくれます。使う日が来ないことを祈ります。"
    tags: [笑]
    tone: コミカル
    situation: "昼の情報番組の街ネタコーナーで、変わり種自販機の写真を示しながら読む"
    seconds: 20
    gender: any
    category: 情報番組
  - id: n114
    kind: narration
    text: "次の特集は、月に数日しか現れない道の話です。瀬戸内の小さな島と島のあいだ。大潮の干潮時、海がゆっくりと割れ、幅三メートルほどの砂の道が姿を見せます。地元の人はこの道を「月の廊下」と呼び、渡れるのは往復でわずか四十分。取材班が渡った日、砂の上には誰のものともわからない足跡が、先に続いていました。"
    tags: [静]
    tone: ミステリアス
    situation: "深夜の情報番組の旅特集で、干潮時にだけ現れる海の道の映像に重ねて読む"
    seconds: 30
    gender: any
    category: 情報番組
  - id: n123
    kind: narration
    text: "ただいま、ターゲットが楽屋に入りました。机の上に置かれたのは、本物そっくりの偽の台本。中身は全ページ、彼の悪口です。スタッフ全員、息を潜めて見守ります。さあ、台本に手が伸びました。開くか、開かないか。"
    tags: [静, 緊張]
    tone: ウィスパー
    situation: "ドッキリ企画で、隠しカメラの映像を見ながら小声で状況を実況する場面"
    seconds: 20
    gender: any
    category: バラエティ
  - id: n124
    kind: narration
    text: "二十年前、不登校だった少年に、毎朝家まで迎えに来てくれた先生がいました。雨の日も、雪の日も、玄関の前で「おはよう」と言い続けた三年間。少年は今、三十五歳。自分も教師になり、同じように毎朝、生徒の家の前に立っています。今日、彼は初めて恩師の家を訪ねます。扉の向こうから、あの日と同じ声が聞こえました。"
    tags: [涙, 温]
    tone: エモーショナル
    situation: "感動再会バラエティで、恩師の家の前に立つ男性の映像に重ねて読む場面"
    seconds: 30
    gender: any
    category: バラエティ
  - id: n125
    kind: narration
    text: "それでは発表します。県民千人が選ぶ、好きなご当地パンランキング。栄えある第一位は、こちらです。"
    tags: [静]
    tone: ストレート
    situation: "バラエティのランキング企画で、第一位の発表直前にパネルを示しながら読む"
    seconds: 10
    gender: any
    category: バラエティ
  - id: n126
    kind: narration
    text: "高さ六十メートル。足元には、濁流と化した渓谷。挑戦者は、高所恐怖症を公言する芸人、三年目のタキモト。ここまで来るのに、すでに四十分。足が震え、声が出ない。カウントダウンは、もう待ってくれない。三、二、一。"
    tags: [緊張]
    tone: シリアス
    situation: "バンジージャンプ挑戦企画で、飛び込み台に立つ芸人を映しながら読む場面"
    seconds: 20
    gender: any
    category: バラエティ
  - id: n127
    kind: narration
    text: "吹雪の中、集まったのは六人の芸人。装備はテントひとつと、カップ麺が三つだけ。ルールは単純、夜明けまで誰が最後まで笑顔でいられるか。気温はマイナス十二度、頼れるのは根性とギャグだけだ。笑いの神は、この山頂に降りてくるのか。芸人極寒サバイバル、いよいよ開幕！"
    tags: [動, 笑]
    tone: ダイナミック
    situation: "深夜バラエティで芸人六人が極寒の雪山で一夜を過ごす企画のオープニング煽り"
    seconds: 30
    gender: any
    category: バラエティ
  - id: n137
    kind: narration
    text: "創業五十三年。町の洋食屋が、今日、最後の暖簾を下ろす。注文の八割はオムライス。子どものころ食べた味を、今は親になって子どもに食べさせに来る。店主は何も言わず、いつもどおり卵を割る。最後のひと皿を運び終えたとき、店内から拍手が起きた。ごちそうさまでした。その言葉だけが、この店のすべてだった。"
    tags: [涙, 温]
    tone: エモーショナル
    situation: "閉店する町の洋食屋の最終日を追うグルメ番組のエンディング"
    seconds: 30
    gender: any
    category: 旅・グルメ番組
  - id: n138
    kind: narration
    text: "ご当地名物、長さ三メートルのちくわ。どこから食べる？　答えは、両端から二人で、です。"
    tags: [笑]
    tone: コミカル
    situation: "ご当地の巨大ちくわを紹介する旅番組の短いコーナー導入"
    seconds: 10
    gender: any
    category: 旅・グルメ番組
  - id: n139
    kind: narration
    text: "霧に沈む湖のほとりに、一年に一夜だけ現れる屋台がある。地元の人も、店主の名を知らない。差し出されるのは、湯気の立つ一杯の汁物だけ。味を言葉にできた者は、まだいないという。今夜、霧が晴れる前に。"
    tags: [静]
    tone: ミステリアス
    situation: "霧の湖に一夜だけ現れる屋台を追う深夜グルメ紀行の冒頭"
    seconds: 20
    gender: any
    category: 旅・グルメ番組
  - id: n140
    kind: narration
    text: "商店街の角にある、小さな豆腐屋さん。朝六時、ご主人が今日のできたてを並べると、ご近所さんが次々やってきます。今日は厚揚げがいいよ、なんて声をかけてもらって。おまけに一枚、油揚げをいただきました。おいしいものって、人の優しさとセットなんですね。この町、また来たくなります。みなさんもぜひ、朝のうちに。"
    tags: [温]
    tone: フレンドリー
    situation: "商店街の豆腐屋で朝の常連客と触れ合う旅番組の締めの語り"
    seconds: 30
    gender: any
    category: 旅・グルメ番組
  - id: n150
    kind: narration
    text: "さあ、始まりました、町内対抗大運動会、最終種目の綱引き！　一丁目チーム、平均年齢六十八歳、作戦はひたすら座り込むこと！　対する三丁目チームは、子ども会総出の人海戦術！　合図とともに綱がぴんと張って……あ、一丁目、全員いっせいに後ろへ倒れました！　これは作戦なのか、転んだのか！　審判、判断に困っています！"
    tags: [笑, 動]
    tone: コミカル
    situation: "町内対抗運動会の綱引きを実況風に伝えるローカル番組のナレーション"
    seconds: 30
    gender: any
    category: スポーツ
  - id: n151
    kind: narration
    text: "卓球決勝、最終ゲーム十対十！　ラリーが続く、続く、まだ続く！　決まったー！　スマッシュ一閃！"
    tags: [動]
    tone: ハイテンション
    situation: "卓球決勝の最終ゲームを伝えるスポーツニュースのハイライト"
    seconds: 10
    gender: any
    category: スポーツ
  - id: n152
    kind: narration
    text: "アーチェリー、決勝最終射。七十メートル先の的に、すべてが懸かっている。風は、止んだ。弓を引く音さえ、聞こえそうなほどの静けさ。指が弦を離れるまで、観客は誰も、息をしていない。放たれた矢は、まっすぐに。"
    tags: [静, 緊張]
    tone: ウィスパー
    situation: "アーチェリー決勝の最終射の直前を伝える中継の囁きナレーション"
    seconds: 20
    gender: any
    category: スポーツ
  - id: n153
    kind: narration
    text: "全国高校駅伝、女子の部。五区間、二十一キロ。先頭を走るのは、部員七人の小さな公立校。選手のうち三人は、高校から陸上を始めた。監督は数学の教師で、練習メニューは毎晩自宅で組む。今朝の気温は五度。一区のスタートまで、あと十分。彼女たちが目指すのは、優勝ではなく、全員で襷をつなぎきること。"
    tags: [静]
    tone: ストレート
    situation: "全国高校駅伝で小さな公立校を追うドキュメンタリーの冒頭"
    seconds: 30
    gender: any
    category: スポーツ
  - id: n162
    kind: narration
    text: "作戦開始まで、あと七分。目標は地下四十階の金庫、鍵を持つのは五人、信じられるのはゼロ。完璧な計画ほど、静かに崩れていく。クライムサスペンス『ゼロ・ロック』、この冬、公開。"
    tags: [緊張]
    tone: クール
    situation: "クライムサスペンス映画の予告編、電車内のデジタル広告で流れる"
    seconds: 20
    gender: any
    category: 映画・作品予告
  - id: n163
    kind: narration
    text: "県のマスコット『ずんだぬき』の中の人、派遣社員の西岡は、ある朝、着ぐるみが脱げなくなった！会議も、合コンも、実家の法事も、ずんだぬきのまま。ご当地キャラ失格の危機に、県知事選まで巻き込んで、町はてんやわんや。脱げないけど、逃げられない！抱腹絶倒コメディ『中の人はいます』、ゴールデンウィーク、全国ロードショー！"
    tags: [笑]
    tone: コミカル
    situation: "コメディ映画の予告編、バラエティ番組のCM枠で流れる"
    seconds: 30
    gender: any
    category: 映画・作品予告
  - id: n164
    kind: narration
    text: "ダムの決壊まで、残された時間は三時間。逃げるか、止めるか。パニック映画『濁流』、八月、公開。"
    tags: [緊張]
    tone: シリアス
    situation: "パニック映画の特報、劇場ロビーのモニターで繰り返し流れる"
    seconds: 10
    gender: any
    category: 映画・作品予告
  - id: n165
    kind: narration
    text: "ラスト一周、差はわずか〇・二秒。無名の町工場が組み上げた一台が、世界の頂点に挑む！エンジンの咆哮、散る火花、託された夢。レース映画『フルスロットル』、全国の劇場で、発進！"
    tags: [動]
    tone: ダイナミック
    situation: "レース映画の予告編、スポーツ中継の合間のCMで流れる"
    seconds: 20
    gender: any
    category: 映画・作品予告
  - id: n166
    kind: narration
    text: "一日に三本しか来ないバスが、山あいの村を走っている。運転手の春山さんが乗せるのは、学校帰りの子どもたち、病院へ通うおじいさん、そして都会から帰ってきた、ひとりの娘。窓の外を流れる季節と、少しずつほどけていく心。何気ない毎日が、こんなにも愛おしい。映画『終点まで、あと少し』、初夏、公開。"
    tags: [温]
    tone: ソフト
    situation: "ヒューマンドラマ映画の予告編、朝の情報番組のCM枠で流れる"
    seconds: 30
    gender: any
    category: 映画・作品予告
  - id: n176
    kind: narration
    text: "夜空を見上げたとき、あなたが見ている光は、何百年も前に星を旅立ったものです。中には、もう存在しない星の光も混ざっているかもしれません。宇宙は、過去の姿しか見せてくれない。では、現在の宇宙を知る方法はあるのでしょうか。この講座では、光と時間の関係から、その謎に迫っていきます。第一回、星の光は何歳か。"
    tags: [静]
    tone: ミステリアス
    situation: "一般向け天文学オンライン講座、第一回のオープニングナレーション"
    seconds: 30
    gender: any
    category: 教育・eラーニング
  - id: n177
    kind: narration
    text: "ようこそ、鏡の前の特等席へ。アイラインの一ミリで、まなざしは変わる。プロ直伝メイク講座、華やかに開幕です。"
    tags: [動]
    tone: ゴージャス
    situation: "美容専門学校のオンラインメイク講座、第一回の冒頭で受講者を迎える"
    seconds: 10
    gender: any
    category: 教育・eラーニング
  - id: n178
    kind: narration
    text: "さあ、今週の簿記チャレンジ！問題はぜんぶで十問、制限時間は三分、合格ラインは八問正解！借方と貸方、迷ったら深呼吸！それじゃあ、電卓の準備はいいですか？よーい、スタート！"
    tags: [動]
    tone: ハイテンション
    situation: "簿記資格のオンライン講座、毎週の確認テストの開始アナウンス"
    seconds: 20
    gender: any
    category: 教育・eラーニング
  - id: n179
    kind: narration
    text: "ここからは、音を立てずに進めていきましょう。茶室に入るとき、まず膝をついて、にじり口の向こうの静けさに耳を澄ませます。釜の湯が沸く音、柄杓の水音、庭を渡る風。すべてが、お点前の一部です。この章では、客としての所作を、一つずつ、ゆっくりと身につけていきます。どうぞ、深く息を整えてから、次の映像へお進みください。"
    tags: [静]
    tone: ウィスパー
    situation: "茶道入門のオンライン講座、客の作法の章の導入ナレーション"
    seconds: 30
    gender: any
    category: 教育・eラーニング
  - id: n189
    kind: narration
    text: "私たちの体の中には、今この瞬間も、三十七兆の細胞がささやき合っている。誰が指揮をとるでもなく、誰が合図を出すでもなく。けれど、ひとつの細胞が沈黙したとき、その声なき声を聞き取る者がいる。科学者たちが「体内の暗号」と呼ぶ、その正体とは。答えは、顕微鏡の向こう側に隠されている。"
    tags: [静]
    tone: ミステリアス
    situation: "深夜の科学ドキュメンタリー番組、細胞をテーマにした回の冒頭"
    seconds: 30
    gender: any
    category: 医療・科学技術
  - id: n190
    kind: narration
    text: "こちらは移動健診車です。胸部エックス線撮影を行いますので、金属類を外してお待ちください。"
    tags: [静]
    tone: ストレート
    situation: "企業の駐車場に来た健診車の車内放送、受診者への案内"
    seconds: 10
    gender: any
    category: 医療・科学技術
  - id: n191
    kind: narration
    text: "心停止から三分。脳へのダメージは、刻一刻と進んでいきます。救急車の平均到着時間は、およそ十分。その空白を埋められるのは、現場に居合わせたあなたの手だけです。胸骨圧迫、一分間に百から百二十回。ためらわないでください。"
    tags: [緊張]
    tone: シリアス
    situation: "消防署が公開する救命講習の導入映像、受講者への呼びかけ"
    seconds: 20
    gender: any
    category: 医療・科学技術
  - id: n192
    kind: narration
    text: "高度四百キロ。地球を九十分で一周する実験棟で、いま、新素材の結晶が育っている。重力から解き放たれた分子たちは、地上では決して見せない整列を描く。この一粒が、次世代の半導体を変える。この一粒が、電気の流れを塗り替える。宇宙でしか作れない未来が、今日、軌道上で生まれた。"
    tags: [動]
    tone: ダイナミック
    situation: "宇宙開発機関の広報映像、軌道上の材料実験を紹介する場面"
    seconds: 30
    gender: any
    category: 医療・科学技術
  - id: n201
    kind: narration
    text: "ようこそ、「おはなしポケット」へ。今日あなたに読むのは、北の港町で郵便配達をするペンギンのお話です。難しい言葉は出てきません。わからないところがあったら、おうちの人に聞いてみてね。では、ページをめくりますよ。"
    tags: [温]
    tone: フレンドリー
    situation: "子ども向け読み聞かせアプリの童話、物語に入る前の語り手の挨拶"
    seconds: 20
    gender: any
    category: オーディオブック
  - id: n202
    kind: narration
    text: "来た来た来たーっ！　修学旅行、二日目の朝！　五時半に目が覚めたのは、昨日の夜、枕投げで興奮しすぎたせいに違いない。隣のベッドではタケルが大の字で寝ている。窓を開ける。海だ！　本物の海だ！　今日の自由行動、全部まわる。水族館も、灯台も、ソフトクリーム屋も。よし、起こそう。全員、叩き起こそう！"
    tags: [動, 笑]
    tone: ハイテンション
    situation: "児童文学のオーディオブック、主人公が修学旅行の朝に跳ね起きる場面"
    seconds: 30
    gender: any
    category: オーディオブック
  - id: n203
    kind: narration
    text: "雨の音が、だんだん小さくなっていく。猫は窓辺で丸くなり、少年は本を閉じて、そっと目を閉じた。"
    tags: [温, 静]
    tone: ソフト
    situation: "絵本のオーディオブック、物語の最後のページをやさしく読み終える"
    seconds: 10
    gender: any
    category: オーディオブック
  - id: n204
    kind: narration
    text: "契約書の最後の一行を、彼は三度読み返した。違約金、二億。署名すれば、会社は生き残る。しなければ、三百人が路頭に迷う。ペンを取る。インクが紙に触れる、その直前。電話が鳴った。番号は、非通知だった。"
    tags: [緊張, 静]
    tone: クール
    situation: "経済小説のオーディオブック、社長が契約の決断を迫られる場面"
    seconds: 20
    gender: any
    category: オーディオブック
  - id: n205
    kind: narration
    text: "幕が上がる。金糸の緞帳が巻き上がるその向こうに、百人のオーケストラが息を潜めていた。指揮者が腕を振り下ろす。第一音は、まるで黄金の雨。客席の端から端まで、音の粒が降りそそぐ。三階席の少女は、手すりを握りしめたまま、瞬きを忘れた。これが、歌劇場というものか。これが、人が生涯をかけて求める、音の宮殿か。"
    tags: [動]
    tone: ゴージャス
    situation: "音楽家の成長を描く小説のオーディオブック、初めて歌劇場を訪れる場面"
    seconds: 30
    gender: any
    category: オーディオブック
  - id: n215
    kind: narration
    text: "ここから先は、声を落としてお進みください。この洞窟には、三千匹のコウモリが眠っています。天井を見上げてみてください。小さな影が、びっしりと。彼らは音にとても敏感です。足音も、できるだけそっと。奥の泉まで、あと二十メートル。そこで、灯りを一度消します。暗闇の中で、水の音だけを聞いてください。"
    tags: [静]
    tone: ウィスパー
    situation: "コウモリの生息する洞窟のエコツアー、参加者に囁きかける音声ガイド"
    seconds: 30
    gender: any
    category: 観光・施設ガイド
  - id: n216
    kind: narration
    text: "この先は、噴気活動が続く区域です。硫化水素の濃度が上がった場合、警報が鳴ります。直ちに引き返してください。"
    tags: [緊張]
    tone: シリアス
    situation: "火山地帯の遊歩道入口に設置された、立入区域の警告アナウンス"
    seconds: 10
    gender: any
    category: 観光・施設ガイド
  - id: n217
    kind: narration
    text: "全長一キロ、高低差百二十メートル。谷底の川が、足元を一直線に流れていく。「天空峡ジップライン」は、ただ滑るだけのアトラクションではありません。風を切り、鳥と並び、あなた自身が峡谷の一部になる体験です。"
    tags: [動]
    tone: ダイナミック
    situation: "峡谷のアクティビティ施設の紹介映像、冒頭で来場者の期待を煽る場面"
    seconds: 20
    gender: any
    category: 観光・施設ガイド
  - id: n218
    kind: narration
    text: "坂道をのぼるたび、どこかから湯けむりの匂いが漂ってきます。ここ、湯坂温泉には、十二の足湯が点在しています。歩いて、浸かって、また歩く。急がなくていいんです。石畳の先に、小さなお饅頭屋さん。橋のたもとに、ゆっくり時を刻む古い時計台。まち全体が、あなたをもてなす一つの宿なのです。"
    tags: [温, 静]
    tone: ソフト
    situation: "温泉街の観光案内所で流れる紹介映像、散策の魅力を伝える場面"
    seconds: 30
    gender: any
    category: 観光・施設ガイド
  - id: n228
    kind: narration
    text: "本日をもちまして、銀映座は六十八年の歴史に幕を下ろします。初めてのデートで、親子で、ひとりで。この暗闇の中で、皆さまが過ごされた時間は、私たちの宝物でした。最後の上映が終わりました。どうか、お帰りの際は、振り返って、スクリーンにひと言だけ声をかけてやってください。長い間、本当に、ありがとうございました。"
    tags: [涙, 温]
    tone: エモーショナル
    situation: "閉館する老舗映画館の最終日、最終上映後に流れる館内放送"
    seconds: 30
    gender: any
    category: アナウンス
  - id: n229
    kind: narration
    text: "院内放送。三階東病棟にて緊急コールです。担当医師、看護師は、至急、三階東病棟へお集まりください。"
    tags: [緊張]
    tone: クール
    situation: "総合病院の院内放送、急変患者への緊急召集を告げる場面"
    seconds: 10
    gender: any
    category: アナウンス
  - id: n230
    kind: narration
    text: "ご来場の皆さま、大変お待たせいたしました。真紅のカーペットの先に、今季のすべてが集います。ルミエール・コレクション、春夏の幕開けです。ランウェイの照明が灯りましたら、どうぞ盛大な拍手でお迎えください。"
    tags: [動]
    tone: ゴージャス
    situation: "ファッションショーの会場、開演直前に流れる開幕アナウンス"
    seconds: 20
    gender: any
    category: アナウンス
  - id: n231
    kind: narration
    text: "道の駅かわせみの里へ、ようこそいらっしゃいました。本日の朝採れコーナーには、山田さんちのとうもろこしが並んでいます。朝五時に畑からそのまま持ってきてくれました。生でかじっても甘いですよ。奥の軽食コーナーでは、採れたてを使った焼きとうもろこしも販売中。ドライバーの皆さま、どうぞひと息ついて、ゆっくりしていってください。"
    tags: [温, 笑]
    tone: フレンドリー
    situation: "山あいの道の駅の店内放送、朝採れ野菜をお客に紹介する場面"
    seconds: 30
    gender: any
    category: アナウンス
  - id: n240
    kind: narration
    text: "まもなく、あの日、あの時刻を迎えます。ここにお集まりの皆さま、そして中継をご覧の皆さま。亡くなられた方々への哀悼の意を込め、一分間の黙祷を捧げます。ご起立ください。黙祷。"
    tags: [緊張, 静]
    tone: シリアス
    situation: "震災追悼式典、発災時刻に合わせて黙祷を呼びかける場面"
    seconds: 20
    gender: any
    category: イベント・式典
  - id: n241
    kind: narration
    text: "ランナーの皆さん、スタートラインへ！港町マラソン、今年のエントリーは一万二千人。この街の海岸線を、四十二・一九五キロ、皆さんの足音が埋め尽くします。沿道には、朝五時から太鼓を叩いて待っている人たちがいます。その音を、背中で受け止めてください。スタートまで、あと三十秒。深呼吸を、ひとつ。さあ、行きましょう！"
    tags: [動]
    tone: ダイナミック
    situation: "市民マラソン大会のスタート地点、号砲直前にランナーを鼓舞する場面"
    seconds: 30
    gender: any
    category: イベント・式典
  - id: n242
    kind: narration
    text: "続いて、最優秀賞の発表です。受賞者はお名前を呼ばれましたら、壇上へお上がりください。"
    tags: [静]
    tone: ストレート
    situation: "コンテストの表彰式、最優秀賞発表を司会が告げる場面"
    seconds: 10
    gender: any
    category: イベント・式典
  - id: n243
    kind: narration
    text: "卒園児の皆さん、入場です。三年前、泣きながら門をくぐった小さな足が、今日は自分でこの花道を歩きます。保護者の皆さま、どうぞカメラをいったん下ろして、その姿を、まっすぐ目に焼き付けてあげてください。"
    tags: [温, 涙]
    tone: ソフト
    situation: "保育園の卒園式、卒園児の入場を司会が告げる場面"
    seconds: 20
    gender: any
    category: イベント・式典
  - id: n244
    kind: narration
    text: "七年前、私たちは一つの問いから始めました。移動は、もっと静かになれるか。それから、三百二十四回の衝突試験、十一万キロの走行テスト、そして、七度の全面設計やり直し。本日、その答えをお見せします。会場の皆さま、音をお聞きください。……何も聞こえない。それが、答えです。ステージ中央へ、ご注目ください。"
    tags: [緊張, 動]
    tone: クール
    situation: "自動車メーカーの新型車発表会、ベール披露直前のオープニング"
    seconds: 30
    gender: any
    category: イベント・式典
  - id: n254
    kind: narration
    text: "扉を開けると、森が、客室の続きになる。全十二室、すべてに檜の露天風呂と、専属のバトラーを。朝は、庭で採れたいちじくの一皿から。夜は、暖炉の火だけを灯して、三百年の杉がざわめく音を。足りないものは、ひとつだけ。あなたの予定に、空白を。森のオーベルジュ、ホテル・シルヴァ、開業一周年。この秋、記念の一夜を、特別価格でご案内します。"
    tags: [動, 温]
    tone: ゴージャス
    situation: "森の高級オーベルジュのWeb限定プロモ動画で、客室と森の映像に乗せて誘う"
    seconds: 30
    gender: any
    category: Web・YouTube動画
  - id: n255
    kind: narration
    text: "全校生徒は、たった一人。それでも先生は毎朝、彼のためだけに黒板を書き続けました。春、学校は閉じます。"
    tags: [涙]
    tone: エモーショナル
    situation: "離島の分校の最後の一年を追った動画で、閉校を告げる場面に重ねる"
    seconds: 10
    gender: any
    category: Web・YouTube動画
  - id: n256
    kind: narration
    text: "さて、今回の検証は「百円ショップの道具だけでフルコース料理は作れるのか」。シェフ役は料理経験ゼロのわたくし。嫌な予感しかしませんが、火災報知器の電池は新品に替えてあります。それでは、いただきます、の前に、作ります。"
    tags: [笑]
    tone: コミカル
    situation: "検証系チャンネルの企画説明パートで、投稿者が視聴者におどけて前置きする"
    seconds: 20
    gender: any
    category: Web・YouTube動画
  - id: n257
    kind: narration
    text: "水深八千メートル。光は届かず、水温は二度を下回ります。それでも、ここには生き物がいます。カメラが捉えたのは、半透明の体を揺らす、名前のない魚でした。骨は柔らかく、目はほとんど退化しています。彼らは何を食べ、どこへ向かうのか。月の表面より、この海底のほうが、まだ地図の少ない場所なのです。"
    tags: [静]
    tone: ミステリアス
    situation: "深海生物の解説動画で、探査映像に合わせて視聴者を未知の世界へ引き込む"
    seconds: 30
    gender: any
    category: Web・YouTube動画
  - id: n267
    kind: narration
    text: "おかえりなさい、市長。あなたが留守の間に、公園の桜が咲きました。パン屋のおじさんは新作のメロンパンを焼いて、学校の子どもたちは、新しいバス停の名前を考えてくれています。やることはいっぱいだけど、焦らなくて大丈夫。この町は、あなたのペースで育っていきます。今日はまず、ベンチに座って、町の音を聞いてみませんか。"
    tags: [温]
    tone: フレンドリー
    situation: "街づくりゲームのログイン時に、案内役が久しぶりに戻ったプレイヤーを迎える"
    seconds: 30
    gender: any
    category: ゲーム内ナレーション
  - id: n268
    kind: narration
    text: "正解！これで十問連続！ボーナスステージ突入です！制限時間は倍、得点は三倍！さあ行こう！"
    tags: [動, 笑]
    tone: ハイテンション
    situation: "クイズゲームで連続正解した直後に、出題役がプレイヤーをボーナスへ送り出す"
    seconds: 10
    gender: any
    category: ゲーム内ナレーション
  - id: n269
    kind: narration
    text: "耳を澄まして。風が止んだら、空を見上げてください。今夜、千年に一度だけ姿を見せる星座、「眠り竜」が昇ります。ひとつ、またひとつ、光を指でつないで。竜が目を覚ます前に、すべての星を結びましょう。"
    tags: [静]
    tone: ウィスパー
    situation: "星座をつなぐパズルゲームの夜ステージで、語り部がプレイヤーに囁きかける"
    seconds: 20
    gender: any
    category: ゲーム内ナレーション
  - id: n270
    kind: narration
    text: "本日ご担当いただくのは、朝霧線、各駅停車、七時十二分発、湖南行きです。全十二駅、所要時間は四十一分。途中、第四トンネルの出口付近で濃霧が予想されています。速度制限は時速四十五キロ。停車位置のずれは五十センチ以内が目標です。到着時刻を守ることより、安全に止まることを優先してください。それでは、出発進行。"
    tags: [静]
    tone: ストレート
    situation: "鉄道運転シミュレーターの運行開始前に、指令役がプレイヤーへ路線を説明する"
    seconds: 30
    gender: any
    category: ゲーム内ナレーション
