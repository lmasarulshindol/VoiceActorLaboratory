# セリフくじの台本: ナレーション（女性）
# このフォルダ内の *.yaml はすべて読み込まれ、1つの台本として扱われる。id はフォルダ全体で重複不可
#
# kind: narration / dialogue
# seconds: 10 / 20 / 30
# gender: male / female / any（不問）
# category: ナレーションはジャンル名、セリフは場面の種類。新しい語を書くと画面の選択肢に増える
# tone: 読み方。ストレート / シリアス / ダイナミック / ソフト / クール / ゴージャス /
#       エモーショナル / コミカル / ミステリアス / フレンドリー / ハイテンション / ウィスパー
# situation: どこで、誰が、何のために読むか
# tags: 雰囲気タグ。静 / 動 / 笑 / 涙 / 緊張 / 温 から1〜2個
#
# 構成ルール（tests/test_lines_file.py で検証）
#   ジャンル・タグ・読み方のどれか1つで絞っても、男性/女性/不問それぞれ5本以上残ること
#   男性/女性/不問はそれぞれ30本以上
lines:
  - id: n002
    kind: narration
    text: "三十年、手を握ってきました。見送った夜の数だけ、ありがとうがありました。あおぞら福祉会、次の十年も、隣に。"
    tags: [涙]
    tone: エモーショナル
    situation: "介護施設の周年記念VPの締めで、夜勤明けの職員の横顔に重ねて読む"
    seconds: 10
    gender: female
    category: 企業VP
  - id: n003
    kind: narration
    text: "朝、目覚めたときの、肌のつっぱり。それ、乾燥のサインかもしれません。ゆきどけ化粧水は、とろりとした感触で、角質層のすみずみまで、うるおいを届けます。まずは一週間、手のひらで、違いを感じてください。"
    tags: [温]
    tone: ソフト
    situation: "洗面所で化粧水を手に取る女性を映すウェブ動画の紹介パート"
    seconds: 20
    gender: female
    category: 商品・サービス紹介
  - id: n007
    kind: narration
    text: "……聞こえますか。雨の音。窓の向こうの、やわらかな夜。そんな夜に、そっと灯す香り。アロマキャンドル、月のしずく。ひとりの時間が、少しだけ、好きになる。月のしずく、オンラインストアで。"
    tags: [静]
    tone: ウィスパー
    situation: "雨音のSEだけが流れる深夜ラジオ枠のアロマ用品CM"
    seconds: 20
    gender: female
    category: ラジオCM
  - id: n011
    kind: narration
    text: "さて、今週末は、ぐっと冷え込みそうですよ。お出かけの前に、上着を一枚、そしてマフラーも、お忘れなく。"
    tags: [温]
    tone: フレンドリー
    situation: "朝の情報番組で週末の天気予報図を見せながらのひとこと"
    seconds: 10
    gender: female
    category: 情報番組
  - id: n014
    kind: narration
    text: "というわけで、スタジオには、高級フルーツが、ずらり。あっ、ちょっと待って。今、誰か、こっそりメロンに手を伸ばしましたね？ええ、司会のあなたです。見てますよ。……はい、それでは気を取り直して、クイズのお時間です。"
    tags: [笑]
    tone: コミカル
    situation: "スタジオに並んだ果物を映すクイズ企画の導入ナレーション"
    seconds: 20
    gender: female
    category: バラエティ
  - id: n015
    kind: narration
    text: "山あいの小さな駅を降りると、ふわりと、甘い香りが迎えてくれました。この町の名物は、朝採れの、とうもろこし。畑のすぐそばの小屋で、おばあちゃんが、ひとつひとつ、炭火で焼いてくれます。ぱちぱちと、はぜる音。かぶりつけば、口いっぱいに広がる、やさしい甘さ。ああ、旅に出てよかった。そう思える、ひとときです。"
    tags: [温]
    tone: ソフト
    situation: "山間の無人駅から焼きとうもろこしの小屋へ向かう旅番組の一幕"
    seconds: 30
    gender: female
    category: 旅・グルメ番組
  - id: n020
    kind: narration
    text: "扉の向こうで、誰かが名前を呼んでいる。……それは、まだ生まれていないはずの、あなたの声。"
    tags: [静]
    tone: ミステリアス
    situation: "配信サイトで流れるホラー映画のティザー映像の冒頭"
    seconds: 10
    gender: female
    category: 映画・作品予告
  - id: n021
    kind: narration
    text: "この章では、情報セキュリティの基本となる、三つの要素を学びます。機密性、完全性、可用性。それぞれの頭文字をとって、CIAと呼ばれることもあります。まず機密性とは、許可された人だけが情報にアクセスできる状態を指します。例えば、パスワードの設定や、閲覧権限の管理がこれにあたります。では、動画を見ながら、ひとつずつ確認していきましょう。"
    tags: [静]
    tone: ストレート
    situation: "企業の新人研修用eラーニング動画、第一章の導入部分"
    seconds: 30
    gender: female
    category: 教育・eラーニング
  - id: n025
    kind: narration
    text: "手紙は、たった三行だった。元気でいてください。あの日のことを、私は忘れません。それから、ありがとう。母はその紙を胸に当てたまま、長いあいだ動かなかった。窓の外では、春の雨が音もなく庭を濡らしていた。私はただ、母の背中が小さく震えるのを、何も言えずに見ていた。言葉が追いつかないことが、この世にはあるのだと、初めて知った午後だった。"
    tags: [涙, 静]
    tone: エモーショナル
    situation: "朗読アプリで配信する短編小説の終盤、母が手紙を読む場面"
    seconds: 30
    gender: female
    category: オーディオブック
  - id: n027
    kind: narration
    text: "ようこそ、水音の森美術館へ。ここは、森に囲まれた小さな美術館です。最初の部屋では、この地に暮らした画家が描いた、四季の水辺の風景をご覧いただけます。どうぞ、ゆっくりとお進みください。"
    tags: [温]
    tone: ソフト
    situation: "森の中の美術館で貸し出す音声ガイドの最初の案内"
    seconds: 20
    gender: female
    category: 観光・施設ガイド
  - id: n032
    kind: narration
    text: "さあ、始まりました、夏の屋台グランプリ！今年のエントリーは、過去最多の五十店舗！優勝はどの店だ！"
    tags: [動, 笑]
    tone: ハイテンション
    situation: "グルメイベントのオープニング、ステージ前での開幕コール"
    seconds: 10
    gender: female
    category: イベント・式典
  - id: n034
    kind: narration
    text: "月曜の朝、目覚ましを三回止めたあなたへ。この動画は、五分で元気になる、ゆるい体操です。たぶん。"
    tags: [笑]
    tone: コミカル
    situation: "ストレッチ動画のショート広告、冒頭五秒でつかむ一言"
    seconds: 10
    gender: female
    category: Web・YouTube動画
  - id: n041
    kind: narration
    text: "止まらない。夜も、嵐の日も。日本中の「届けたい」を、わたしたちが運ぶ。ハヤブサ物流。"
    tags: [動]
    tone: ダイナミック
    situation: "物流会社の採用向け企業VPで、深夜のトラックターミナル映像の冒頭"
    seconds: 10
    gender: female
    category: 企業VP
  - id: n042
    kind: narration
    text: "この香りの正体を、あなたは知らない。朝の森の湿った土、焼きたてのパンの甘さ。わたしたちは、記憶の奥に眠る匂いを、分子のひとつひとつから呼び覚ます。見えないものを、かたちにする会社。ルミエ香料研究所。"
    tags: [静]
    tone: ミステリアス
    situation: "香料メーカーの企業VPで、暗い研究室に光が差す映像に乗せる導入部"
    seconds: 20
    gender: female
    category: 企業VP
  - id: n043
    kind: narration
    text: "「おはようございます」。朝六時、店の裏口で交わされる挨拶から、わたしたちの一日は始まります。地元の畑から届いたばかりの野菜を並べ、常連さんの好みを覚え、小さなお子さんには、ちょっとだけ目線を下げて。マルハナストアは、創業以来ずっと、この町の台所であり続けてきました。これからも、顔の見える毎日を、大切にしていきます。"
    tags: [温, 笑]
    tone: フレンドリー
    situation: "地域スーパーの企業VPで、開店前の店内と従業員の様子に乗せる本編"
    seconds: 30
    gender: female
    category: 企業VP
  - id: n044
    kind: narration
    text: "作りたいものがある人、集まれ！企画も、絵も、音も、ぜんぶ本気。トビラ・ゲームズで待ってます！"
    tags: [動, 笑]
    tone: ハイテンション
    situation: "ゲーム開発会社の新卒採用VPで、オフィスの賑やかな映像に乗せる締め"
    seconds: 10
    gender: female
    category: 企業VP
  - id: n055
    kind: narration
    text: "十年分の汚れ、三十秒で消します。「ジェットクリア」の水圧は、従来機の二倍。玄関のタイル、車のホイール、ベランダの黒ずみまで、一気に剥がして洗い流す。週末の掃除が、ちょっと楽しみになる。そんな一台です。"
    tags: [動]
    tone: ダイナミック
    situation: "高圧洗浄機の商品紹介動画で、汚れが一気に落ちる実演映像に乗せる本編"
    seconds: 20
    gender: female
    category: 商品・サービス紹介
  - id: n056
    kind: narration
    text: "一日の終わりに、湯船に、ひとさじ。「ゆらぎの湯」は、信州の温泉成分と、ヒノキの香りをそのまま閉じ込めた入浴剤です。お湯に溶けていく音を、聞いてみてください。肩まで浸かって、ゆっくり、三回、深呼吸。今日がんばったことも、うまくいかなかったことも、湯気と一緒に、天井へのぼっていきます。おやすみ前の十五分を、あなただけの時間に。"
    tags: [静, 温]
    tone: ウィスパー
    situation: "入浴剤の商品紹介動画で、湯気の立つ浴室を静かに映す映像に乗せる全編"
    seconds: 30
    gender: female
    category: 商品・サービス紹介
  - id: n057
    kind: narration
    text: "毎月一日、あなたの家に届く、差出人のない箱。中身は、開けた人だけが知っている。「ナゾ便」。"
    tags: [静, 緊張]
    tone: ミステリアス
    situation: "謎解きサブスクの紹介動画で、暗い玄関に箱が置かれる映像に乗せる導入"
    seconds: 10
    gender: female
    category: 商品・サービス紹介
  - id: n058
    kind: narration
    text: "今日のごはん、何にしよう。その悩み、預けてみませんか。「ハレゴハン」は、下ごしらえ済みの食材とレシピが、週に三回届く宅配サービス。包丁を使うのは、ほんの数分。できたてを囲む時間のほうを、ゆっくり楽しんでください。"
    tags: [温, 笑]
    tone: フレンドリー
    situation: "料理キット宅配サービスの紹介動画で、家族が食卓を囲む映像に乗せる本編"
    seconds: 20
    gender: female
    category: 商品・サービス紹介
  - id: n067
    kind: narration
    text: "その揺れは、いつ来るかわからない。備えは、今日のうちに。防災セット、ソナエル。"
    tags: [緊張]
    tone: シリアス
    situation: "地震速報の画面を映す防災用品CMで、視聴者に備えを促す"
    seconds: 10
    gender: female
    category: テレビCM
  - id: n068
    kind: narration
    text: "見えるということは、思っているより、ずっと静かなことです。朝の光の粒も、子どもの寝顔のまつげも。あなたの毎日に、ちょうどいい一本を。メガネのミルハ、全国百二十店舗。"
    tags: [静]
    tone: ストレート
    situation: "静かな室内の映像に乗せる眼鏡店CMで、視聴者に淡々と語りかける"
    seconds: 20
    gender: female
    category: テレビCM
  - id: n069
    kind: narration
    text: "さあ、今夜も始まりました。晩ごはん、どうするか選手権。カレーは昨日やった。パスタは麺がない。え、もう七時？そこで登場、凍ったままフライパンへ、五分で羽根つき。パリッと焼けたら、はい優勝。家族の「おいしい」まで、あと五分。『まんぷく餃子』。冷凍庫に、一袋のゆとりを。"
    tags: [笑]
    tone: コミカル
    situation: "台所で慌てる主婦のコント風映像に乗せる冷凍餃子CMの全編"
    seconds: 30
    gender: female
    category: テレビCM
  - id: n070
    kind: narration
    text: "この夏、びしょ濡れ上等！新アトラクション、スプラッシュ・ジャングル！キララランドで、待ってるよ！"
    tags: [動]
    tone: ハイテンション
    situation: "水しぶきの映像に乗せる遊園地の夏イベントCMで、家族連れを誘う"
    seconds: 10
    gender: female
    category: テレビCM
  - id: n071
    kind: narration
    text: "夜の深いところで、音が、ひとつずつ消えていく。頭をあずけた瞬間に、今日という日が、そっとほどけていく。眠りの形は、人の数だけある。あなただけの一つを、測って作る。オーダー枕のネムリノ。"
    tags: [静]
    tone: ウィスパー
    situation: "暗い寝室の映像に乗せるオーダー枕CMで、視聴者の耳元に囁く"
    seconds: 20
    gender: female
    category: テレビCM
  - id: n080
    kind: narration
    text: "指先に、ひとつぶの星を。ダイヤモンドフェア、開催中。ジュエリーのルミエール、本店にて。"
    tags: [動]
    tone: ゴージャス
    situation: "週末昼のラジオで流れる宝飾店のフェア告知CMで、華やかに誘う"
    seconds: 10
    gender: female
    category: ラジオCM
  - id: n081
    kind: narration
    text: "その電話、本当に息子さんですか。『声が変わった』『会社の金をなくした』『今日中に』。急がせる言葉は、詐欺の合図です。電話を切って、本人にかけ直してください。おかしいと思ったら、お近くの警察まで。"
    tags: [緊張]
    tone: シリアス
    situation: "昼のラジオで流れる特殊詐欺防止の公共CMで、高齢の聴き手に訴える"
    seconds: 20
    gender: female
    category: ラジオCM
  - id: n082
    kind: narration
    text: "走れ。昨日の自分を、追い越すために。十一月十五日、海沿いの四十二・一九五キロが、あなたを待っている。潮風を切り、橋を渡り、声援の中を駆け抜ける。初めてでもいい。歩いてもいい。ゴールテープは、全員の分だけ用意してある。第十回、湊川シーサイドマラソン。エントリーは今月末まで。さあ、靴ひもを結べ。"
    tags: [動]
    tone: ダイナミック
    situation: "スポーツ番組の合間に流れる市民マラソン参加者募集CMで、力強く鼓舞する"
    seconds: 30
    gender: female
    category: ラジオCM
  - id: n083
    kind: narration
    text: "もう一度、名前を呼んでくれる人を、待っています。保護犬譲渡会、今週日曜、市民公園にて。"
    tags: [涙, 温]
    tone: エモーショナル
    situation: "休日午前のラジオで流れる保護犬譲渡会の告知CMで、聴き手の情に訴える"
    seconds: 10
    gender: female
    category: ラジオCM
  - id: n093
    kind: narration
    text: "午前二時十四分、搬送要請。心肺停止、到着まで六分。救命救急センターの夜は、まだ終わらない。"
    tags: [緊張]
    tone: クール
    situation: "救命救急センターの夜間映像に乗せる医療密着番組で、感情を抑えて伝える"
    seconds: 10
    gender: female
    category: ドキュメンタリー
  - id: n094
    kind: narration
    text: "原料は、楮の皮。冬の冷たい川に、何日もさらします。簀桁を揺らし、繊維を重ねる。一枚を漉くのに、およそ十秒。しかしこの十秒を身につけるのに、職人は二十年を費やしました。千年持つと言われる紙は、こうして生まれます。"
    tags: [静]
    tone: ストレート
    situation: "和紙職人の作業映像に乗せる伝統工芸番組の一場面で、淡々と事実を述べる"
    seconds: 20
    gender: female
    category: ドキュメンタリー
  - id: n095
    kind: narration
    text: "水深二百メートル。船長の勘だけを頼りに、糸は海の底へ沈んでいく。待つこと、六時間。ついに、竿がしなった。全長二メートル、重さ百八十キロ。巨大なクロマグロとの、三十分に及ぶ格闘が始まる。荒れる冬の津軽海峡、一本釣り漁師たちの、命がけの冬。カメラは、揺れる甲板から、その瞬間を捉えた。"
    tags: [動, 緊張]
    tone: ダイナミック
    situation: "冬の海で巨大マグロと格闘する漁師を映す番組の導入で、力強く語る"
    seconds: 30
    gender: female
    category: ドキュメンタリー
  - id: n096
    kind: narration
    text: "夜明けとともに、産声がひとつ。この助産院で生まれた命は、今日で、千二百人目になりました。"
    tags: [温, 静]
    tone: ソフト
    situation: "助産院の朝を映す出産密着番組の一場面で、視聴者にやわらかく語る"
    seconds: 10
    gender: female
    category: ドキュメンタリー
  - id: n097
    kind: narration
    text: "午前十時、エサの時間です。整然と並ぶペンギンたちの中に、一羽だけ列を無視して飼育員の足元へ突進する影が。名前はモモタロウ、三歳。彼の辞書に「順番」の文字はありません。"
    tags: [笑]
    tone: コミカル
    situation: "動物園の飼育密着番組で、給餌中に列を乱す一羽のペンギンを紹介する場面"
    seconds: 20
    gender: female
    category: ドキュメンタリー
  - id: n107
    kind: narration
    text: "続いては、秋の贅沢アフタヌーンティー特集。本日ご紹介するのは、天井高八メートルのラウンジで味わう三段スタンド。栗のモンブラン、無花果のタルト、金箔をあしらったショコラ。紅茶は三十種類。優雅な午後、いかがですか。"
    tags: [動]
    tone: ゴージャス
    situation: "昼の情報番組のグルメ特集で、ホテルラウンジの映像に合わせて読む場面"
    seconds: 20
    gender: female
    category: 情報番組
  - id: n108
    kind: narration
    text: "ここからは、急増する「宅配詐欺」の手口を解説します。まず、不在通知を装ったメッセージが届く。記載された番号へ電話をかけると、本人確認と称して口座情報を聞き出される。見分けるポイントは三つ。送信元に心当たりがない、再配達の期限を短く区切っている、電話での対応を求めている。ひとつでも当てはまれば、まず疑ってください。"
    tags: [緊張]
    tone: クール
    situation: "夕方の情報番組の特集で、詐欺メッセージの再現画面を示しながら解説する場面"
    seconds: 30
    gender: female
    category: 情報番組
  - id: n109
    kind: narration
    text: "四十二年、同じ路線を走ったバスの最終便。終点で待っていたのは、かつての乗客、二百人の拍手でした。"
    tags: [涙, 温]
    tone: エモーショナル
    situation: "朝の情報番組の人物コーナーで、定年退職する運転士の最終運行の映像に重ねる"
    seconds: 10
    gender: female
    category: 情報番組
  - id: n110
    kind: narration
    text: "いよいよ明日、湾岸エリアに巨大水族館が誕生します。目玉は、高さ十二メートル、水量五千トンの大水槽。頭上を悠々と横切るマンタの群れは、まさに圧巻。この週末は、海の中へ飛び込みましょう。"
    tags: [動]
    tone: ダイナミック
    situation: "朝の情報番組のお出かけコーナーで、新水族館の内覧映像に合わせて読む"
    seconds: 20
    gender: female
    category: 情報番組
  - id: n119
    kind: narration
    text: "脱出まで、残り三分。鍵は見つかった。しかし、扉はまだ開かない。チームの運命は、最後の暗号に懸かる。"
    tags: [緊張]
    tone: シリアス
    situation: "脱出ゲーム企画で、制限時間が迫る中の緊迫した場面に入れる語り"
    seconds: 10
    gender: female
    category: バラエティ
  - id: n120
    kind: narration
    text: "ここに並んだ五人。全員が寿司職人を名乗っていますが、本物はたった一人。残りの四人は、昨日初めて包丁を握った素人です。手さばき、姿勢。あなたは、見抜けますか。回答者に許されるのは、質問三つのみ。制限時間、五分。"
    tags: [緊張, 静]
    tone: クール
    situation: "バラエティの見抜き企画で、横一列に並んだ五人を映しながら問いかける"
    seconds: 20
    gender: female
    category: バラエティ
  - id: n121
    kind: narration
    text: "本日のお宿は、一泊なんと百万円。都心の最上階、ワンフロアまるごと貸し切りのロイヤルスイートです。扉を開けると、広がるのは二百平米のリビング。天井には三千個のクリスタルが輝くシャンデリア、窓の向こうには三百六十度の夜景。バスルームには、黄金の猫足バスタブ。果たして、芸人コンビは百万円の夜をどう過ごすのか。ご覧ください。"
    tags: [動]
    tone: ゴージャス
    situation: "高級ホテル宿泊企画の導入で、スイートルームの内装を順に映しながら読む"
    seconds: 30
    gender: female
    category: バラエティ
  - id: n122
    kind: narration
    text: "深夜二時、誰も押していないのに、エレベーターは四階で止まった。その階に、部屋はない。"
    tags: [静, 緊張]
    tone: ミステリアス
    situation: "都市伝説バラエティで、再現VTRのエレベーター映像に重ねて読む一言"
    seconds: 10
    gender: female
    category: バラエティ
  - id: n133
    kind: narration
    text: "この店で握りを任されるまで、十年。弟子は毎朝四時に魚を見極め、師匠の一言を待つ。今日、初めてカウンターに立つ。客の前で震える手、しかしシャリの温度に迷いはない。一貫に、十年分の覚悟が込められている。"
    tags: [緊張]
    tone: シリアス
    situation: "老舗鮨店で弟子が初めてカウンターに立つ日を追うグルメドキュメンタリー"
    seconds: 20
    gender: female
    category: 旅・グルメ番組
  - id: n134
    kind: narration
    text: "雪に閉ざされた酒蔵。蔵人たちは、午前三時に仕込みを始める。米を蒸す湯気、冷え切った床、会話はない。麹の温度は、一度のずれも許されない。杜氏は手のひらだけで、その変化を読み取る。百年続く味は、この無言の作業の積み重ねでしか生まれない。ひと冬の緊張を、一杯の中に閉じ込めて。"
    tags: [緊張, 静]
    tone: クール
    situation: "雪国の酒蔵で未明の仕込みを追うグルメ番組の冬の特集ナレーション"
    seconds: 30
    gender: female
    category: 旅・グルメ番組
  - id: n135
    kind: narration
    text: "海の上の、一夜限りの晩餐。七皿のフルコースの向こうで、瀬戸内の島影が、ひとつ、またひとつ、暮れていきます。"
    tags: [動]
    tone: ゴージャス
    situation: "瀬戸内を巡るクルーズ船のディナーを紹介する旅番組の導入"
    seconds: 10
    gender: female
    category: 旅・グルメ番組
  - id: n136
    kind: narration
    text: "目の前に横たわるのは、百二十キロの本マグロ！　包丁が入るたび、歓声が上がる。赤身、中トロ、大トロ。切り分けられた瞬間、港の空気が変わる。海の王者が、今日の主役になる瞬間です。"
    tags: [動]
    tone: ダイナミック
    situation: "漁港のマグロ解体ショーを伝える旅番組の現地ナレーション"
    seconds: 20
    gender: female
    category: 旅・グルメ番組
  - id: n145
    kind: narration
    text: "体操女子、平均台。幅十センチの上で、彼女は四年間の練習を、九十秒に込める。"
    tags: [静]
    tone: ストレート
    situation: "体操女子平均台の演技直前に流れる選手紹介のナレーション"
    seconds: 10
    gender: female
    category: スポーツ
  - id: n146
    kind: narration
    text: "夏の浜辺で開かれた、地域のビーチバレー大会。参加チームは十二組、年齢は八歳から七十二歳まで。砂まみれになって転んでも、みんな笑ってる。ボールがつながるたびに、海より大きな声援が上がりました。"
    tags: [温, 笑]
    tone: フレンドリー
    situation: "地域のビーチバレー大会を伝えるローカル局スポーツコーナー"
    seconds: 20
    gender: female
    category: スポーツ
  - id: n147
    kind: narration
    text: "秋のターフを彩る、年に一度の祭典。十八頭のサラブレッドが、ゲートに収まりました。鮮やかな勝負服、磨き上げられた馬体、スタンドを埋める十万人の視線。歴史に名を刻むのは、どの馬か。ファンファーレが響き渡り、空気が一変します。二千四百メートルの先に待つ栄光へ。今、ゲートが開きました！"
    tags: [動]
    tone: ゴージャス
    situation: "秋のG1競馬中継でゲートインからスタートまでを飾るナレーション"
    seconds: 30
    gender: female
    category: スポーツ
  - id: n148
    kind: narration
    text: "無名の挑戦者。記録なし、所属なし。ただひとつ分かっているのは、十二戦、すべて一回で終わらせていること。"
    tags: [静, 緊張]
    tone: ミステリアス
    situation: "無名の挑戦者を紹介するボクシング中継の煽りVTR"
    seconds: 10
    gender: female
    category: スポーツ
  - id: n149
    kind: narration
    text: "膝の大けがから、七百日。もう飛べないと言われた彼女が、再びスタートゲートに座っています。踏み切り、飛翔、そして着地。距離は自己ベストには届かなかった。それでも、観客は全員が立ち上がった。おかえりなさい。"
    tags: [涙]
    tone: エモーショナル
    situation: "大けがから復帰したジャンプ選手を伝えるスポーツニュースの特集"
    seconds: 20
    gender: female
    category: スポーツ
  - id: n158
    kind: narration
    text: "三年ぶりに震えた、携帯の画面。彼女はまだ、その名前を消せずにいた。恋愛映画『未読』、二月、公開。"
    tags: [静]
    tone: ウィスパー
    situation: "恋愛映画の特報、映画館の予告枠で女性の囁き声で流れる"
    seconds: 10
    gender: female
    category: 映画・作品予告
  - id: n159
    kind: narration
    text: "日本最北の島に、ひとりで灯台を守り続けた女性がいた。四十年間、嵐の日も凪の日も、彼女は毎晩同じ時刻に光を灯した。ドキュメンタリー映画『灯を継ぐ人』、この秋、全国順次公開。"
    tags: [静]
    tone: ストレート
    situation: "ドキュメンタリー映画の予告編、ミニシアターの上映前に流れる"
    seconds: 20
    gender: female
    category: 映画・作品予告
  - id: n160
    kind: narration
    text: "それは、誰も疑わなかった判決だった。十年前に閉じられた事件の記録を、ひとりの新米弁護士が開く。消えた証人、書き換えられた供述、そして沈黙を続ける元判事。真実に近づくほど、彼女の周りから人が消えていく。最後に法廷に立つのは、正義か、それとも……。社会派サスペンス『第七法廷』、十一月、公開。"
    tags: [緊張]
    tone: シリアス
    situation: "法廷サスペンス映画の予告編、動画配信サイトの広告枠で流れる"
    seconds: 30
    gender: female
    category: 映画・作品予告
  - id: n161
    kind: narration
    text: "おばあちゃんと、しゃべる猫の、ちいさな毎日。アニメーション映画『ねこと縁側』、春、公開。"
    tags: [温]
    tone: ソフト
    situation: "家族向けアニメ映画の特報、親子向け番組の合間に流れる"
    seconds: 10
    gender: female
    category: 映画・作品予告
  - id: n172
    kind: narration
    text: "みんな、準備はいい？今日の実験は、台所にあるものだけで虹を作っちゃいます！用意するのは、お水と、お砂糖と、食紅、それだけ！さあ、エプロンをつけて、レッツ・サイエンス！"
    tags: [動]
    tone: ハイテンション
    situation: "小学生向けオンライン理科教室、実験動画のオープニング"
    seconds: 20
    gender: female
    category: 教育・eラーニング
  - id: n173
    kind: narration
    text: "ようこそ、ソムリエ養成講座へ。グラスを傾けた瞬間に立ちのぼる香り、舌の上で広がる余韻、そして、その一杯が生まれた土地の物語。この講座では、世界の銘醸地を巡りながら、テイスティングの技法と、ゲストを魅了するサービスの所作を学んでいきます。第一章は、ブドウの品種から。さあ、優雅な旅の始まりです。"
    tags: [動]
    tone: ゴージャス
    situation: "ソムリエ資格講座のeラーニング、第一章の冒頭で講師が受講者に語る"
    seconds: 30
    gender: female
    category: 教育・eラーニング
  - id: n174
    kind: narration
    text: "名刺を相手の鼻先にずいっと突き出すのは、もちろんNGです！さて、正しい渡し方は？"
    tags: [笑]
    tone: コミカル
    situation: "新社会人向けビジネスマナー講座、クイズコーナーの導入"
    seconds: 10
    gender: female
    category: 教育・eラーニング
  - id: n175
    kind: narration
    text: "この一通の手紙は、昭和二十年の夏、十七歳の少年が母に宛てて書いたものです。『お母さん、どうか泣かないでください』。歴史は、年号ではなく、こうした声でできています。今日は、その声に耳を傾けましょう。"
    tags: [涙]
    tone: エモーショナル
    situation: "高校生向け歴史オンライン教材、戦時下の手紙を読み解く単元の導入"
    seconds: 20
    gender: female
    category: 教育・eラーニング
  - id: n184
    kind: narration
    text: "検査中は、いつものように眠るだけで大丈夫です。センサーが、あなたの眠りを静かに記録します。"
    tags: [静]
    tone: ウィスパー
    situation: "睡眠外来の検査説明動画、受診者が検査前に個室で視聴する"
    seconds: 10
    gender: female
    category: 医療・科学技術
  - id: n185
    kind: narration
    text: "妊娠二十週を過ぎるころから、おなかの赤ちゃんの耳は、外の音を聞き取り始めると言われています。今日の健診では、超音波で赤ちゃんの心臓の動きを確認します。どうぞ、リラックスして、画面をご覧くださいね。"
    tags: [温]
    tone: ソフト
    situation: "産婦人科の待合室で流れる妊婦健診の説明映像の一節"
    seconds: 20
    gender: female
    category: 医療・科学技術
  - id: n186
    kind: narration
    text: "こんにちは！ここは『見えない働き者たち』のコーナー。みなさんが今朝食べたお味噌汁も、パンも、ヨーグルトも、実はちいさな微生物たちが作ってくれたものなんです。この顕微鏡をのぞいてみてください。せっせと動いているのが、乳酸菌。一グラムの中に、なんと十億匹以上！さあ、彼らがどうやって食べ物をおいしくするのか、一緒に見ていきましょう！"
    tags: [温]
    tone: フレンドリー
    situation: "科学館の微生物展示コーナーで来館者向けに流れる解説音声"
    seconds: 30
    gender: female
    category: 医療・科学技術
  - id: n187
    kind: narration
    text: "ついに来た！　新型ロボット手術支援システム、お披露目です！　今日はその精度を、たっぷり体感してください！"
    tags: [動]
    tone: ハイテンション
    situation: "医療機器展示会のステージで、司会者が来場者に向けて新製品を紹介する"
    seconds: 10
    gender: female
    category: 医療・科学技術
  - id: n188
    kind: narration
    text: "さあ始まりました、白衣のばい菌バトル！　本日の挑戦者は、手洗い三十秒の壁に挑む小学三年生チーム。おっと、指の間を忘れていますよ！　ばい菌さん、ニヤリと笑っています！"
    tags: [笑, 動]
    tone: コミカル
    situation: "小学校の保健室で流す手洗い啓発アニメの実況風ナレーション"
    seconds: 20
    gender: female
    category: 医療・科学技術
  - id: n197
    kind: narration
    text: "データは消去した。痕跡も残していない。それでも彼女は、鏡の中の自分と目を合わせられなかった。"
    tags: [緊張, 静]
    tone: クール
    situation: "サスペンス小説のオーディオブック、主人公が証拠を消した直後の一節"
    seconds: 10
    gender: female
    category: オーディオブック
  - id: n198
    kind: narration
    text: "号砲が鳴った。八頭の馬が、土煙とともに一斉に飛び出す。先頭を奪ったのは、無名の牝馬、ハヤテノユメ。観客席がどよめく。第四コーナー、鞭が入る。追う、追う、追いすがる。だが、彼女は振り向かなかった。"
    tags: [動, 緊張]
    tone: ダイナミック
    situation: "競馬を題材にした青春小説のオーディオブック、レースの山場を読む"
    seconds: 20
    gender: female
    category: オーディオブック
  - id: n199
    kind: narration
    text: "おばあちゃんの台所には、いつも小さな鍋が火にかかっていた。何を煮ているのか、聞いても教えてくれない。ただ、学校から帰ると、湯気の向こうで「おかえり」と笑うのだった。あれから二十年。私は今、同じ鍋で同じ匂いを立てながら、玄関の音を待っている。娘が、もうすぐ帰ってくる。"
    tags: [温, 静]
    tone: ソフト
    situation: "家族を描いた連作短編のオーディオブック、祖母の台所を回想する一節"
    seconds: 30
    gender: female
    category: オーディオブック
  - id: n200
    kind: narration
    text: "シャンデリアが揺れ、千の蝋燭が一斉に灯る。舞踏会の夜、仮面の令嬢は階段の上で、ゆっくりと扇を開いた。"
    tags: [動]
    tone: ゴージャス
    situation: "宮廷ロマンス小説のオーディオブック、舞踏会の幕開けを華やかに読む"
    seconds: 10
    gender: female
    category: オーディオブック
  - id: n211
    kind: narration
    text: "ここは、津波が到達した高さを示す標柱です。地上十四メートル。あの日、この地点にいた人の多くが、高台への道を間違えました。正しい避難路は、あなたの右手、黄色い矢印の方向です。どうか、覚えて帰ってください。"
    tags: [緊張]
    tone: シリアス
    situation: "震災遺構を巡る学習ツアーの音声ガイド、津波到達地点での説明"
    seconds: 20
    gender: female
    category: 観光・施設ガイド
  - id: n212
    kind: narration
    text: "こちらは、江戸時代に建てられた酒蔵を改装した資料館です。一階では、米を蒸す甑と、仕込みに使われた直径二メートルの木桶をご覧いただけます。二階は、杜氏たちが寝泊まりした部屋をそのまま残しています。展示物には手を触れないでください。所要時間はおよそ三十分。順路に沿ってお進みください。"
    tags: [静]
    tone: ストレート
    situation: "酒蔵を改装した郷土資料館の音声ガイド、入館直後の全体案内"
    seconds: 30
    gender: female
    category: 観光・施設ガイド
  - id: n213
    kind: narration
    text: "いらっしゃい！　ここ、ひまわり牧場では、羊に直接えさをあげられますよ。手のひらを平らにして、どうぞ。"
    tags: [温, 笑]
    tone: フレンドリー
    situation: "観光牧場のふれあい広場で流れる、来場者向けの案内放送"
    seconds: 10
    gender: female
    category: 観光・施設ガイド
  - id: n214
    kind: narration
    text: "いよいよ到着です、海底トンネル水族館！　頭の上を、ジンベエザメが通過中！　右を見ても魚、左を見ても魚、三百六十度、ぜーんぶ海！　この後は、イルカのジャンプショーが十五分後にスタート。走らず、でも急いで、二階へどうぞ！"
    tags: [動, 笑]
    tone: ハイテンション
    situation: "水族館の団体ツアーで、ガイドが海底トンネルで子どもたちを盛り上げる"
    seconds: 20
    gender: female
    category: 観光・施設ガイド
  - id: n223
    kind: narration
    text: "北都空港発、三〇八便、最終のご案内です。ご搭乗のお客様は、至急、十二番ゲートへお越しください。"
    tags: [緊張]
    tone: クール
    situation: "空港の搭乗口で流れる最終搭乗案内、出発直前の切迫した場面"
    seconds: 10
    gender: female
    category: アナウンス
  - id: n224
    kind: narration
    text: "まもなく、ドームの明かりが消えます。ここから先は、二万年前の夜空。携帯電話の光は、星の声をかき消してしまいます。どうか、電源をお切りください。目を閉じて、三つ数えたら……。いちばん近い星が、あなたを呼んでいます。"
    tags: [静]
    tone: ミステリアス
    situation: "プラネタリウムの上映前に流れる館内放送、暗転直前の場面"
    seconds: 20
    gender: female
    category: アナウンス
  - id: n225
    kind: narration
