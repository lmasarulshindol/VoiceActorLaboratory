# 誰がいつ何を知っているか。静的な面識フラグの更新正本。

phases:
  - id: start
    label: 開始時（律が入室した直後）
    knowledge:
      kiryu_saku:
        - 事実整理しか請けない自分のルール
        - 三年前に高遠母の転落を事故として閉じたこと（名前が接続される前は「閉じた案件の一つ」）
        - 灯の存在はまだ空欄
      takato_ritsu:
        - 灯は生きているが、五日自分の元には戻っていない
        - 留守電の現場に自分がいた
        - 朔の名前・退職・母の件の担当であること
        - 欲しいのは捜索ではなく書面
      takato_akari:
        - 律が今夜朔を訪ねること
        - 翠が上がること
        - 自分は死んでも失踪してもいない
      sena_midori:
        - 高遠家の三年前
        - 今朝の灯の連絡（生存、今夜の来訪）
        - 下で律の傘を見てから上がる予定

  - id: after_voicemail
    label: 留守電再生後（「待て」が聞こえたあと）
    knowledge:
      kiryu_saku:
        - 録音の奥に男の声がある
        - それは律の声に聞こえる
        - 律は「いなかった」と言い張る
      takato_ritsu:
        - 朔が奥の声を拾った
        - 否認を続ける必要がある
      takato_akari:
        - （不在。変化なし）
      sena_midori:
        - （まだ入室前。下にいる）

  - id: after_sena
    label: 翠登場後（宛先パート再生まで）
    knowledge:
      kiryu_saku:
        - 翠が三年前の記録を持ってきた
        - 灯の旧供述（呼ばれて降りていった）
        - 灯が今朝翠に連絡している
        - 留守電の宛先は自分である
        - 灯は死んでいない、と録音が言う
      takato_ritsu:
        - 翠が既知として上がってきた
        - 灯が朔宛てに先回りしていた
        - 「混乱していただけ」では通らなくなった
      takato_akari:
        - （不在。声だけが部屋にある）
      sena_midori:
        - この部屋の全員が、今、同じ録音を聞いている
        - 居所はまだ言わない

  - id: ending
    label: 終幕（依頼拒否のあと）
    knowledge:
      kiryu_saku:
        - 自分は盤面の外にいなかった
        - 灯も翠も律も、先に知っていた
        - 事実は揃った。書面は書かない
        - 三年前、灯の声をノイズにしたのは自分だ
      takato_ritsu:
        - 書面は得られない
        - 今夜の物語は自分のものではなくなった
        - 灯に会えるかは灯が決める
      takato_akari:
        - （不在のまま。声の結論だけが残る）
      sena_midori:
        - 朔が同じ結論を二度は書かない、と確認した
        - 住所は今夜も渡さない
